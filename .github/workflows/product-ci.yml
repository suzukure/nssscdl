name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準9コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: 全テスト
        if: steps.applicability.outputs.applicable == 'true'
        run: npm test

  state-probe-914:
    name: '#914 temporary systemd terminal-state probe'
    if: github.event.pull_request.number == 921 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Synthetic terminal-state lifecycle only
        shell: bash
        run: |
          set +e
          timeout --kill-after=3s 55s python3 -B - 2>/dev/null <<'PY'
          import json, os, pathlib, re, subprocess, sys, tempfile, time, uuid
          
          stage = 'settings'
          units = []
          outside = None
          passed = False
          root = pathlib.Path(tempfile.mkdtemp(prefix='nssscdl-state-probe-'))
          properties = 'LoadState,ActiveState,SubState,Result,InvocationID,Type,ExitType,RemainAfterExit,Restart,NRestarts,ExecMainCode,ExecMainStatus,User,Group,OOMPolicy,Delegate,NoNewPrivileges'
          
          def run(args):
              return subprocess.check_output(args, stderr=subprocess.DEVNULL, timeout=3,
                                             env={'PATH': '/usr/bin:/bin'}).decode().strip()
          
          def show(unit):
              raw = run(['sudo', '-n', 'systemctl', 'show', unit, '--property=' + properties])
              return dict(line.split('=', 1) for line in raw.splitlines() if '=' in line)
          
          def check(value):
              if not value:
                  raise ValueError()
          
          def until(fn, seconds=4):
              end = time.monotonic() + seconds
              while time.monotonic() < end:
                  value = fn()
                  if value:
                      return value
                  time.sleep(0.025)
              raise TimeoutError()
          
          def settings(s):
              expected = {'LoadState': 'loaded', 'Type': 'exec', 'ExitType': 'cgroup',
                          'RemainAfterExit': 'yes', 'Restart': 'no', 'NRestarts': '0',
                          'User': str(os.getuid()), 'Group': str(os.getgid()),
                          'OOMPolicy': 'stop', 'Delegate': 'no', 'NoNewPrivileges': 'yes'}
              check(all(s.get(k) == v for k, v in expected.items()))
          
          def observe(record, reader=show):
              if record['failed']:
                  return record['failed']
              if record.get('stop_requested'):
                  record['failed'] = 'stop-requested'
                  return record['failed']
              try:
                  s = reader(record['unit'])
                  settings(s)
                  check(s.get('InvocationID') == record['invocation'])
                  if s.get('Result') != 'success':
                      record['failed'] = 'failure'
                  elif s.get('ActiveState') == 'active' and s.get('SubState') == 'running':
                      return 'pending'
                  elif (s.get('ActiveState'), s.get('SubState'), s.get('ExecMainCode'), s.get('ExecMainStatus')) == ('active', 'exited', '1', '0'):
                      return 'terminal'
                  else:
                      record['failed'] = 'mismatch'
              except ValueError:
                  record['failed'] = 'mismatch'
              except Exception:
                  record['failed'] = 'unknown'
              return record['failed']
          
          def decide(record, marker, report, seconds=4, reader=show):
              try:
                  outcome = until(lambda: (o if (o := observe(record, reader)) != 'pending' else None), seconds)
              except TimeoutError:
                  record['failed'] = 'timeout'
                  return 'timeout'
              if outcome != 'terminal':
                  return outcome
              if observe(record, reader) != 'terminal':
                  return record['failed']
              if not report.is_file() or report.read_text() != 'complete':
                  record['failed'] = 'missing-report'
                  return record['failed']
              marker.unlink()
              record['accepted'] = True
              return 'accepted'
          
          def stop(unit):
              run(['sudo', '-n', 'systemctl', 'stop', unit])
              if show(unit).get('ActiveState') == 'failed':
                  run(['sudo', '-n', 'systemctl', 'reset-failed', unit])
              units.remove(unit)
          
          try:
              check(os.getuid() != 0)
              check(pathlib.Path('/sys/fs/cgroup/cgroup.controllers').is_file())
              check(int(run(['systemctl', '--version']).split()[1]) >= 250)
              run(['sudo', '-n', 'true'])
              child = root / 'child.py'
              child.write_text('''import json, os, pathlib, sys, time
          d = pathlib.Path(sys.argv[1])
          original_sid = os.getsid(0)
          if os.fork():
              os._exit(0)
          os.setsid()
          data = {"pid": os.getpid(), "uid": os.getuid(), "sid_changed": os.getsid(0) != original_sid}
          (d / "pending").write_text(json.dumps(data))
          (d / "pending").rename(d / "ready")
          end = time.monotonic() + 10
          while time.monotonic() < end and not (d / "release").exists():
              time.sleep(0.02)
          if (d / "release").exists():
              (d / "report").write_text("complete")
          ''')
              outside = subprocess.Popen(['/usr/bin/sleep', '45'], env={'PATH': '/usr/bin:/bin'},
                                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, start_new_session=True)
          
              def start(label, runtime='15s'):
                  global stage
                  stage = label + '_settings'
                  d = root / label
                  d.mkdir(mode=0o700)
                  marker = d / 'owned'
                  marker.write_text('retain')
                  unit = 'nssscdl-state-' + uuid.uuid4().hex + '.service'
                  units.append(unit)
                  props = ['Type=exec', 'ExitType=cgroup', 'RemainAfterExit=yes', 'Restart=no',
                           'OOMPolicy=stop', 'Delegate=no', 'KillMode=control-group',
                           'RuntimeMaxSec=' + runtime, 'TimeoutStartSec=5s', 'TimeoutStopSec=1s',
                           'StandardOutput=null', 'StandardError=null', 'NoNewPrivileges=yes',
                           'ProtectControlGroups=yes', 'RestrictSUIDSGID=yes', 'CollectMode=inactive',
                           'User=' + str(os.getuid()), 'Group=' + str(os.getgid())]
                  run(['sudo', '-n', 'systemd-run', '--quiet', '--unit=' + unit] +
                      ['--property=' + p for p in props] +
                      ['/usr/bin/env', '-i', 'PATH=/usr/bin:/bin', '/usr/bin/python3', '-B', str(child), str(d)])
                  stage = label + '_child_start'
                  until(lambda: (d / 'ready').is_file())
                  data = json.loads((d / 'ready').read_text())
                  check(data['uid'] == os.getuid() and data['sid_changed'])
                  stage = label + '_parent_exit'
                  s = until(lambda: (v if (v := show(unit)).get('ExecMainCode') == '1' else None))
                  settings(s)
                  check(s.get('ExecMainStatus') == '0')
                  check(re.fullmatch('[0-9a-f]{32}', s.get('InvocationID', '')))
                  record = {'unit': unit, 'invocation': s['InvocationID'], 'failed': '', 'accepted': False, 'stop_requested': False}
                  stage = label + '_child_retained'
                  check(observe(record) == 'pending')
                  os.kill(data['pid'], 0)
                  return record, d, marker
          
              record, d, marker = start('normal')
              print('STATE_PROBE=nonroot_parent_exit_child_retained', flush=True)
              stage = 'normal_terminal_state'
              (d / 'release').touch()
              outcome = until(lambda: (o if (o := observe(record)) != 'pending' else None))
              check(outcome == 'terminal')
              print('STATE_PROBE=same_invocation_active_exited', flush=True)
              stage = 'normal_workload_report'
              check(decide(record, marker, d / 'report') == 'accepted' and not marker.exists())
              print('STATE_PROBE=report_and_terminal_before_delete', flush=True)
          
              stage = 'unknown_preservation'
              unknown = dict(record, failed='', accepted=False)
              unknown_marker = d / 'unknown-owned'
              unknown_marker.write_text('retain')
              def unreadable(_):
                  raise OSError()
              check(decide(unknown, unknown_marker, d / 'report', reader=unreadable) == 'unknown')
              check(decide(unknown, unknown_marker, d / 'report') == 'unknown' and unknown_marker.exists())
              print('STATE_PROBE=injected_unknown_latched_owned_retained', flush=True)
              stage = 'normal_unrelated'
              check(outside.poll() is None)
              stage = 'normal_unit_dispose'
              stop(record['unit'])
          
              record, d, marker = start('owner')
              stage = 'owner_timeout_preservation'
              check(decide(record, marker, d / 'report', seconds=0.2) == 'timeout' and marker.exists())
              record['stop_requested'] = True
              stage = 'owner_unit_dispose'
              stop(record['unit'])
              stage = 'owner_timeout_latched'
              check(decide(record, marker, d / 'report') == 'timeout' and marker.exists())
              check(not (d / 'report').exists() and outside.poll() is None)
              print('STATE_PROBE=owner_timeout_stop_never_success_owned_retained', flush=True)
          
              record, d, marker = start('manager', runtime='2s')
              stage = 'manager_timeout_state'
              s = until(lambda: (v if (v := show(record['unit'])).get('Result') == 'timeout' and v.get('ActiveState') == 'failed' else None))
              check(s.get('InvocationID') == record['invocation'])
              check(s.get('ActiveState') == 'failed')
              stage = 'manager_timeout_preservation'
              check(decide(record, marker, d / 'report') == 'failure' and marker.exists())
              check(not (d / 'report').exists())
              print('STATE_PROBE=manager_timeout_not_success_owned_retained', flush=True)
              stage = 'manager_unit_dispose'
              stop(record['unit'])
              stage = 'unrelated'
              check(outside.poll() is None)
              print('STATE_PROBE=unrelated_process_unaffected', flush=True)
              passed = True
          except TimeoutError:
              print('STATE_PROBE=fail_' + stage + '_timeout', flush=True)
          except ValueError:
              print('STATE_PROBE=fail_' + stage + '_mismatch', flush=True)
          except Exception:
              print('STATE_PROBE=fail_' + stage + '_unknown', flush=True)
          finally:
              cleanup = True
              for unit in list(units):
                  try:
                      stop(unit)
                  except Exception:
                      cleanup = False
              if outside is not None:
                  outside.terminate()
                  try:
                      outside.wait(timeout=3)
                  except Exception:
                      outside.kill()
                      outside.wait(timeout=3)
                      cleanup = False
              print('STATE_PROBE=units_disposed' if cleanup else 'STATE_PROBE=cleanup_unknown', flush=True)
              print('STATE_PROBE=pass' if passed and cleanup else 'STATE_PROBE=fail', flush=True)
              sys.exit(0 if passed and cleanup else 1)
          PY
          result=$?
          if [ "$result" -ne 0 ]; then
            echo 'STATE_PROBE=job_failed'
            exit 1
          fi
