name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準8コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: '#930 booking unauthenticated proof (temporary)'
        if: steps.applicability.outputs.applicable == 'true' && github.event.action == 'opened' && github.run_attempt == 1
        timeout-minutes: 4
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const result = spawnSync(process.execPath, ['tests/evaluation/trusted-unauthenticated-booking-outer.mjs', '--run'], {
            encoding: 'utf8', timeout: 190000, maxBuffer: 4096, stdio: ['ignore', 'pipe', 'pipe']
          });
          if (result.error !== undefined || result.signal !== null || result.status !== 0 || result.stderr !== '' ||
              result.stdout !== "#1010 unauthenticated booking: isolated child prepared / readback unchanged / same invocation no-live / both ports closed / owned persistence,TMP,HOME,NSS,cert,key,report,log removed; partial evidence only; formal proof / Gate A-D unverified\n") {
            let stage = 'unknown';
            if (result.error === undefined && result.signal === null && result.status === 1 && result.stdout === '') {
              for (const allowed of ['preflight', 'start', 'report', 'ownership', 'release', 'remove', 'listeners', 'operator', 'unknown']) {
                if (result.stderr === 'TRUSTED_UNAUTHENTICATED_BOOKING_OUTER_FAILED; stage=' + allowed + '; retain owned files; do not retry\n') stage = allowed;
              }
            }
            let diagnostic = '';
            if (result.error === undefined && result.signal === null && result.status === 1 && result.stdout === '' &&
                typeof result.stderr === 'string' && result.stderr.length <= 512 && result.stderr.endsWith('\n')) {
              const text = result.stderr.slice(0, -1);
              const match = new RegExp('^(?:' + "(?=.*; unit_stop=confirmed; report=observed;|.*; report=(?:unknown|unread); entered=unknown; confirmed=unknown; tls_primary=unknown; tls_cleanup=unknown; tls_err=unknown;)TRUSTED_UNAUTHENTICATED_BOOKING_OUTER_FAILED; stage=terminal; reason=(cancel|timeout|manager|mismatch|unknown|unavailable|none); boundary=(pre-show|polling|first-exit|second-show|double-exit|unknown); state=(running|exited|failed|other|invalid|unavailable); result=(success|timeout|other|not-observed); exit=(zero|nonzero|abnormal-code|not-observed|unknown); invocation=(matched|mismatched|not-compared|unknown); cgroup=(expected|empty|other|unknown); second=(observed|not-observed); budget=(adequate|exhausted|aborted|unknown); stop=(confirmed|failed-state|identity-mismatch|state-unaccepted|stop-budget|show-unavailable|not-attempted|unknown); unit_stop=(confirmed|unknown); report=(observed|unknown|unread); entered=(unknown|import|preflight|seed|home|tls-setup|worker-start|dom-401|tls-cleanup|worker-stop|d1-unchanged|secret-scan|report-write); confirmed=(unknown|import|preflight|seed|home|tls-setup|worker-start|dom-401|tls-cleanup|worker-stop|d1-unchanged|secret-scan|report-write); tls_primary=(none|unknown|tls-preflight|tls-cert|tls-listener|tls-browser-launch|tls-browser-ownership|tls-browser-context|tls-browser-nss|tls-positive|tls-san|tls-untrusted|tls-consumer); tls_cleanup=(none|unknown|browser-close|browser-ownership|browser-process|proof-listener|worker-stop|port-close|generated-files|owned-inspect|owned-remove); tls_err=(ERR_CERT_AUTHORITY_INVALID|ERR_CERT_COMMON_NAME_INVALID|ERR_CERT_INVALID|ERR_SSL_PROTOCOL_ERROR|ERR_CONNECTION_REFUSED|ERR_CONNECTION_RESET|ERR_NAME_NOT_RESOLVED|ERR_TIMED_OUT|TIMEOUT|UNCLASSIFIED|unknown); evidence=unproved; retain owned files; do not retry" + ')$').exec(text);
              if (match && match[0] === text) { stage = 'terminal'; diagnostic = text.slice('TRUSTED_UNAUTHENTICATED_BOOKING_OUTER_FAILED; stage=terminal'.length); }
            }
            console.error('UNAUTHENTICATED_BOOKING_PROOF_FAILED; stage=' + stage + diagnostic);
            process.exitCode = 1;
          } else {
            console.log("#1010 unauthenticated booking: isolated child prepared / readback unchanged / same invocation no-live / both ports closed / owned persistence,TMP,HOME,NSS,cert,key,report,log removed; partial evidence only; formal proof / Gate A-D unverified");
          }
          NODE
