name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準8コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: "#1055 Stage2 runner environment survey (no browser session)"
        if: ${{ github.event.action == 'opened' && github.run_attempt == 1 && github.event.pull_request.draft == true && github.head_ref == 'investigate/issue-1055-stage2-runner-once' }}
        timeout-minutes: 7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "25fecbf1059844a462a0d2ba22b147453f7b33a4"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(uname -m)" = "x86_64"
          node --check tests/evaluation/issue-1055-cft157-runner-preflight.mjs
          node tests/evaluation/issue-1055-cft157-runner-preflight.mjs --self-test
          TEMP_CFT="$(mktemp -d "$RUNNER_TEMP/nssscdl-1055-XXXXXXXX")"
          cleanup_stage2() {
            set +e
            if [[ -n "$TEMP_CFT" && "$TEMP_CFT" == "$RUNNER_TEMP"/nssscdl-1055-* && -d "$TEMP_CFT" ]]; then
              rm -rf -- "$TEMP_CFT"
              if [[ ! -e "$TEMP_CFT" ]]; then
                echo "H9_STAGE2 stage=cleanup; result=owned-confirmed"
              else
                echo "H9_STAGE2 stage=cleanup; result=unknown"
              fi
            else
              echo "H9_STAGE2 stage=cleanup; result=unknown"
            fi
          }
          trap cleanup_stage2 EXIT
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --location --fail --silent --show-error \
            --max-time 120 --max-filesize 300000000 \
            'https://storage.googleapis.com/chrome-for-testing-public/157.0.8092.0/linux64/chrome-linux64.zip' \
            -o "$TEMP_CFT/chrome.zip"
          ACTUAL_HASH="$(sha256sum "$TEMP_CFT/chrome.zip" | cut -d ' ' -f1)"
          if [[ "$ACTUAL_HASH" != "28d4f185c9047a91fe79ee8d31e5e0b5b858fc107129b3df361fdd095dbb2ace" ]]; then
            echo "H9_STAGE2 stage=archive; result=observed-hash-drift"
            exit 1
          fi
          echo "H9_STAGE2 stage=archive; result=observed-zip-match"
          python3 -B tests/evaluation/issue-1055-cft-archive-preflight.py --self-test
          python3 -B tests/evaluation/issue-1055-cft-archive-preflight.py \
            "$TEMP_CFT/chrome.zip" "$TEMP_CFT/owned-extract"
          BINARY="$TEMP_CFT/owned-extract/chrome-linux64/chrome"
          if [[ -f "$BINARY" && ! -L "$BINARY" ]]; then chmod u+x "$BINARY"; fi
          timeout --signal=TERM --kill-after=5s 100s \
            node tests/evaluation/issue-1055-cft157-runner-preflight.mjs --probe "$TEMP_CFT" "$BINARY"
