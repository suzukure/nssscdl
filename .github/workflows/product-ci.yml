name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準9コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: 全テスト
        if: steps.applicability.outputs.applicable == 'true'
        run: npm test

      - name: '#914 temporary Chrome systemd sandbox lifecycle'
        if: steps.applicability.outputs.applicable == 'true' && github.event.pull_request.number == 921 && github.run_attempt == 1
        shell: bash
        run: |
          set +e
          timeout --kill-after=3s 55s python3 -B - 2>/dev/null <<'PY'
          import json, os, pathlib, re, shutil, stat, subprocess, sys, tempfile, time, uuid
          
          stage = 'preflight'
          unit = None
          unit_live = False
          accepted = False
          root = pathlib.Path(tempfile.mkdtemp(prefix='nssscdl-chrome-unit-'))
          root_identity = (root.stat().st_dev, root.stat().st_ino)
          home = root / 'browser-home'
          home.mkdir(mode=0o700)
          props = 'LoadState,ActiveState,SubState,Result,InvocationID,Type,ExitType,RemainAfterExit,Restart,NRestarts,ExecMainCode,ExecMainStatus,User,Group,OOMPolicy,Delegate,NoNewPrivileges,ProtectControlGroups'
          
          class ProbeFailure(Exception):
              def __init__(self, phase, result):
                  self.phase, self.result = phase, result
          
          def check(value):
              if not value:
                  raise ValueError()
          
          def run(args):
              return subprocess.check_output(args, stderr=subprocess.DEVNULL, timeout=3,
                                             env={'PATH': '/usr/bin:/bin'}).decode().strip()
          
          def show():
              raw = run(['sudo', '-n', 'systemctl', 'show', unit, '--property=' + props])
              return dict(line.split('=', 1) for line in raw.splitlines() if '=' in line)
          
          def settings(s):
              expected = {'LoadState': 'loaded', 'Type': 'exec', 'ExitType': 'cgroup',
                          'RemainAfterExit': 'yes', 'Restart': 'no', 'NRestarts': '0',
                          'User': str(os.getuid()), 'Group': str(os.getgid()), 'OOMPolicy': 'stop',
                          'Delegate': 'no', 'NoNewPrivileges': 'yes', 'ProtectControlGroups': 'yes'}
              check(all(s.get(k) == v for k, v in expected.items()))
          
          def read_report():
              path = root / 'result'
              if not path.exists():
                  return None
              check(path.stat().st_size <= 512)
              data = json.loads(path.read_text())
              check(set(data) == {'stage', 'status'})
              check(data['stage'] in ('preflight', 'launch', 'root-wait', 'context', 'page', 'close', 'files', 'report'))
              check(data['status'] in ('pass', 'failure'))
              if data['status'] == 'failure':
                  raise ProbeFailure(data['stage'], 'failure')
              check(data['stage'] == 'report')
              return data
          
          def until(fn, seconds):
              end = time.monotonic() + seconds
              while time.monotonic() < end:
                  read_report()
                  result = fn()
                  if result:
                      return result
                  time.sleep(0.025)
              raise TimeoutError()
          
          def stop():
              global unit_live
              run(['sudo', '-n', 'systemctl', 'stop', unit])
              if show().get('ActiveState') == 'failed':
                  run(['sudo', '-n', 'systemctl', 'reset-failed', unit])
              unit_live = False
          
          def root_attestation(profile):
              matches = []
              for proc in pathlib.Path('/proc').iterdir():
                  if not proc.name.isdecimal():
                      continue
                  try:
                      argv = (proc / 'cmdline').read_bytes().split(b'\0')
                  except (FileNotFoundError, PermissionError):
                      continue
                  if ('--user-data-dir=' + str(profile)).encode() not in argv:
                      continue
                  if any(a.startswith(b'--type=') or a == b'--type' for a in argv):
                      continue
                  matches.append((proc, argv))
              check(len(matches) == 1)
              proc, argv = matches[0]
              def identity():
                  value = (proc / 'stat').read_text()
                  check(value.startswith(proc.name + ' ('))
                  fields = value.rsplit(')', 1)[1].split()
                  check(len(fields) >= 20 and fields[19].isdecimal())
                  return (proc.name, fields[19])
              before = identity()
              status = dict(line.split(':', 1) for line in (proc / 'status').read_text().splitlines())
              check(all(int(v) == os.getuid() for v in status['Uid'].split()))
              check(status['NoNewPrivs'].strip() == '1')
              env = (proc / 'environ').read_bytes().split(b'\0')
              homes = [e for e in env if e.startswith(b'HOME=') or e == b'HOME']
              check(homes == [('HOME=' + str(home)).encode()])
              check((proc / 'cgroup').read_text().splitlines() == ['0::/system.slice/' + unit])
              forbidden = {b'--no-sandbox', b'--disable-setuid-sandbox', b'--disable-namespace-sandbox', b'--disable-seccomp-filter-sandbox'}
              check(not any(a.split(b'=', 1)[0] in forbidden for a in argv))
              check(before == identity())
          
          try:
              check(os.getuid() != 0)
              check(pathlib.Path('/sys/fs/cgroup/cgroup.controllers').is_file())
              node = shutil.which('node')
              check(node and pathlib.Path(node).is_absolute())
              check(re.fullmatch(r'v24\.\d+\.\d+', run([node, '--version'])))
              check(int(run(['systemctl', '--version']).split()[1]) >= 250)
              run(['sudo', '-n', 'true'])
              child = root / 'child.mjs'
              child.write_text(r'''import assert from 'node:assert/strict';
          import { existsSync, readFileSync, writeFileSync, renameSync } from 'node:fs';
          import { join, basename } from 'node:path';
          import { createRequire } from 'node:module';
          import { pathToFileURL } from 'node:url';
          const root = process.env.TMPDIR;
          const home = join(root, 'browser-home');
          let stage = 'preflight', browser, context, closeAttempted = false, success = false;
          const deadline = setTimeout(() => process.exit(1), 43000);
          const report = (status) => {
            writeFileSync(join(root, 'pending-result'), JSON.stringify({stage, status}), {mode: 0o600});
            renameSync(join(root, 'pending-result'), join(root, 'result'));
          };
          try {
            assert.match(process.version, /^v24\./);
            assert.notEqual(process.getuid(), 0);
            assert.ok(!process.env.DEBUG && !process.env.PWDEBUG && !process.env.NODE_TLS_REJECT_UNAUTHORIZED);
            const require = createRequire(join(process.cwd(), 'package.json'));
            assert.equal(require('playwright-core/package.json').version, '1.64.0');
            const { chromium } = require('playwright-core');
            const { launchTlsBrowser, generatedBrowserFiles, checkGeneratedBrowserCleanup } = await import(pathToFileURL(join(process.cwd(), 'tests/evaluation/browser-tls-trust.mjs')));
            assert.equal(generatedBrowserFiles(root).length, 0);
            stage = 'launch';
            const launched = await launchTlsBrowser(chromium, home, '/usr/bin/google-chrome', true, root);
            browser = launched.browser;
            const files = generatedBrowserFiles(root);
            const profiles = files.filter(file => basename(file).startsWith('playwright_chromiumdev_profile-'));
            assert.equal(profiles.length, 1);
            writeFileSync(join(root, 'pending-ready'), JSON.stringify({profile: profiles[0], files}), {mode: 0o600});
            renameSync(join(root, 'pending-ready'), join(root, 'ready'));
            stage = 'root-wait';
            const waitUntil = Date.now() + 10000;
            while (!existsSync(join(root, 'release')) && Date.now() < waitUntil)
              await new Promise(resolve => setTimeout(resolve, 25));
            assert.ok(existsSync(join(root, 'release')));
            stage = 'context';
            context = await launched.createContext();
            stage = 'page';
            const page = await context.newPage();
            await page.goto('about:blank', {timeout: 3000});
            assert.equal(await page.evaluate(() => 1 + 1), 2);
            await page.close();
            await context.close();
            context = undefined;
            stage = 'close';
            closeAttempted = true;
            await browser.close();
            stage = 'files';
            checkGeneratedBrowserCleanup(root, files);
            stage = 'report';
            success = true;
          } catch {
            success = false;
          } finally {
            if (browser && !closeAttempted) {
              closeAttempted = true;
              try { await browser.close(); } catch {}
            }
            report(success ? 'pass' : 'failure');
            clearTimeout(deadline);
            process.exitCode = success ? 0 : 1;
          }
          ''')
              stage = 'unit-start'
              unit = 'nssscdl-chrome-' + uuid.uuid4().hex + '.service'
              unit_live = True
              unit_props = ['Type=exec', 'ExitType=cgroup', 'RemainAfterExit=yes', 'Restart=no',
                            'OOMPolicy=stop', 'Delegate=no', 'KillMode=control-group', 'CollectMode=inactive',
                            'RuntimeMaxSec=45s', 'TimeoutStartSec=5s', 'TimeoutStopSec=1s',
                            'StandardOutput=null', 'StandardError=null', 'NoNewPrivileges=yes',
                            'ProtectControlGroups=yes', 'RestrictSUIDSGID=yes',
                            'WorkingDirectory=' + str(pathlib.Path.cwd()),
                            'User=' + str(os.getuid()), 'Group=' + str(os.getgid())]
              env = ['PATH=' + os.environ['PATH'], 'HOME=' + str(root), 'TMPDIR=' + str(root),
                     'XDG_CONFIG_HOME=' + str(root), 'CI=true', 'WRANGLER_SEND_METRICS=false']
              run(['sudo', '-n', 'systemd-run', '--quiet', '--unit=' + unit] +
                  ['--property=' + p for p in unit_props] + ['/usr/bin/env', '-i'] + env + [node, str(child)])
              stage = 'unit-settings'
              s = show()
              settings(s)
              invocation = s.get('InvocationID', '')
              check(re.fullmatch('[0-9a-f]{32}', invocation))
              stage = 'launch'
              until(lambda: (root / 'ready').is_file(), 33)
              ready = json.loads((root / 'ready').read_text())
              check(set(ready) == {'profile', 'files'} and isinstance(ready['files'], list))
              files = [pathlib.Path(v) for v in ready['files']]
              profile = pathlib.Path(ready['profile'])
              for path in files:
                  check(path.parent == root and re.fullmatch(r'(playwright_chromiumdev_profile-|playwright-artifacts-).+', path.name))
                  mode = path.lstat()
                  check(stat.S_ISDIR(mode.st_mode) and mode.st_uid == os.getuid() and (mode.st_mode & 0o777) == 0o700)
              check(profile in files)
              stage = 'root-attestation'
              root_attestation(profile)
              print('CHROME_UNIT=root_home_profile_uid_cgroup_nnp_verified', flush=True)
              (root / 'release').touch()
              stage = 'page-close'
              until(lambda: read_report() is not None, 12)
              print('CHROME_UNIT=sandbox_enabled_launch_blank_page_close_reported', flush=True)
              stage = 'terminal-state'
              def terminal():
                  value = show()
                  settings(value)
                  check(value.get('InvocationID') == invocation)
                  if value.get('Result') != 'success':
                      raise ProbeFailure('terminal-state', 'failure')
                  return value if value.get('ActiveState') == 'active' and value.get('SubState') == 'exited' else None
              s = until(terminal, 5)
              check(s.get('ExecMainCode') == '1' and s.get('ExecMainStatus') == '0')
              s = terminal()
              check(s and s.get('ExecMainCode') == '1' and s.get('ExecMainStatus') == '0')
              print('CHROME_UNIT=same_invocation_active_exited_success', flush=True)
              stage = 'generated-files'
              check(all(not path.exists() for path in files))
              check(not any(re.fullmatch(r'(playwright_chromiumdev_profile-|playwright-artifacts-).+', p.name) for p in root.iterdir()))
              print('CHROME_UNIT=generated_profile_artifacts_absent', flush=True)
              stage = 'unit-dispose'
              stop()
              accepted = True
          except ProbeFailure as error:
              print('CHROME_UNIT=fail_' + error.phase + '_' + error.result, flush=True)
          except TimeoutError:
              print('CHROME_UNIT=fail_' + stage + '_timeout', flush=True)
          except ValueError:
              print('CHROME_UNIT=fail_' + stage + '_mismatch', flush=True)
          except Exception:
              print('CHROME_UNIT=fail_' + stage + '_unknown', flush=True)
          finally:
              if unit_live:
                  try:
                      stop()
                  except Exception:
                      accepted = False
                      print('CHROME_UNIT=unit_cleanup_unknown', flush=True)
              if accepted:
                  try:
                      st = root.lstat()
                      check(stat.S_ISDIR(st.st_mode) and st.st_uid == os.getuid() and (st.st_dev, st.st_ino) == root_identity)
                      shutil.rmtree(root)
                      print('CHROME_UNIT=owned_files_removed_after_terminal', flush=True)
                  except Exception:
                      accepted = False
                      print('CHROME_UNIT=owned_cleanup_unknown', flush=True)
              else:
                  print('CHROME_UNIT=owned_files_retained_no_retry', flush=True)
              print('CHROME_UNIT=pass' if accepted else 'CHROME_UNIT=fail', flush=True)
              sys.exit(0 if accepted else 1)
          PY
          result=$?
          if [ "$result" -ne 0 ]; then
            echo 'CHROME_UNIT=job_failed'
            exit 1
          fi
