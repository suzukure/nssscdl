name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準9コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: 全テスト
        if: steps.applicability.outputs.applicable == 'true'
        run: npm test

      # TEMPORARY #922: authorized normal-only systemd/Chrome/Worker/D1 proof; remove after outcome.
      - name: '#922 temporary read-only DOM normal Chrome Worker D1 proof'
        if: steps.applicability.outputs.applicable == 'true' && github.event.pull_request.number == 923 && github.run_attempt == 1
        timeout-minutes: 5
        shell: bash
        env:
          PROOF_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 240s node --input-type=module - <<'JS'
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          import { browserEvidence, browserProofCheckpoint } from './tests/evaluation/trusted-browser-reads.mjs';
          import { parseBrowserDiagnostic } from './tests/evaluation/browser-tls-trust.mjs';
          const exec = promisify(execFile);
          const cleanup = '#914: same invocation unit no-live verified before release / port closed / run-owned HOME,NSS,cert,key,persist,temporary removed; formal Actions / full TC / Gate A-D remain separate';
          let result;
          try {
            result = await exec(process.execPath, ['tests/evaluation/trusted-browser-smoke.mjs', '--run'],
              { timeout: 210000, maxBuffer: 65536, env: process.env });
          } catch (error) {
            const raw = typeof error.stdout === 'string' ? error.stdout : '';
            const candidates = raw.split(/\r?\n/).filter(line => line.startsWith('TRUSTED_BROWSER_STAGE='));
            const safe = candidates.length === 1 ? parseBrowserDiagnostic(candidates[0]) : undefined;
            console.log('INTEGRATED_NORMAL=fail');
            console.log(safe ?? 'TRUSTED_BROWSER_STAGE=unknown; CLEANUP=unknown');
            if (raw.split(/\r?\n/).includes('TRUSTED_BROWSER_UNIT_UNAVAILABLE')) console.log('TRUSTED_BROWSER_UNIT_UNAVAILABLE');
            console.log('INTEGRATED_NORMAL=owned_state_unverified_no_retry');
            process.exit(1);
          }
          try {
            if (result.stderr !== '') throw new Error();
            const lines = result.stdout.split('\n');
            if (!/^browser=Google Chrome \d+\.\d+\.\d+\.\d+; installed fixed binary; strict run-owned NSS trust; origin=https:\/\/127\.0\.0\.1:8788$/.test(lines[0])) throw new Error();
            if (!/^checkpoint: head=[a-f0-9]{40}; UTC=\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d\.\d{3}Z; Node=v24\.\d+\.\d+; Wrangler=4\.146\.0; config=tests\/evaluation\/wrangler\.jsonc; EVALUATION_READ_DB; local-only; migrations=0001\.\.0012$/.test(lines[1])) throw new Error();
            if (!lines[1].startsWith('checkpoint: head=' + process.env.PROOF_HEAD + ';')) throw new Error();
            const evidence = lines.slice(2).join('\n');
            if (!evidence.endsWith(cleanup + '\n')) throw new Error();
            const child = evidence.slice(0, -cleanup.length - 1);
            const certificate = browserEvidence(child, false);
            console.log(lines[0]); console.log(lines[1]); console.log(certificate);
            console.log(browserProofCheckpoint); console.log(cleanup);
            console.log('INTEGRATED_NORMAL=pass');
          } catch {
            console.log('INTEGRATED_NORMAL=invalid_or_conflicting_checkpoint_no_raw_output');
            process.exitCode = 1;
          }
          JS
