name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準9コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: 全テスト
        if: steps.applicability.outputs.applicable == 'true'
        run: npm test

  cgroup-probe-914:
    name: '#914 temporary cgroup capability probe'
    if: github.event.pull_request.number == 921 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Synthetic cgroup lifecycle only
        shell: bash
        run: |
          set +e
          timeout --kill-after=3s 55s python3 -B - 2>/dev/null <<'PY'
          import json, os, pathlib, subprocess, sys, tempfile, time, uuid
          
          stage = 'capability'
          units = []
          root = pathlib.Path(tempfile.mkdtemp(prefix='nssscdl-cgroup-probe-'))
          outside = None
          passed = False
          
          def run(args):
              return subprocess.check_output(args, stderr=subprocess.DEVNULL, timeout=4, env={'PATH': '/usr/bin:/bin'}).decode().strip()
          
          def check(value):
              if not value:
                  raise ValueError()
          
          def show(unit):
              raw = run(['sudo', '-n', 'systemctl', 'show', unit, '--property=ControlGroup,ActiveState,SubState,ExecMainCode,ExecMainStatus,Result'])
              return dict(line.split('=', 1) for line in raw.splitlines() if '=' in line)
          
          def until(fn, seconds=4):
              end = time.monotonic() + seconds
              while time.monotonic() < end:
                  value = fn()
                  if value:
                      return value
                  time.sleep(0.025)
              raise TimeoutError()
          
          def populated(group):
              values = dict(line.split() for line in (group / 'cgroup.events').read_text().splitlines())
              check(values.get('populated') in ('0', '1'))
              return values['populated'] == '1'
          
          def decision(group, marker, forced=False, seconds=0.2, reader=populated):
              try:
                  until(lambda: not reader(group), seconds)
              except TimeoutError:
                  return 'timeout'
              except Exception:
                  return 'unknown'
              if forced:
                  return 'forced'
              marker.unlink()
              return 'natural'
          
          def stop(unit):
              run(['sudo', '-n', 'systemctl', 'stop', unit])
              if unit in units:
                  units.remove(unit)
          
          try:
              check(os.getuid() != 0)
              check(pathlib.Path('/sys/fs/cgroup/cgroup.controllers').is_file())
              check(pathlib.Path('/run/systemd/system').is_dir())
              check(int(run(['systemctl', '--version']).split()[1]) >= 250)
              run(['sudo', '-n', 'true'])
              child = root / 'child.py'
              child.write_text('''import json, os, pathlib, sys, time
          d = pathlib.Path(sys.argv[1])
          original_sid = os.getsid(0)
          pid = os.fork()
          if pid:
              os._exit(0)
          os.setsid()
          data = {"pid": os.getpid(), "uid": os.getuid(), "sid_changed": os.getsid(0) != original_sid}
          (d / "pending").write_text(json.dumps(data))
          (d / "pending").rename(d / "ready")
          end = time.monotonic() + 10
          while time.monotonic() < end and not (d / "release").exists():
              time.sleep(0.02)
          (d / "natural").write_text("yes")
          ''')
              outside = subprocess.Popen(['/usr/bin/sleep', '45'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, env={'PATH': '/usr/bin:/bin'}, start_new_session=True)
          
              def start(label):
                  directory = root / label
                  directory.mkdir(mode=0o700)
                  marker = directory / 'owned'
                  marker.write_text('retain')
                  unit = 'nssscdl-probe-' + uuid.uuid4().hex + '.service'
                  units.append(unit)
                  props = ['Type=exec', 'ExitType=cgroup', 'RemainAfterExit=yes', 'Restart=no',
                           'KillMode=control-group', 'RuntimeMaxSec=20s', 'TimeoutStopSec=2s',
                           'StandardOutput=null', 'StandardError=null', 'NoNewPrivileges=yes',
                           'ProtectControlGroups=yes', 'RestrictSUIDSGID=yes',
                           'User=' + str(os.getuid()), 'Group=' + str(os.getgid())]
                  run(['sudo', '-n', 'systemd-run', '--quiet', '--unit=' + unit] +
                      ['--property=' + p for p in props] +
                      ['/usr/bin/env', '-i', 'PATH=/usr/bin:/bin', '/usr/bin/python3', '-B', str(child), str(directory)])
                  until(lambda: (directory / 'ready').is_file())
                  data = json.loads((directory / 'ready').read_text())
                  check(data['uid'] == os.getuid() and data['sid_changed'])
                  status = until(lambda: (s if (s := show(unit)).get('ExecMainCode') == '1' else None))
                  check(status['ExecMainStatus'] == '0' and status['ActiveState'] == 'active')
                  check(status['ControlGroup'] == '/system.slice/' + unit)
                  group = pathlib.Path('/sys/fs/cgroup') / status['ControlGroup'].lstrip('/')
                  check(populated(group))
                  check(str(data['pid']) in (group / 'cgroup.procs').read_text().split())
                  return unit, directory, group, marker
          
              stage = 'orphan_tracking'
              unit, directory, group, marker = start('normal')
              check(decision(group, marker) == 'timeout' and marker.exists())
              print('CGROUP_PROBE=nonroot_fork_setsid_parent_exit_tracked', flush=True)
          
              stage = 'unknown_preservation'
              def unreadable(_):
                  raise OSError()
              check(decision(group, marker, reader=unreadable) == 'unknown' and marker.exists())
              print('CGROUP_PROBE=injected_unknown_preserves_owned', flush=True)
          
              stage = 'natural_exit'
              (directory / 'release').touch()
              check(decision(group, marker, seconds=4) == 'natural')
              check((directory / 'natural').read_text() == 'yes' and not marker.exists())
              status = show(unit)
              check(status['Result'] == 'success' and status['ExecMainStatus'] == '0')
              check(outside.poll() is None)
              print('CGROUP_PROBE=natural_empty_observed_before_delete', flush=True)
              stop(unit)
          
              stage = 'timeout_preservation'
              unit, directory, group, marker = start('timeout')
              check(decision(group, marker) == 'timeout' and marker.exists())
              check(not (directory / 'natural').exists())
              stop(unit)
              # A removed cgroup is unknown; an observed empty one after stop is forced.
              check(decision(group, marker, forced=True) in ('unknown', 'forced') and marker.exists())
              check(not (directory / 'natural').exists() and outside.poll() is None)
              print('CGROUP_PROBE=timeout_forced_cleanup_not_success_owned_retained', flush=True)
              print('CGROUP_PROBE=unrelated_process_unaffected', flush=True)
              passed = True
          except Exception:
              print('CGROUP_PROBE=fail_' + stage, flush=True)
          finally:
              cleanup = True
              for unit in list(units):
                  try:
                      stop(unit)
                  except Exception:
                      cleanup = False
              if outside is not None:
                  outside.terminate()
                  try:
                      outside.wait(timeout=3)
                  except Exception:
                      outside.kill()
                      outside.wait(timeout=3)
                      cleanup = False
              # Preserve the synthetic owned sentinel, including the deliberate failure case.
              if cleanup:
                  print('CGROUP_PROBE=transient_units_stopped', flush=True)
              else:
                  print('CGROUP_PROBE=cleanup_unknown', flush=True)
              print('CGROUP_PROBE=pass' if passed and cleanup else 'CGROUP_PROBE=fail', flush=True)
              sys.exit(0 if passed and cleanup else 1)
          PY
          result=$?
          if [ "$result" -ne 0 ]; then
            echo 'CGROUP_PROBE=job_failed'
            exit 1
          fi
