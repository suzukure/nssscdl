name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'tsconfig.json'
      - 'wrangler.jsonc'
      - 'vitest.config.ts'
      - 'vitest.d1.config.ts'
      - 'eslint.config.mjs'
      - '.github/workflows/product-ci.yml'

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: 標準Nodeを準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        run: npm ci

      - name: Build（deployなし）
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Local D1 migrations
        run: npm run d1:local

      - name: Local D1 smoke
        run: npm run test:d1

      - name: 全テスト
        run: npm test
