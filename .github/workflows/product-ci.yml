name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準8コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: "#1055 CFT157 validated synthetic Chrome (approved one-shot)"
        if: ${{ github.event.action == 'opened' && github.run_attempt == 1 && github.event.pull_request.draft == true && github.head_ref == 'investigate/issue-1055-cft157-validated-oneshot' }}
        timeout-minutes: 7
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "cc082886519e9e2df9273f84a0b8295bb8d5a49e"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(uname -m)" = "x86_64"
          node --check tests/evaluation/issue-1055-cft157-chrome.mjs
          TEMP_CFT="$(mktemp -d "$RUNNER_TEMP/nssscdl-1055-cft157-XXXXXXXX")"
          trap 'rm -rf -- "$TEMP_CFT"' EXIT
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --location --fail --silent --show-error \
            --max-time 120 --max-filesize 300000000 \
            'https://storage.googleapis.com/chrome-for-testing-public/157.0.8092.0/linux64/chrome-linux64.zip' \
            -o "$TEMP_CFT/chrome.zip"
          timeout --signal=TERM --kill-after=5s 45s \
            python3 -B tests/evaluation/issue-1055-cft-archive-preflight.py --self-test
          timeout --signal=TERM --kill-after=5s 100s \
            python3 -B tests/evaluation/issue-1055-cft-archive-preflight.py \
            "$TEMP_CFT/chrome.zip" "$TEMP_CFT/owned-extract"
          BINARY="$TEMP_CFT/owned-extract/chrome-linux64/chrome"
          test -f "$BINARY" && test ! -L "$BINARY"
          chmod u+x "$BINARY"
          for exe in chrome_crashpad_handler chrome-sandbox; do
            path="$TEMP_CFT/owned-extract/chrome-linux64/$exe"
            if test -f "$path" && test ! -L "$path"; then chmod u+x "$path"; fi
          done
          export H9_CHROME_EXECUTABLE="$BINARY"
          "$H9_CHROME_EXECUTABLE" --version | grep -E '^(Google Chrome( for Testing)?|Chromium) 157\.0\.8092\.0$'
          timeout --signal=TERM --kill-after=5s 160s \
            node tests/evaluation/issue-1055-cft157-chrome.mjs
