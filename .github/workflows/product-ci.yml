name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準9コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: 全テスト
        if: steps.applicability.outputs.applicable == 'true'
        run: npm test

      # TEMPORARY #914 browser + Worker + isolated D1 formal proof. Remove before Ready / merge.
      - name: '#914 opt-in Chrome Worker/D1 normal and intentional failure proof'
        if: steps.applicability.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/bin/google-chrome
          test -x /usr/bin/certutil
          node --test tests/evaluation/browser-tls-trust.test.mjs tests/evaluation/trusted-browser-smoke.test.mjs
          normal_log="$(mktemp "$RUNNER_TEMP/issue-914-normal.XXXX")"
          failure_log="$(mktemp "$RUNNER_TEMP/issue-914-intentional.XXXX")"
          trap 'rm -f -- "$normal_log" "$failure_log"' EXIT
          set +e
          timeout --signal=TERM --kill-after=15s 240s node tests/evaluation/trusted-browser-smoke.mjs --run > "$normal_log" 2>&1
          normal_rc=$?
          set -e
          if [ "$normal_rc" -ne 0 ]; then
            printf '#914 normal diagnostic: exit=%s\n' "$normal_rc"
            for marker in \
              'browser=Google Chrome' \
              'checkpoint: head=' \
              'certificate: SHA256=' \
              '#914: NSS P,,' \
              'TRUSTED_BROWSER_PROOF_FAILED' \
              'TRUSTED_BROWSER_STAGE=' \
              'TRUSTED_EVALUATION_SEED_CLEANUP_FAILED'; do
              if grep -Fq "$marker" "$normal_log"; then
                printf '#914 diagnostic marker present: %s\n' "$marker"
              else
                printf '#914 diagnostic marker absent: %s\n' "$marker"
              fi
            done
            exit 1
          fi
          grep -Fq '#914: NSS P,, / strict browser TLS positive and two negative probes / same cert and fixed-port serial handoff passed' "$normal_log"
          grep -Fq 'TC-F-001/002/005/207 partial: real same-origin browser fetch' "$normal_log"
          grep -Fq 'TC-NF-914 partial: host-only Secure HttpOnly SameSite=Lax Path=/' "$normal_log"
          grep -Fq 'TC-F-207/211 partial: Worker stopped / port closed / self-only revocation' "$normal_log"
          grep -Fq '#914: browser processes absent before Worker stop / closed port' "$normal_log"
          grep -Fq '#914: owned process groups stopped / port closed / owned persist and temporary files removed' "$normal_log"
          ! grep -Eq 'TRUSTED_BROWSER_PROOF_FAILED|uncertain process|CLEANUP_FAILED' "$normal_log"
          test ! -e .wrangler/student-read-only-evaluation
          printf '#914 normal: real Chrome and isolated Worker/D1 evidence + cleanup checkpoint confirmed; sanitized output only\n'
          set +e
          timeout --signal=TERM --kill-after=15s 240s node tests/evaluation/trusted-browser-smoke.mjs --run --fail-after-positive > "$failure_log" 2>&1
          negative_rc=$?
          set -e
          test "$negative_rc" -eq 1
          grep -Fq '#914 intentional failure: positive browser GETs completed; browser/Worker/port/proxy shutdown and final inspect/secret scan confirmed' "$failure_log"
          grep -Fq '#914: owned process groups stopped / port closed / owned persist and temporary files removed' "$failure_log"
          ! grep -Eq 'TRUSTED_BROWSER_PROOF_FAILED|uncertain process|CLEANUP_FAILED' "$failure_log"
          test ! -e .wrangler/student-read-only-evaluation
          printf '#914 intentional failure: expected exit 1 + cleanup passed; no raw logs printed\n'
