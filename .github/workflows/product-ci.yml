name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準9コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: 全テスト
        if: steps.applicability.outputs.applicable == 'true'
        run: npm test

      - name: '#930 booking normal proof (temporary)'
        if: steps.applicability.outputs.applicable == 'true'
        timeout-minutes: 4
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const result = spawnSync(process.execPath, ['tests/evaluation/trusted-booking-outer.mjs', '--run'], {
            encoding: 'utf8', timeout: 190000, maxBuffer: 4096, stdio: ['ignore', 'pipe', 'pipe']
          });
          if (result.error || result.signal || result.status !== 0 || result.stderr !== '' ||
              result.stdout !== "#945 booking: isolated child prepared / same invocation no-live / both ports closed / owned persistence,TMP,HOME,NSS,cert,key,report,log removed; partial evidence only; formal proof / Gate A-D unverified\n") {
            let stage = 'unknown';
            if (!result.error && !result.signal && result.status === 1 && result.stdout === '') {
              for (const allowed of ['preflight', 'start', 'report', 'ownership', 'release', 'remove', 'listeners', 'operator']) {
                if (result.stderr === 'TRUSTED_BOOKING_OUTER_FAILED; stage=' + allowed + '; retain owned files; do not retry\n') stage = allowed;
              }
              for (const reason of ['timeout', 'manager', 'mismatch', 'cancel', 'unknown']) {
                for (const stop of ['confirmed', 'unknown']) {
                  const observations = stop === 'confirmed' ? ['accepted', 'unknown', 'manager-empty'] :
                    ['unknown', 'stop-budget', 'stop-unconfirmed', 'show-budget', 'show-unavailable', 'show-invalid', 'identity-mismatch', 'failed-state', 'state-unaccepted', 'ineligible'];
                  for (const observation of observations) {
                    const detail = '; unit_stop=' + stop + '; diagnostic=unknown; stop_observation=' + observation;
                    if (result.stderr === 'TRUSTED_BOOKING_OUTER_FAILED; stage=terminal; reason=' + reason + detail + '; retain owned files; do not retry\n') stage = 'terminal; reason=' + reason + detail;
                  }
                }
                for (const observation of ['accepted', 'unknown', 'manager-empty']) {
                  if (typeof result.stderr === 'string') {
                    const prefix = 'TRUSTED_BOOKING_OUTER_FAILED; stage=terminal; reason=' + reason + '; unit_stop=confirmed; diagnostic=observed; stop_observation=' + observation + '; ';
                    const suffix = '; retain owned files; do not retry\n';
                    if (result.stderr.startsWith(prefix) && result.stderr.endsWith(suffix)) {
                      const fields = result.stderr.slice(prefix.length, -suffix.length).split('; ');
                      const enums = [
                        ['entry', 'seed', 'home', 'tls', 'worker', 'dom', 'stop', 'readback', 'scan', 'complete', 'unknown'],
                        ['entered', 'completed', 'unknown'],
                        ['none', 'entry', 'seed', 'home', 'tls', 'worker', 'dom', 'stop', 'readback', 'scan', 'unknown'],
                        ['not-attempted', 'attempted', 'confirmed', 'unknown'],
                        ['none', 'preflight', 'spawn', 'group', 'booking-listener', 'listener-unattributed', 'owned-listener', 'deadline', 'unknown'],
                        ['not-attempted', 'ownership', 'ownership-failed', 'signal', 'signal-failed', 'signal-sent', 'wait', 'wait-failed', 'port', 'port-failed', 'confirmed', 'unknown']
                      ];
                      const keys = ['phase', 'boundary', 'primary', 'worker_stop', 'worker_failure', 'worker_stop_detail'];
                      const values = keys.map((key, i) => enums[i].find(value => fields[i] === key + '=' + value));
                      if (fields.length === 6 && values.every(value => value !== undefined)) {
                        const detail = '; unit_stop=confirmed; diagnostic=observed; stop_observation=' + observation + '; ' + keys.map((key, i) => key + '=' + values[i]).join('; ');
                        if (result.stderr === 'TRUSTED_BOOKING_OUTER_FAILED; stage=terminal; reason=' + reason + detail + suffix) stage = 'terminal; reason=' + reason + detail;
                      }
                    }
                  }
                }
              }
            }
            console.error('BOOKING_PROOF_FAILED; stage=' + stage);
            process.exitCode = 1;
          } else {
            console.log("#945 booking: isolated child prepared / same invocation no-live / both ports closed / owned persistence,TMP,HOME,NSS,cert,key,report,log removed; partial evidence only; formal proof / Gate A-D unverified");
          }
          NODE
