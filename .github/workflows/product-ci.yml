name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準9コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: 全テスト
        if: steps.applicability.outputs.applicable == 'true'
        run: npm test
      # TEMPORARY #914: one-shot normal runtime diagnostic; remove before final HEAD.
      - name: '#914 temporary normal Chrome Worker/D1 diagnosis'
        if: steps.applicability.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/evaluation/browser-tls-trust.test.mjs tests/evaluation/trusted-browser-smoke.test.mjs
          normal_log="$(mktemp "$RUNNER_TEMP/issue-914-normal.XXXX")"
          trap 'rm -f -- "$normal_log"' EXIT
          set +e
          timeout --signal=TERM --kill-after=15s 240s node tests/evaluation/trusted-browser-smoke.mjs --run > "$normal_log" 2>&1
          normal_rc=$?
          set -e
          printf '#914 normal diagnostic: exit=%s\n' "$normal_rc"
          pattern='^TRUSTED_BROWSER_STAGE=(none|unknown|entry|seed|seed-inspect|tls-setup|tls-preflight|tls-cert|tls-listener|tls-browser-launch|tls-browser-ownership|tls-browser-context|tls-browser-nss|tls-positive|tls-san|tls-untrusted|tls-consumer|worker-start|browser-read);[[:space:]]CLEANUP=(none|unknown|browser-close|browser-ownership|browser-process|proof-listener|worker-stop|port-close|generated-files|owned-inspect|owned-remove)(;[[:space:]]OWNERSHIP=(none|unknown|proc-list|proc-read|proc-environ|tracked-owner|home-mismatch|profile-argv|profile-location|main-count|profile-set|profile-missing|profile-count|directory-read|directory-type|directory-owner|directory-mode|directory-path|generated-changed|related-process-remains);[[:space:]]CLEANUP_OWNERSHIP=(none|unknown|proc-list|proc-read|proc-environ|tracked-owner|home-mismatch|profile-argv|profile-location|main-count|profile-set|profile-missing|profile-count|directory-read|directory-type|directory-owner|directory-mode|directory-path|generated-changed|related-process-remains))?$'
          matched=0
          while IFS= read -r line || [[ -n "$line" ]]; do
            if [[ "$line" =~ $pattern ]]; then
              matched=$((matched + 1))
              printf '#914 safe failure: primary=%s cleanup=%s ownership=%s cleanup-ownership=%s\n' \
                "${BASH_REMATCH[1]}" "${BASH_REMATCH[2]}" "${BASH_REMATCH[4]:-none}" "${BASH_REMATCH[5]:-none}"
            fi
          done < "$normal_log"
          if [[ "$normal_rc" -ne 0 ]]; then
            [[ "$matched" -eq 1 ]] || printf '#914 fixed diagnosis missing or nonunique; inspect offline only\n'
            exit 1
          fi
          [[ "$matched" -eq 0 ]]
          grep -Fq '#914: NSS P,, / strict browser TLS positive and two negative probes / same cert and fixed-port serial handoff passed' "$normal_log"
          grep -Fq 'TC-NF-914 partial: host-only Secure HttpOnly SameSite=Lax Path=/' "$normal_log"
          grep -Fq '#914: browser processes absent before Worker stop / closed port' "$normal_log"
          grep -Fq '#914: owned process groups stopped / port closed / owned persist and temporary files removed' "$normal_log"
          ! grep -Eq 'TRUSTED_BROWSER_PROOF_FAILED|CLEANUP_FAILED|uncertain process' "$normal_log"
          printf '#914 normal: real Chrome Worker/D1 and owned cleanup checkpoints confirmed (sanitized)\n'
