name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準8コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

  issue-1066-ubuntu22-sandbox-preflight:
    name: "#1066 Ubuntu22 nonprivileged userns finite probe (NO Chrome)"
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    permissions: {}
    if: ${{ github.event.action == 'opened' && github.run_attempt == 1 && github.event.pull_request.draft == true && github.head_ref == 'investigate/issue-1066-ubuntu22-userns-once' && github.event.pull_request.base.sha == '25fecbf1059844a462a0d2ba22b147453f7b33a4' }}
    steps:
      - name: Sandbox userns capability (read-only; no Chrome/session)
        shell: bash
        run: |
          set -euo pipefail
          echo "H9_SANDBOX stage=scope; result=preflight-only; chrome_started=no; host_mutated=no"
          if [[ "$(lsb_release -rs 2>/dev/null || true)" == "22.04" ]] && [[ "$(uname -m)" == "x86_64" ]]; then
            echo "H9_SANDBOX stage=image; result=ubuntu22-x64"
          else
            echo "H9_SANDBOX stage=image; result=unexpected"
            exit 1
          fi
          if [[ "$(id -u)" == "0" ]]; then
            echo "H9_SANDBOX stage=identity; result=root-rejected"
            exit 1
          fi
          echo "H9_SANDBOX stage=identity; result=unprivileged"
          if [[ -r /proc/sys/user/max_user_namespaces ]]; then
            read -r maxns < /proc/sys/user/max_user_namespaces
            if [[ "$maxns" =~ ^[0-9]+$ ]] && (( maxns > 0 )); then maxstate=positive; else maxstate=zero-or-unknown; fi
          else maxstate=unknown; fi
          echo "H9_SANDBOX stage=userns-max; result=$maxstate"
          if [[ -r /proc/sys/kernel/unprivileged_userns_clone ]]; then
            read -r userns < /proc/sys/kernel/unprivileged_userns_clone
            if [[ "$userns" == "1" ]]; then clonestate=allowed; elif [[ "$userns" == "0" ]]; then clonestate=disabled; else clonestate=unknown; fi
          else clonestate=unknown; fi
          echo "H9_SANDBOX stage=userns-sysctl; result=$clonestate"
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            read -r ap < /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            if [[ "$ap" == "1" ]]; then apstate=restriction-on; elif [[ "$ap" == "0" ]]; then apstate=restriction-off; else apstate=unknown; fi
          else apstate=not-exposed; fi
          echo "H9_SANDBOX stage=apparmor; result=$apstate"
          if timeout --signal=TERM --kill-after=2s 8s /usr/bin/unshare -Ur /usr/bin/true >/dev/null 2>&1; then
            result=allowed
          else
            result=blocked-or-unknown
          fi
          echo "H9_SANDBOX stage=userns-actual; result=$result"
          if [[ "$maxstate" == "positive" && "$clonestate" != "disabled" && "$result" == "allowed" ]]; then
            echo "H9_SANDBOX stage=summary; result=namespace-candidate; chrome_sandbox=unproved; formal_proof=unproved"
          else
            echo "H9_SANDBOX stage=summary; result=needs-method-review; chrome_sandbox=unproved; formal_proof=unproved"
          fi
