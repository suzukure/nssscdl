name: Product CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  product-ci:
    name: Product CI
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: PR current headをcheckout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Product差分の適用判定
        id: applicability
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          import re
          import subprocess
          import sys

          def git(*args):
              return subprocess.check_output(['git', *args], stderr=subprocess.DEVNULL)

          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-f]{40}', sha) for sha in (base, head)):
                  raise ValueError('sha_invalid')
              if git('rev-parse', 'HEAD').strip() != head.encode():
                  raise ValueError('head_mismatch')
              if git('rev-parse', '--verify', base + '^{commit}').strip() != base.encode():
                  raise ValueError('base_unavailable')
              merge = git('merge-base', base, head).strip()
              if not re.fullmatch(rb'[0-9a-f]{40}', merge):
                  raise ValueError('merge_base_invalid')
              changed = git('diff', '--no-renames', '--name-only', '-z', merge.decode(), head)
              if changed and not changed.endswith(b'\0'):
                  raise ValueError('diff_framing_invalid')
              paths = changed.split(b'\0')[:-1] if changed else []
              if not all(paths):
                  raise ValueError('path_invalid')
              exact = {b'package.json', b'package-lock.json', b'.node-version',
                       b'tsconfig.json', b'wrangler.jsonc', b'vitest.config.ts',
                       b'vitest.d1.config.ts', b'eslint.config.mjs',
                       b'.github/workflows/product-ci.yml'}
              applicable = any(path in exact or path.startswith((b'src/', b'tests/', b'migrations/'))
                               for path in paths)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii') as output:
                  output.write('applicable=' + ('true' if applicable else 'false') + '\n')
          except Exception:
              print('Product差分を判定できないため、fail-closedで停止します。', file=sys.stderr)
              sys.exit(1)
          print('Product差分あり: 標準9コマンドを実行します。' if applicable else
                'Product差分なし: not applicable（Node/npmコマンドは実行しません）。')
          PY

      - name: 標準Nodeを準備
        if: steps.applicability.outputs.applicable == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Clean install
        if: steps.applicability.outputs.applicable == 'true'
        run: npm ci

      - name: Build（deployなし）
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run lint

      - name: Unit tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:unit

      - name: Integration tests
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:integration

      - name: Local D1 migrations
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run d1:local

      - name: Local D1 smoke
        if: steps.applicability.outputs.applicable == 'true'
        run: npm run test:d1

      - name: 全テスト
        if: steps.applicability.outputs.applicable == 'true'
        run: npm test
      # TEMPORARY #914: authorized once-only normal Chrome/Worker/D1 proof; remove immediately after outcome.
      - name: '#914 temporary normal Chrome Worker/D1 diagnosis'
        if: steps.applicability.outputs.applicable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/evaluation/browser-tls-trust.test.mjs tests/evaluation/trusted-browser-smoke.test.mjs
          normal_log="$(mktemp "$RUNNER_TEMP/issue-914-normal.XXXX")"
          trap 'rm -f -- "$normal_log"' EXIT
          set +e
          timeout --signal=TERM --kill-after=15s 240s node tests/evaluation/trusted-browser-smoke.mjs --run > "$normal_log" 2>&1
          normal_rc=$?
          set -e
          printf '#914 normal diagnostic: exit=%s\n' "$normal_rc"
          if [[ "$normal_rc" -ne 0 ]]; then
            node --input-type=module - "$normal_log" <<'JS'
          import { readFileSync } from 'node:fs';
          import { parseBrowserDiagnostic } from './tests/evaluation/browser-tls-trust.mjs';
          const raw = readFileSync(process.argv[2], 'utf8');
          const candidates = raw.split(/\r?\n/).filter((line) => line.startsWith('TRUSTED_BROWSER_STAGE='));
          const safe = candidates.length === 1 ? parseBrowserDiagnostic(candidates[0]) : undefined;
          if (safe) console.log('#914 fixed safe diagnostic: ' + safe);
          else console.log('#914 fixed diagnosis missing, nonunique or invalid; no raw log output');
          JS
            exit 1
          fi
          if grep -Fq 'TRUSTED_BROWSER_STAGE=' "$normal_log"; then
            printf '#914 success contradicted by failure diagnosis; no raw log output\n'
            exit 1
          fi
          for marker in \
            '#914: NSS P,, / strict browser TLS positive and two negative probes / same cert and fixed-port serial handoff passed' \
            'TC-NF-914 partial: host-only Secure HttpOnly SameSite=Lax Path=/' \
            '#914: browser processes absent before Worker stop / closed port' \
            '#914: owned process groups stopped / port closed / owned persist and temporary files removed'; do
            if ! grep -Fq -- "$marker" "$normal_log"; then
              printf '#914 normal expected checkpoint absent; no raw log output\n'
              exit 1
            fi
          done
          if grep -Eq 'TRUSTED_BROWSER_PROOF_FAILED|CLEANUP_FAILED|uncertain process' "$normal_log"; then
            printf '#914 normal conflicting failure checkpoint; no raw log output\n'
            exit 1
          fi
          printf '#914 normal: real Chrome Worker/D1 and owned cleanup checkpoints confirmed (sanitized)\n'
