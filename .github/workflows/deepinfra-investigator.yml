name: DeepInfra Investigator

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    name: Gate investigator entry
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      (
        github.event.comment.body == '/deepseek analyze' ||
        github.event.comment.body == '/deepseek analyze v4.1'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      model: ${{ steps.select.outputs.model }}
    steps:
      # The script ALLOWED_MODELS set is the execution-time canonical allowlist.
      # These workflow cases intentionally duplicate it as an entry-boundary defense;
      # test-deepinfra-investigator.sh verifies the two layers stay aligned.
      - name: Select allowlisted model
        id: select
        env:
          COMMAND: ${{ github.event.comment.body }}
        shell: bash
        run: |
          set -euo pipefail
          case "$COMMAND" in
            '/deepseek analyze')
              model='deepseek-ai/DeepSeek-V4-Flash-0731'
              ;;
            '/deepseek analyze v4.1')
              model='deepseek-ai/DeepSeek-V4.1-Flash'
              ;;
            *)
              echo 'Unexpected investigator command.' >&2
              exit 1
              ;;
          esac
          printf 'model=%s\n' "$model" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze Issue read-only
    needs: gate
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deepinfra-investigator-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Check out trusted default-branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate investigator model
        env:
          MODEL: ${{ needs.gate.outputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          case "$MODEL" in
            'deepseek-ai/DeepSeek-V4-Flash-0731'|'deepseek-ai/DeepSeek-V4.1-Flash') ;;
            *)
              echo 'Model is outside the investigator allowlist.' >&2
              exit 1
              ;;
          esac

      - name: Run DeepInfra investigator
        id: investigate
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ needs.gate.outputs.model }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_SHA: ${{ github.sha }}
          RESULT_JSON: ${{ runner.temp }}/deepinfra-investigation.json
          RESULT_MD: ${{ runner.temp }}/deepinfra-investigation.md
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPINFRA_API_KEY"
          python3 .github/scripts/deepinfra-investigator.py \
            --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE_NUMBER" \
            --model "$MODEL" \
            --base-sha "$BASE_SHA" \
            --output-json "$RESULT_JSON" \
            --output-md "$RESULT_MD"
          test -s "$RESULT_JSON"
          test -s "$RESULT_MD"
          cat "$RESULT_MD" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload investigation result
        if: steps.investigate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepinfra-investigation-${{ github.event.issue.number }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/deepinfra-investigation.json
            ${{ runner.temp }}/deepinfra-investigation.md
          if-no-files-found: error
          retention-days: 7
