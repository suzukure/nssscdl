name: AI Developer

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  repository_dispatch:
    types: [ai-resume-develop]

permissions:
  contents: read

jobs:
  prepare-resume-command:
    if: >-
      github.event_name == 'issue_comment' &&
      (github.event.comment.body == '/ai resume develop' ||
       github.event.comment.body == '/ai resume review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: dev-token
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
      - name: Prepare and dispatch trusted resume command
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          APP_SLUG: ${{ steps.dev-token.outputs.app-slug }}
          AI_RESUME_MAX_HISTORY_PAGES: '10'
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          TARGET_NUMBER: ${{ github.event.issue.number }}
          TARGET_KIND: ${{ github.event.issue.pull_request && 'pr' || 'issue' }}
        shell: bash
        run: |
          set -euo pipefail
          command="$(jq -cn --arg body "$COMMENT_BODY" --arg actor "$COMMENT_ACTOR" \
            --arg author_association "$COMMENT_ASSOCIATION" '{body:$body,actor:$actor,author_association:$author_association}' |
            bash .github/scripts/parse-ai-resume-command.sh)"
          if ! jq -e '.result == "accepted" and (.action == "develop" or .action == "review")' <<< "$command" >/dev/null; then
            echo 'resumeコマンドを拒否または無視しました。' >&2
            exit 1
          fi
          action="$(jq -r .action <<< "$command")"
          app_id="$(gh api "/apps/$APP_SLUG" --jq '.id')"
          [[ "$app_id" =~ ^[1-9][0-9]*$ ]]
          context="$(bash .github/scripts/build-ai-resume-prepare-context.sh \
            "$GITHUB_REPOSITORY" "$TARGET_KIND" "$TARGET_NUMBER" "$app_id" <<< "$command")"
          result="$(bash .github/scripts/prepare-ai-resume.sh <<< "$context")"
          if ! jq -e --arg action "$action" '
            .result == "prepared" and (.dispatch | type == "object") and
            .dispatch.action == $action and .dispatch.version == 1 and
            (.dispatch | keys == ["action","actor","closing_issue_number","follow_up_issue",
                                 "pause_issue_body_fingerprint","paused_head","pr_number",
                                 "prepared_head","prepared_issue_body_fingerprint","reason",
                                 "source_pause_id","target","version"]) and
            (if $action == "review" then
              (.dispatch.reason | IN("claude_execution_failed","review_disagreement_decision",
                                     "resume_transition_failed")) and
              (.dispatch.target | type == "string" and test("^pr:[1-9][0-9]*$")) and
              (.dispatch.pr_number | type == "number" and . >= 1 and floor == .) and
              (.dispatch.paused_head | type == "string" and test("^[0-9a-f]{40}$")) and
              .dispatch.prepared_head == .dispatch.paused_head
            else true end)
          ' <<< "$result" >/dev/null; then
            echo 'resumeのPREPAREを拒否しました。現在の停止状態を維持します。' >&2
            exit 1
          fi
          reason="$(jq -r .dispatch.reason <<< "$result")"
          target="$(jq -r .dispatch.target <<< "$result")"
          echo "resume dispatch実行 run=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT} target=${target} action=${action} reason=${reason}"
          jq -cn --argjson payload "$(jq -c .dispatch <<< "$result")" \
            --arg event_type "ai-resume-$action" \
            '{event_type:$event_type,client_payload:{version:1,dispatch:$payload}}' > "$RUNNER_TEMP/resume-dispatch.json"
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/resume-dispatch.json" >/dev/null 2>&1; then
            echo 'resume dispatch APIが失敗したか応答を受け取れませんでした。結果は不明です。producerから再試行しません。' >&2
            exit 1
          fi
          echo 'resume dispatch APIが要求を受け付けました。受理判定はconsumerが行います。'

  gate-issue-entry:
    name: Gate Issue entry
    # The event snapshot rejects unrelated commands and untrusted actors early.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'human-review-required') &&
      (
        github.event.comment.body == '/codex develop' ||
        github.event.comment.body == '/codex develop extended'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      continue: ${{ steps.pause-gate.outputs.continue }}
    steps:
      - name: Check out trusted entry gate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check current Issue and related PR before concurrency
        id: pause-gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(bash .github/scripts/evaluate-issue-entry-gate.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER")"
          echo "continue=$(jq -r .continue <<< "$result")" >> "$GITHUB_OUTPUT"
          jq -r .reason <<< "$result"

  develop-from-issue:
    name: Develop from Issue
    needs: gate-issue-entry
    if: >-
      always() &&
      ((github.event_name == 'issue_comment' && needs.gate-issue-entry.outputs.continue == 'true') ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'ai-resume-develop')
      )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event.comment.body == '/codex develop extended' && 35 || 15 }}
    concurrency:
      group: codex-writer-ai/issue-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.dispatch.closing_issue_number || github.event.issue.number }}
      cancel-in-progress: false
    outputs:
      pre_write_remote_head: ${{ steps.remote-head.outputs.head }}
      resume_accepted: ${{ steps.resume-gate.outputs.accepted }}
      issue_number: ${{ github.event_name == 'repository_dispatch' && steps.resume-gate.outputs.issue_number || github.event.issue.number }}
    steps:
      - name: Create developer App token
        id: dev-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.dev-token.outputs.token }}
          fetch-depth: 0

      - name: Revalidate and consume resume inside Issue concurrency
        if: github.event_name == 'repository_dispatch'
        id: resume-gate
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          APP_SLUG: ${{ steps.dev-token.outputs.app-slug }}
          AI_RESUME_MAX_HISTORY_PAGES: '10'
          RESUME_DISPATCH: ${{ toJSON(github.event.client_payload.dispatch) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$RESUME_DISPATCH" |
            bash .github/scripts/consume-ai-resume-develop.sh "$GITHUB_REPOSITORY" "$APP_SLUG" \
              "$GITHUB_OUTPUT"

      # The event snapshot is not evidence of Issue state after the writer wait.
      - name: Recheck current Issue inside Issue concurrency
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'repository_dispatch' && steps.resume-gate.outputs.issue_number || github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(bash .github/scripts/evaluate-issue-entry-gate.sh "$GITHUB_REPOSITORY" "$ISSUE_NUMBER")"
          jq -e '.continue == true' <<< "$result" >/dev/null

      - name: Capture pre-write remote branch HEAD
        id: remote-head
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'repository_dispatch' && steps.resume-gate.outputs.issue_number || github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          branch="ai/issue-${ISSUE_NUMBER}"
          head="$(python3 - "$GITHUB_REPOSITORY" "$branch" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repo, branch = sys.argv[1:]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}

          def get(path):
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          repository = get("/repos/" + repo)
          if repository.get("full_name") != repo:
              raise ValueError("repository identity mismatch")
          try:
              result = get("/repos/" + repo + "/git/ref/heads/" + branch)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print("absent")
              sys.exit(0)
          head = result.get("object", {}).get("sha")
          if (result.get("ref") != "refs/heads/" + branch
                  or result.get("object", {}).get("type") != "commit"
                  or not isinstance(head, str)
                  or not re.fullmatch(r"[0-9a-f]{40}", head)):
              raise ValueError("malformed remote branch response")
          print(head)
          PY
          )"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"

      - name: Prepare branch and Issue context
        id: issue_context
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'repository_dispatch' && steps.resume-gate.outputs.issue_number || github.event.issue.number }}
          PRE_WRITE_REMOTE_HEAD: ${{ steps.remote-head.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main
          base_sha="$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')"
          notify_human_blob="$(git rev-parse "${base_sha}:.github/scripts/notify-human.sh")"
          apply_human_pause_blob="$(git rev-parse "${base_sha}:.github/scripts/apply-human-pause.sh")"
          requirements_marker_blob="$(git rev-parse "${base_sha}:.github/scripts/has-requirements-change-marker.sh")"
          decision_classifier_blob="$(git rev-parse "${base_sha}:.github/scripts/classify-ai-developer-decision-marker.sh")"
          [[ "$decision_classifier_blob" =~ ^[0-9a-f]{40}$ ]]
          scope_marker_blob="$(git rev-parse "${base_sha}:.github/scripts/has-scope-decision-marker.sh")"
          [[ "$scope_marker_blob" =~ ^[0-9a-f]{40}$ ]]
          diff_guard_blob="$(git rev-parse "${base_sha}:.github/scripts/evaluate-codex-diff-gate.sh")"
          development_context_blob="$(git rev-parse "${base_sha}:.github/scripts/build-development-context.py")"
          usage_helpers=(collect-codex-usage-evidence.py select-codex-usage-journal.py
            build-codex-usage-evidence.py validate-codex-usage-identity.py
            validate-codex-usage-stream.py extract-codex-exec-usage.py)
          usage_helper_blobs=()
          for filename in "${usage_helpers[@]}"; do
            blob="$(git rev-parse "${base_sha}:.github/scripts/$filename")"
            [[ "$blob" =~ ^[0-9a-f]{40}$ ]]
            usage_helper_blobs+=("$blob")
          done
          pause_helpers=(create-human-pause human-pause-record list-human-pause-records
            validate-human-pause-record-graph decompose-human-pause-record-graph
            derive-human-pause-pre-resume-state reconcile-human-pause-resume-acceptance
            reconcile-human-pause-active-pause apply-human-pause
            format-human-pause-notification notify-human)
          pause_helper_blobs=()
          for helper in "${pause_helpers[@]}"; do
            pause_helper_blobs+=("$(git rev-parse "${base_sha}:.github/scripts/${helper}.sh")")
          done
          {
            printf 'base_sha=%s\n' "$base_sha"
            printf 'notify_human_blob=%s\n' "$notify_human_blob"
            printf 'apply_human_pause_blob=%s\n' "$apply_human_pause_blob"
            printf 'requirements_marker_blob=%s\n' "$requirements_marker_blob"
            printf 'decision_classifier_blob=%s\n' "$decision_classifier_blob"
            printf 'scope_marker_blob=%s\n' "$scope_marker_blob"
            printf 'diff_guard_blob=%s\n' "$diff_guard_blob"
            printf 'pause_helper_blobs=%s\n' "${pause_helper_blobs[*]}"
            printf 'usage_helper_blobs=%s\n' "${usage_helper_blobs[*]}"
          } >> "$GITHUB_OUTPUT"
          branch="ai/issue-${ISSUE_NUMBER}"
          if [[ "$PRE_WRITE_REMOTE_HEAD" == absent ]]; then
            git checkout -b "$branch" "$base_sha"
          elif [[ "$PRE_WRITE_REMOTE_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            test "$(git rev-parse --verify "refs/remotes/origin/${branch}^{commit}")" = "$PRE_WRITE_REMOTE_HEAD"
            git checkout -B "$branch" "origin/$branch"
            if ! git merge-base --is-ancestor "$base_sha" HEAD; then
              echo "AI branch $branch に現在のmain $base_sha が含まれていないため、Codex実行前に停止します。" >&2
              exit 1
            fi
          else
            echo '書き込み前のremote branch HEADが存在しないか不正です。' >&2
            exit 1
          fi
          echo "AI_BRANCH=$branch" >> "$GITHUB_ENV"
          git show "${base_sha}:.github/scripts/notify-human.sh" > "$RUNNER_TEMP/notify-human.sh"
          git show "${base_sha}:.github/scripts/apply-human-pause.sh" > "$RUNNER_TEMP/apply-human-pause.sh"
          git show "${base_sha}:.github/scripts/has-requirements-change-marker.sh" > "$RUNNER_TEMP/has-requirements-change-marker.sh"
          git show "${base_sha}:.github/scripts/classify-ai-developer-decision-marker.sh" > "$RUNNER_TEMP/classify-ai-developer-decision-marker.sh"
          git show "${base_sha}:.github/scripts/has-scope-decision-marker.sh" > "$RUNNER_TEMP/has-scope-decision-marker.sh"
          git show "${base_sha}:.github/scripts/evaluate-codex-diff-gate.sh" > "$RUNNER_TEMP/evaluate-codex-diff-gate.sh"
          git show "${base_sha}:.github/scripts/build-development-context.py" > "$RUNNER_TEMP/build-development-context.py"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/notify-human.sh")" = "$notify_human_blob"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/apply-human-pause.sh")" = "$apply_human_pause_blob"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/has-requirements-change-marker.sh")" = "$requirements_marker_blob"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/classify-ai-developer-decision-marker.sh")" = "$decision_classifier_blob"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/has-scope-decision-marker.sh")" = "$scope_marker_blob"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/evaluate-codex-diff-gate.sh")" = "$diff_guard_blob"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/build-development-context.py")" = "$development_context_blob"
          bash "$RUNNER_TEMP/evaluate-codex-diff-gate.sh" --contract > "$RUNNER_TEMP/codex-diff-guard-contract.json"
          jq -e '
            type == "object" and
            (keys | sort == ["max_changed_files", "max_changed_lines", "max_new_files"]) and
            (.max_changed_files | type == "number" and . > 0 and floor == .) and
            (.max_changed_lines | type == "number" and . > 0 and floor == .) and
            (.max_new_files | type == "number" and . > 0 and floor == .)
          ' "$RUNNER_TEMP/codex-diff-guard-contract.json" > /dev/null

          mkdir -p .ai-context
          git show "${base_sha}:AGENTS.md" > .ai-context/AGENTS.base.md
          cp "$RUNNER_TEMP/codex-diff-guard-contract.json" .ai-context/diff-guard-contract.json
          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url,labels,comments \
            > "$RUNNER_TEMP/development-issue.json"
          python3 "$RUNNER_TEMP/build-development-context.py" \
            "$RUNNER_TEMP/development-issue.json" .ai-context/request.md "$GITHUB_STEP_SUMMARY"

          # These pre-Codex copies are disposable bootstrap inputs. The Codex
          # workload receives RUNNER_TEMP, so no helper retained there across
          # model execution is trusted for a post-Codex decision.
          rm -f -- \
            "$RUNNER_TEMP/notify-human.sh" \
            "$RUNNER_TEMP/apply-human-pause.sh" \
            "$RUNNER_TEMP/has-requirements-change-marker.sh" \
            "$RUNNER_TEMP/classify-ai-developer-decision-marker.sh" \
            "$RUNNER_TEMP/has-scope-decision-marker.sh" \
            "$RUNNER_TEMP/evaluate-codex-diff-gate.sh" \
            "$RUNNER_TEMP/build-development-context.py" \
            "$RUNNER_TEMP/development-issue.json" \
            "$RUNNER_TEMP/codex-diff-guard-contract.json"

      - name: Select trusted Codex Issue model
        id: codex_model
        env:
          NORMAL_MODEL: ${{ vars.CODEX_MODEL }}
          BASE_SHA: ${{ steps.issue_context.outputs.base_sha }}
          ISSUE_NUMBER: ${{ github.event_name == 'repository_dispatch' && steps.resume-gate.outputs.issue_number || github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]{0,15}$ ]]
          selection_dir="$(mktemp -d "$RUNNER_TEMP/codex-model-selection.XXXXXX")"
          export SELECTION_DIR="$selection_dir"
          trap 'rm -rf -- "$selection_dir"' EXIT
          for filename in select-codex-issue-model.py codex-issue-model-policy.json; do
            source_path=".github/scripts/$filename"
            expected_blob="$(git rev-parse "${BASE_SHA}:${source_path}")"
            [[ "$expected_blob" =~ ^[0-9a-f]{40}$ ]]
            git show "${BASE_SHA}:${source_path}" > "$selection_dir/$filename"
            test "$(git hash-object --no-filters "$selection_dir/$filename")" = "$expected_blob"
          done
          python3 -I -B - <<'PY_MODEL'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          try:
              directory = Path(os.environ["SELECTION_DIR"])
              source = directory / "select-codex-issue-model.py"
              policy = directory / "codex-issue-model-policy.json"
              spec = importlib.util.spec_from_file_location("trusted_model_selector", source)
              selector = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(selector)
              request = json.dumps(dict(repository=os.environ["GITHUB_REPOSITORY"],
                  issue=int(os.environ["ISSUE_NUMBER"]), normal_model=os.environ["NORMAL_MODEL"]),
                  ensure_ascii=True, separators=(",", ":")).encode()
              with policy.open("rb") as stream:
                  policy_bytes = stream.read(selector.MAX_POLICY_BYTES + 1)
              # Reuse the pure Contract; do not copy schema/allowlist/model rules.
              expected = selector.select(policy_bytes, request)
              canonical = (json.dumps(expected, sort_keys=True, ensure_ascii=True,
                  separators=(",", ":")) + "\n").encode()
              with (directory / "result.json").open("wb") as output:
                  result = subprocess.run([sys.executable, "-I", "-B", str(source), "--policy", str(policy)],
                      input=request, stdout=output, stderr=subprocess.DEVNULL)
              with (directory / "result.json").open("rb") as stream:
                  actual = stream.read(4097)
              # Exact canonical bytes prove closed schema, types, identity and selection.
              if result.returncode != 0 or not 0 < len(actual) <= 4096 or actual != canonical:
                  raise ValueError
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("model=" + expected["model"] + "\n")
              print("モデル選択: " + expected["selection"])
          except Exception:
              print("モデル選択を拒否しました: trusted_selection_failed", file=sys.stderr)
              sys.exit(1)
          PY_MODEL

      - name: Prepare Codex developer runtime
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_FINAL: ${{ runner.temp }}/codex-final.md
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          rm -f "$CODEX_HOME/config.toml"
          rm -f "$CODEX_FINAL"

      - name: Setup Codex developer runtime
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.159.3
          codex-home: ${{ runner.temp }}/codex-home
          safety-strategy: unsafe
          allow-bot-users: ${{ steps.dev-token.outputs.app-slug }}

      - name: Resolve trusted Codex developer runtime
        id: codex_runtime
        timeout-minutes: 3
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        shell: bash
        run: |
          set -euo pipefail

          launcher="$(command -v codex)"
          test -n "$launcher"
          entry="$(realpath "$launcher")"
          test "$(basename "$entry")" = codex.js
          package_root="$(realpath "$(dirname "$(dirname "$entry")")")"
          test -s "$package_root/package.json"
          test "$(realpath "$package_root/bin/codex.js")" = "$entry"

          export CODEX_ENTRY="$entry"
          export CODEX_PACKAGE_ROOT="$package_root"
          resolver_output="$(
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";

          const entry = process.env.CODEX_ENTRY;
          const packageRoot = process.env.CODEX_PACKAGE_ROOT;
          const mainPackage = JSON.parse(
            fs.readFileSync(path.join(packageRoot, "package.json"), "utf8"),
          );
          if (mainPackage.name !== "@openai/codex") {
            throw new Error(`予期しないCodexパッケージ名: ${mainPackage.name}`);
          }
          if (mainPackage.version !== "0.159.3") {
            throw new Error(`予期しないCodexパッケージのバージョン: ${mainPackage.version}`);
          }

          let platformPackage;
          let targetTriple;
          if (process.platform === "linux" && process.arch === "x64") {
            platformPackage = "@openai/codex-linux-x64";
            targetTriple = "x86_64-unknown-linux-musl";
          } else if (process.platform === "linux" && process.arch === "arm64") {
            platformPackage = "@openai/codex-linux-arm64";
            targetTriple = "aarch64-unknown-linux-musl";
          } else {
            throw new Error(
              `未対応のCodex実行環境: ${process.platform}/${process.arch}`,
            );
          }

          const require = createRequire(entry);
          const platformPackageJson = require.resolve(
            `${platformPackage}/package.json`,
          );
          const nativePath = path.join(
            path.dirname(platformPackageJson),
            "vendor",
            targetTriple,
            "bin",
            "codex",
          );
          const nativeStat = fs.statSync(nativePath);
          if (!nativeStat.isFile()) {
            throw new Error("Codexのネイティブ実行ファイルは通常ファイルではありません。");
          }
          fs.accessSync(nativePath, fs.constants.X_OK);

          process.stdout.write(
            JSON.stringify({
              nativePath: fs.realpathSync(nativePath),
              packageRoot,
              targetTriple,
            }),
          );
          NODE
          )"

          native_path="$(jq -r '.nativePath' <<<"$resolver_output")"
          resolved_root="$(jq -r '.packageRoot' <<<"$resolver_output")"
          target_triple="$(jq -r '.targetTriple' <<<"$resolver_output")"
          test "$resolved_root" = "$package_root"
          test -x "$native_path"

          launcher_version="$(codex --version)"
          native_version="$(
            env \
              -u CODEX_MANAGED_BY_BUN \
              -u CODEX_MANAGED_BY_PNPM \
              -u CODEX_MANAGED_BY_VITE_PLUS \
              CODEX_MANAGED_PACKAGE_ROOT="$package_root" \
              CODEX_MANAGED_BY_NPM=1 \
              "$native_path" --version
          )"
          test "$launcher_version" = "$native_version"
          test "$native_version" = 'codex-cli 0.159.3'

          action_root="$(dirname "$RUNNER_WORKSPACE")/_actions/openai/codex-action/86365089eb2b84e0a8fb0717b304f8bdcb13b20e"
          action_main="$action_root/dist/main.js"
          test -f "$action_main"
          actual_blob="$(git hash-object "$action_main")"
          test "$actual_blob" = ce4e94e119abb91b980d23bfb4210688241f3a0a

          uid="$(id -u)"
          gid="$(id -g)"
          groups_json="$(id -G | tr ' ' '\n' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
          credentials="$(jq -cn \
            --argjson uid "$uid" \
            --argjson gid "$gid" \
            --argjson groups "$groups_json" \
            '{userId:$uid,primaryGroupId:$gid,supplementaryGroupIds:$groups}')"

          printf 'native_path=%s\n' "$native_path" >> "$GITHUB_OUTPUT"
          printf 'package_root=%s\n' "$package_root" >> "$GITHUB_OUTPUT"
          printf 'action_main=%s\n' "$action_main" >> "$GITHUB_OUTPUT"
          printf 'runner_credentials=%s\n' "$credentials" >> "$GITHUB_OUTPUT"
          printf '信頼済みCodex 0.159.3ランタイムを%s向けに確認しました（Action blob %s）。\n' \
            "$target_triple" "$actual_blob"

      - name: Prepare fixed Codex developer prompt
        timeout-minutes: 3
        env:
          CODEX_PROMPT_FILE: ${{ runner.temp }}/codex-developer-prompt.md
        shell: bash
        run: |
          set -euo pipefail
          cat > "$CODEX_PROMPT_FILE" <<'CODEX_PROMPT'
          Read .ai-context/AGENTS.base.md, .ai-context/request.md, and .ai-context/diff-guard-contract.json completely. The base-commit AGENTS copy is the governing instruction file.
          Implement the Issue in this working tree.
          Apply Work Admission Control in docs/30_operations/ai-development-workflow.md to findings discovered during Issue-origin development. Static pre-admission uses R/C/P/B; dynamically stop when a prerequisite cross-boundary Contract decision outside the current Issue authority is needed.
          Emit the scope decision marker when any of these requires a new human scope/Contract decision:
          - The current implementation contract itself must change.
          - A new prerequisite cross-boundary Contract absent from the current Issue/main is needed.
          - A synthetic/dormant/narrower Contract must be promoted to the target mode.
          - A new proof infrastructure Contract is a prerequisite.
          - Fresh R/C/P/B evaluation transitions to Red / split-first.
          - Progress requires defining a new cross-boundary Contract and its downstream consumer in the same Issue.
          - A new trust / ownership / failure semantics boundary decision exceeds Issue authority.
          Do not emit the scope marker merely for existing C0 Contract reuse, Contract definition/proof explicitly scoped by the current Issue, a local bug fix, an existing fail-closed condition fixture, docs synchronization, a P1 fixture/assertion, or a safe Follow-up / Idea that permits consistent completion of the current Issue. These exceptions do not bypass a newly discovered prerequisite decision outside Issue authority.
          When a scope decision is required, do not infer or finalize the new Contract, do not continue downstream integration, and do not leave speculative partial changes depending on the unresolved Contract in the working tree. Stop dependent work and retain only the minimum observations needed for human judgment in the final report.
          Output this exact marker on its own unindented plain-text line in the final response:
          [SCOPE_DECISION_REQUIRED]
          Do not wrap that line in backticks or a Markdown fenced code block, or add leading/trailing whitespace. CRLF is allowed.
          Report observed fact, missing/new Contract category, why Done is impossible under the current contract, R/C/P/B changes, proposed split/prerequisite, Product impact, and unverified matters. Free text is for humans; only the exact marker controls the workflow.
          Only when emitting the scope decision marker, include each exact label below once, at the start of a separate single plain-text line, followed by ": " and a nonempty Japanese explanation. No bullets, Markdown formatting, or multiline values in these seven lines:
          Observed fact
          Missing/new Contract category
          Why Done is impossible under the current contract
          R/C/P/B change
          Proposed split/prerequisite
          Product impact
          Unverified matters
          Keep the entire final report within 16 KiB UTF-8, each field within 1 KiB UTF-8, and the rendered human report within 8 KiB. Retain only minimum observations; omit raw tool output, JSONL, token/secret/credential values, environment dumps, absolute runner/toolcache paths, and numeric UID/GID or other runner internals. Use repository-relative paths and abstract non-secret descriptions. These labels validate human evidence only; they do not classify the decision or authorize resume.
          Preserve the Product requirement change / unresolved upstream decision escalation in AGENTS.base.md. If that escalation applies, output only [REQUIREMENTS_CHANGE_REQUIRED] as the decision marker; otherwise use the scope marker for the scope/Contract decision above. Never output both decision markers in one final response.
          Reusing an existing current Issue/main Contract unchanged through an existing Port/interface, test-only fake/fixture adapter, isolated fixture, or existing error contract is not by itself a Product requirement change.
          If a Product requirement/specification or unresolved upstream phase decision itself needs change or clarification, use the requirements marker. If no Product requirement change is needed but a new cross-boundary Contract / trust / ownership / failure semantics decision exceeds Issue authority, use the existing scope marker. If neither is needed, continue normal implementation.
          Only when emitting the requirements marker, include each exact label below once, at the start of a separate single plain-text line, followed by ": " and a nonempty Japanese explanation. No bullets, Markdown formatting, or multiline values in these four lines; separate them from other report text with blank lines:
          Requirement/upstream decision
          Why current Issue cannot complete
          Affected identifiers
          Blocked downstream work
          The same 16 KiB final / 1 KiB per field / 8 KiB rendered report UTF-8 limits and omission of raw output, credentials, environment dumps, absolute runner/toolcache paths and UID/GID apply. The marker alone controls machine classification; these four fields are human evidence only.
          Human scope decisions must be recorded in the Issue body before the existing /ai resume develop path can resume. Do not automatically split Issues, convert them to parents, or retry.
          Write the final report for humans on GitHub in Japanese. Preserve exact machine markers, identifiers, commands, paths, and external error text where required.
          The trusted contract sets maximum changed files, total changed lines (additions + deletions), and new files; keep every metric at or below its maximum.
          Keep the proposed repository change within the trusted diff guard contract. Avoid broad formatting changes and large generated additions. If the Issue cannot fit within those bounds, keep the change small and explain the required split in the final response.
          Do not commit, push, open a pull request, merge, or contact external services; the workflow handles GitHub writes after you finish.
          CODEX_PROMPT

      - name: Capture AI Developer host integrity baseline
        id: host_integrity_before
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail

          notify_before="$(stat -Lc '%d %i %u %g %a' /run/systemd/notify)"
          dbus_before="$(stat -Lc '%d %i %u %g %a' /run/dbus/system_bus_socket)"
          resolved_before="$(
            systemctl show systemd-resolved.service --no-pager \
              --property=ActiveState --property=SubState --property=MainPID --property=NRestarts |
              LC_ALL=C sort |
              tr '\n' ';'
          )"
          printf '%s\n' "$resolved_before" | tr ';' '\n' | grep -Fxq 'ActiveState=active'
          printf '%s\n' "$resolved_before" | tr ';' '\n' | grep -Fxq 'SubState=running'
          getent ahosts github.com >/dev/null
          getent ahosts api.github.com >/dev/null

          printf 'notify=%s\n' "$notify_before" >> "$GITHUB_OUTPUT"
          printf 'dbus=%s\n' "$dbus_before" >> "$GITHUB_OUTPUT"
          printf 'resolved=%s\n' "$resolved_before" >> "$GITHUB_OUTPUT"
          printf 'captured=true\n' >> "$GITHUB_OUTPUT"
          printf 'HOST_INTEGRITY before sockets=captured resolved=active/running dns=ok\n'
          echo 'ホストの保護対象socket、名前解決サービス、DNSの事前確認が完了しました。'

      - name: Run Codex developer
        id: codex
        timeout-minutes: ${{ github.event.comment.body == '/codex develop extended' && 30 || 12 }}
        env:
          BASE_SHA: ${{ steps.issue_context.outputs.base_sha }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_FINAL: ${{ runner.temp }}/codex-final.md
          CODEX_PROMPT_FILE: ${{ runner.temp }}/codex-developer-prompt.md
          CODEX_MODEL: ${{ steps.codex_model.outputs.model }}
          CODEX_INTERNAL_ORIGINATOR_OVERRIDE: codex_github_action
          CODEX_NATIVE: ${{ steps.codex_runtime.outputs.native_path }}
          CODEX_PACKAGE_ROOT: ${{ steps.codex_runtime.outputs.package_root }}
          ACTION_MAIN: ${{ steps.codex_runtime.outputs.action_main }}
          RUNNER_CREDENTIALS: ${{ steps.codex_runtime.outputs.runner_credentials }}
          CODEX_RUNTIME_MAX_SEC: ${{ github.event.comment.body == '/codex develop extended' && 1780 || 700 }}
        shell: bash
        run: |
          set -euo pipefail

          stream_source_failure() {
            echo '信頼済みCodex stream sourceを確認できませんでした。' >&2
            exit 1
          }
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || stream_source_failure
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || stream_source_failure
          stream_dir="$(mktemp -d "$RUNNER_TEMP/codex-stream.XXXXXX" 2>/dev/null)" || stream_source_failure
          for filename in supervise-codex-exec-stream.py extract-codex-exec-usage.py; do
            source_path=".github/scripts/$filename"
            expected_blob="$(git rev-parse "${BASE_SHA}:${source_path}" 2>/dev/null)" || stream_source_failure
            [[ "$expected_blob" =~ ^[0-9a-f]{40}$ ]] || stream_source_failure
            source_entry="$(git ls-tree "$BASE_SHA" -- "$source_path" 2>/dev/null)" || stream_source_failure
            case "$source_entry" in
              "$(printf '100644 blob %s\t%s' "$expected_blob" "$source_path")"|"$(printf '100755 blob %s\t%s' "$expected_blob" "$source_path")") ;;
              *) stream_source_failure ;;
            esac
            git show "${BASE_SHA}:${source_path}" > "$stream_dir/$filename" 2>/dev/null || stream_source_failure
            [ -f "$stream_dir/$filename" ] && [ ! -L "$stream_dir/$filename" ] || stream_source_failure
            actual_blob="$(git hash-object --no-filters "$stream_dir/$filename" 2>/dev/null)" || stream_source_failure
            [ "$actual_blob" = "$expected_blob" ] || stream_source_failure
          done

          test -x "$CODEX_NATIVE"
          test -f "$ACTION_MAIN"
          test "$(git hash-object "$ACTION_MAIN")" = ce4e94e119abb91b980d23bfb4210688241f3a0a
          test -s "$CODEX_HOME/config.toml"
          test -s "$CODEX_PROMPT_FILE"

          python3 - "$CODEX_HOME/config.toml" <<'PY'
          import pathlib
          import sys
          import tomllib
          import urllib.parse

          config_path = pathlib.Path(sys.argv[1])
          with config_path.open("rb") as fh:
              config = tomllib.load(fh)

          allowed_top_level = {"model_provider", "model_providers"}
          unexpected = sorted(set(config) - allowed_top_level)
          if unexpected:
              raise SystemExit(
                  f"setup専用ランタイムのCodex設定に予期しないキーがあります: {unexpected}"
              )

          provider_name = config.get("model_provider")
          if provider_name != "codex-action-responses-proxy":
              raise SystemExit("Codexのmodel_providerが想定外です")

          providers = config.get("model_providers")
          if not isinstance(providers, dict) or set(providers) != {provider_name}:
              raise SystemExit("Codexのmodel_providers形式が想定外です")
          provider = providers[provider_name]
          if not isinstance(provider, dict):
              raise SystemExit("Codexのprovider設定が想定外です")
          if provider.get("wire_api") != "responses":
              raise SystemExit("Codex proxy providerのwire_apiはresponsesである必要があります")

          parsed = urllib.parse.urlparse(str(provider.get("base_url", "")))
          if (
              parsed.scheme != "http"
              or parsed.hostname != "127.0.0.1"
              or parsed.port is None
              or not (1 <= parsed.port <= 65535)
              or parsed.path != "/v1"
              or parsed.params
              or parsed.query
              or parsed.fragment
              or parsed.username is not None
              or parsed.password is not None
          ):
              raise SystemExit("Codex proxy providerはloopbackのhttp /v1を使用する必要があります")
          PY

          case "$CODEX_RUNTIME_MAX_SEC" in
            700|1780) ;;
            *)
              echo 'Codex RuntimeMaxSecが想定外です。' >&2
              exit 1
              ;;
          esac

          uid="$(id -u)"
          gid="$(id -g)"
          groups_json="$(id -G | tr ' ' '\n' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
          current_credentials="$(jq -cn \
            --argjson uid "$uid" \
            --argjson gid "$gid" \
            --argjson groups "$groups_json" \
            '{userId:$uid,primaryGroupId:$gid,supplementaryGroupIds:$groups}')"
          test "$current_credentials" = "$RUNNER_CREDENTIALS"
          test "$uid" -ne 0

          nobody_gid="$(id -g nobody)"
          case "$nobody_gid" in
            ''|*[!0-9]*|0)
              echo '安全なnobody gidを取得できませんでした。' >&2
              exit 1
              ;;
          esac

          runner_user="$(id -un)"
          runner_home="$HOME"
          runner_path="$PATH"
          unit="codex-developer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cat > "$RUNNER_TEMP/run-native-codex.sh" <<'CODEX_RUN'
          #!/bin/sh
          set -eu

          expected_uid="${1:?期待するuidが必要です}"
          expected_gid="${2:?期待するgidが必要です}"

          actual_uid="$(/usr/bin/id -u)"
          if [ "$actual_uid" != "$expected_uid" ]; then
            echo "サービス内の保護設定の事前確認でUIDが不一致です: 期待値 $expected_uid、実際値 $actual_uid。" >&2
            exit 41
          fi

          actual_gid="$(/usr/bin/id -g)"
          if [ "$actual_gid" != "$expected_gid" ]; then
            echo "サービス内の保護設定の事前確認でGIDが不一致です: 期待値 $expected_gid、実際値 $actual_gid。" >&2
            exit 42
          fi

          groups_status="$(/usr/bin/awk '/^Groups:/ { $1=""; sub(/^[[:space:]]+/, ""); print }' /proc/self/status)"
          if [ -n "$groups_status" ]; then
            echo "サービス内の保護設定の事前確認で補助グループが残っています: $groups_status。" >&2
            exit 43
          fi

          no_new_privs="$(/usr/bin/awk '/^NoNewPrivs:/ { print $2 }' /proc/self/status)"
          if [ "$no_new_privs" != 1 ]; then
            echo "サービス内の保護設定の事前確認でNoNewPrivsが不一致です: 実際値 ${no_new_privs:-未取得}。" >&2
            exit 44
          fi

          for field in CapInh CapPrm CapEff CapBnd CapAmb; do
            value="$(/usr/bin/awk -v field="$field" '$1 == field ":" { print $2 }' /proc/self/status)"
            if [ "$value" != 0000000000000000 ]; then
              echo "サービス内の保護設定の事前確認でcapabilityがゼロではありません: $field=${value:-未取得}。" >&2
              exit 45
            fi
          done

          if [ ! -x /usr/bin/sudo ]; then
            echo 'サービス内の保護設定の事前確認でsudoの拒否を検証できません: /usr/bin/sudoを使用できません。' >&2
            exit 39
          fi
          if /usr/bin/sudo -n true >/dev/null 2>&1; then
            echo 'サービス内の保護設定の事前確認でsudo権限が残っています。' >&2
            exit 40
          fi

          /usr/bin/python3 - <<'PY'
          import errno
          import os
          import socket
          import stat
          import sys

          protected_paths = os.environ.get("PROTECTED_UNIX_SOCKET_PATHS", "").split()
          if (
              len(protected_paths) != 13
              or len(set(protected_paths)) != 13
              or any(not path.startswith("/run/") for path in protected_paths)
          ):
              print(
                  "サービス内の保護設定の事前確認で保護対象socketの許可リストが不正です。",
                  file=sys.stderr,
              )
              raise SystemExit(48)

          try:
              sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          except OSError as exc:
              print(
                  f"サービス内の保護設定の事前確認でCodex sandboxに必要なAF_UNIXが遮断されています: {exc}",
                  file=sys.stderr,
              )
              raise SystemExit(46)
          else:
              sock.close()

          try:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          except OSError as exc:
              print(
                  f"サービス内の保護設定の事前確認でAF_INETが遮断されています: {exc}",
                  file=sys.stderr,
              )
              raise SystemExit(47)
          else:
              sock.close()

          host_ids = {}
          raw_host_ids = os.environ.get("PROTECTED_UNIX_SOCKET_HOST_IDS", "")
          if raw_host_ids:
              try:
                  for item in raw_host_ids.split(";"):
                      path, devino = item.split("=", 1)
                      dev, ino = (int(part) for part in devino.split(":", 1))
                      if path in host_ids:
                          raise ValueError("duplicate protected socket host id")
                      host_ids[path] = (dev, ino)
              except (TypeError, ValueError):
                  print(
                      "サービス内の保護設定の事前確認で保護対象socketのホスト基準値が不正です。",
                      file=sys.stderr,
                  )
                  raise SystemExit(48)
          if any(path not in protected_paths for path in host_ids):
              print(
                  "サービス内の保護設定の事前確認で保護対象socketのホスト基準値に想定外のパスがあります。",
                  file=sys.stderr,
              )
              raise SystemExit(48)

          for path in protected_paths:
              try:
                  st = os.stat(path)
              except FileNotFoundError:
                  continue
              except OSError as exc:
                  print(
                      f"サービス内の保護設定の事前確認で保護対象socket {path}を調査できません: {exc}",
                      file=sys.stderr,
                  )
                  raise SystemExit(48)

              if path not in host_ids:
                  print(
                      f"サービス内の保護設定の事前確認でホスト基準値取得後に保護対象socketが出現しました: {path}。",
                      file=sys.stderr,
                  )
                  raise SystemExit(48)

              if (
                  not stat.S_ISSOCK(st.st_mode)
                  or stat.S_IMODE(st.st_mode) != 0
                  or os.access(path, os.R_OK)
                  or os.access(path, os.W_OK)
                  or os.access(path, os.X_OK)
                  or (st.st_dev, st.st_ino) == host_ids[path]
              ):
                  print(
                      f"サービス内の保護設定の事前確認で保護対象socketの遮断が効いていません: {path}。",
                      file=sys.stderr,
                  )
                  raise SystemExit(48)

          def handle_walk_error(exc):
              if exc.errno in (errno.EACCES, errno.EPERM, errno.ENOENT):
                  return
              raise exc

          residual = []
          try:
              for root, _dirs, files in os.walk(
                  "/run",
                  topdown=True,
                  onerror=handle_walk_error,
                  followlinks=False,
              ):
                  for name in files:
                      path = os.path.join(root, name)
                      try:
                          st = os.stat(path, follow_symlinks=False)
                      except (FileNotFoundError, PermissionError):
                          continue
                      if (
                          stat.S_ISSOCK(st.st_mode)
                          and st.st_uid == 0
                          and os.access(path, os.W_OK)
                      ):
                          residual.append(path)
          except OSError as exc:
              print(
                  f"サービス内の保護設定の事前確認で/runの走査に失敗しました: {exc}",
                  file=sys.stderr,
              )
              raise SystemExit(49)

          if residual:
              rendered = ", ".join(sorted(set(residual))[:20])
              print(
                  "サービス内の保護設定の事前確認で書き込み可能なroot所有のUNIX socketが見つかりました: "
                  + rendered,
                  file=sys.stderr,
              )
              raise SystemExit(49)

          # Linux native x64/arm64 syscall numbers; invalid arguments must
          # still hit the filter, rather than kernel EINVAL/EBADF validation.
          import ctypes
          import platform
          import subprocess

          if platform.machine() not in ("x86_64", "aarch64"):
              raise SystemExit("io_uring検査の未対応architectureです。")
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          for name, number in (("io_uring_setup", 425), ("io_uring_enter", 426),
                               ("io_uring_register", 427)):
              ctypes.set_errno(0)
              result = libc.syscall(ctypes.c_long(number), ctypes.c_long(-1),
                                    ctypes.c_void_p(), ctypes.c_long(0),
                                    ctypes.c_long(0), ctypes.c_void_p(), ctypes.c_long(0))
              error = ctypes.get_errno()
              print(f"IO_URING_DENY {name} result={result} errno={error}", flush=True)
              if result != -1 or error != errno.EPERM:
                  raise SystemExit("io_uring syscallのEPERM拒否が不成立です。")

          for command in (("node", "--version"), ("npm", "--version")):
              try:
                  completed = subprocess.run(command, capture_output=True, text=True,
                                             timeout=20, cwd="/", env=os.environ.copy())
              except (OSError, subprocess.TimeoutExpired):
                  raise SystemExit("Node/npmのversion commandを実行できません。")
              print(f"NODE_TOOLING {command[0]} rc={completed.returncode} "
                    f"version={completed.stdout.strip()}", flush=True)
              if completed.returncode != 0:
                  raise SystemExit("Node/npmのversion commandが失敗しました。")

          print(
              "Service-local hardening preflight verified AF_UNIX/AF_INET and protected UNIX socket boundary."
          )
          PY

          exec env \
            -u PROTECTED_UNIX_SOCKET_PATHS \
            -u PROTECTED_UNIX_SOCKET_HOST_IDS \
            -u CODEX_MANAGED_BY_BUN \
            -u CODEX_MANAGED_BY_PNPM \
            -u CODEX_MANAGED_BY_VITE_PLUS \
            CODEX_MANAGED_PACKAGE_ROOT="$CODEX_PACKAGE_ROOT" \
            CODEX_MANAGED_BY_NPM=1 \
            CODEX_HOME="$CODEX_HOME" \
            CODEX_INTERNAL_ORIGINATOR_OVERRIDE="$CODEX_INTERNAL_ORIGINATOR_OVERRIDE" \
            /usr/bin/python3 -I -B "$3" --extractor "$4" -- \
              "$CODEX_NATIVE" exec --json \
              --skip-git-repo-check \
              --cd "$GITHUB_WORKSPACE" \
              --output-last-message "$CODEX_FINAL" \
              --model "$CODEX_MODEL" \
              --config 'model_reasoning_effort="medium"' \
              --config 'default_permissions=":workspace"' \
              < "$CODEX_PROMPT_FILE"
          CODEX_RUN
          chmod 700 "$RUNNER_TEMP/run-native-codex.sh"

          exec sudo -n -- \
            env -u ENV -u BASH_ENV -u SHELLOPTS \
            /bin/sh -c '
              set -eu
              runner_user="$1"
              uid="$2"
              nobody_gid="$3"
              runner_home="$4"
              runner_path="$5"
              runner_temp="$6"
              runtime_max_sec="$7"
              unit="$8"
              launcher="$9"
              code_workspace="${10}"
              codex_home="${11}"
              codex_final="${12}"
              codex_prompt_file="${13}"
              codex_model="${14}"
              codex_native="${15}"
              codex_package_root="${16}"
              originator="${17}"
              stream_supervisor="${18}"
              stream_extractor="${19}"
              protected_unix_socket_paths="/run/dbus/system_bus_socket /run/dhcpcd/eth0-4.unpriv.sock /run/docker.sock /run/snapd-snap.socket /run/snapd.socket /run/systemd/io.systemd.ManagedOOM /run/systemd/journal/dev-log /run/systemd/journal/socket /run/systemd/journal/stdout /run/systemd/journal/syslog /run/systemd/notify /run/systemd/userdb/io.systemd.DynamicUser /run/uuidd/request"
              inaccessible_paths=""
              protected_unix_socket_host_ids=""
              for path in $protected_unix_socket_paths; do
                inaccessible_paths="${inaccessible_paths:+$inaccessible_paths }-$path"
                if [ -e "$path" ]; then
                  if [ ! -S "$path" ]; then
                    echo "root側の保護設定の事前確認で保護対象UNIX socketの基準値取得に失敗しました: $pathはsocketではありません。" >&2
                    exit 50
                  fi
                  if ! host_owner="$(/usr/bin/stat -Lc "%u" "$path")"; then
                    echo "root側の保護設定の事前確認で保護対象UNIX socketの基準値取得に失敗しました: $pathの所有者を確認できません。" >&2
                    exit 50
                  fi
                  if ! host_devino="$(/usr/bin/stat -Lc "%d:%i" "$path")"; then
                    echo "root側の保護設定の事前確認で保護対象UNIX socketの基準値取得に失敗しました: $pathのdev:inodeを確認できません。" >&2
                    exit 50
                  fi
                  if [ "$host_owner" != 0 ]; then
                    echo "root側の保護設定の事前確認で保護対象UNIX socketの基準値取得に失敗しました: $pathの所有者=$host_owner。" >&2
                    exit 50
                  fi
                  protected_unix_socket_host_ids="${protected_unix_socket_host_ids}${protected_unix_socket_host_ids:+;}${path}=${host_devino}"
                fi
              done

              set +e
              /usr/bin/systemd-run \
                --quiet \
                --wait \
                --collect \
                --unit="$unit" \
                --property=Type=exec \
                --property="RuntimeMaxSec=${runtime_max_sec}s" \
                --property=TimeoutStopSec=5s \
                --property=KillMode=control-group \
                --property=SendSIGKILL=yes \
                --property=NoNewPrivileges=yes \
                --property="InaccessiblePaths=$inaccessible_paths" \
                --property=SystemCallArchitectures=native \
                --property="SystemCallFilter=~io_uring_setup:EPERM io_uring_enter:EPERM io_uring_register:EPERM" \
                /usr/bin/setpriv \
                  --reuid="$uid" \
                  --regid="$nobody_gid" \
                  --clear-groups \
                  --no-new-privs \
                  --bounding-set=-all \
                  --inh-caps=-all \
                  --ambient-caps=-all \
                  -- /usr/bin/env -i \
                  "HOME=$runner_home" \
                  "USER=$runner_user" \
                  "LOGNAME=$runner_user" \
                  "PATH=$runner_path" \
                  "RUNNER_TEMP=$runner_temp" \
                  "GITHUB_WORKSPACE=$code_workspace" \
                  "CODEX_HOME=$codex_home" \
                  "CODEX_FINAL=$codex_final" \
                  "CODEX_PROMPT_FILE=$codex_prompt_file" \
                  "CODEX_MODEL=$codex_model" \
                  "CODEX_NATIVE=$codex_native" \
                  "CODEX_PACKAGE_ROOT=$codex_package_root" \
                  "CODEX_INTERNAL_ORIGINATOR_OVERRIDE=$originator" \
                  "PROTECTED_UNIX_SOCKET_PATHS=$protected_unix_socket_paths" \
                  "PROTECTED_UNIX_SOCKET_HOST_IDS=$protected_unix_socket_host_ids" \
                  /bin/sh "$launcher" "$uid" "$nobody_gid" "$stream_supervisor" "$stream_extractor"
              rc=$?
              set -e

              /usr/bin/journalctl \
                --unit="$unit" \
                --no-pager \
                --output=cat \
                --lines=200 || true

              if [ "$rc" -eq 0 ]; then
                expected_preflight_marker="Service-local hardening preflight verified AF_UNIX/AF_INET and protected UNIX socket boundary."
                set +e
                preflight_journal="$(
                  /usr/bin/journalctl \
                    --unit="$unit" \
                    --no-pager \
                    --output=cat \
                    --quiet
                )"
                journal_rc=$?
                set -e
                if [ "$journal_rc" -ne 0 ] || ! printf "%s\n" "$preflight_journal" | grep -Fxq "$expected_preflight_marker"; then
                  echo "サービス内の保護設定の事前確認の成功markerをunit journalから取得できませんでした。" >&2
                  exit 51
                fi
                printf "%s\n" "$expected_preflight_marker"
                echo "サービス内のAF_UNIX/AF_INETと保護対象UNIX socketの境界を確認しました。"
              fi
              exit "$rc"
            ' codex-developer \
            "$runner_user" \
            "$uid" \
            "$nobody_gid" \
            "$runner_home" \
            "$runner_path" \
            "$RUNNER_TEMP" \
            "$CODEX_RUNTIME_MAX_SEC" \
            "$unit" \
            "$RUNNER_TEMP/run-native-codex.sh" \
            "$GITHUB_WORKSPACE" \
            "$CODEX_HOME" \
            "$CODEX_FINAL" \
            "$CODEX_PROMPT_FILE" \
            "$CODEX_MODEL" \
            "$CODEX_NATIVE" \
            "$CODEX_PACKAGE_ROOT" \
            "$CODEX_INTERNAL_ORIGINATOR_OVERRIDE" \
            "$stream_dir/supervise-codex-exec-stream.py" \
            "$stream_dir/extract-codex-exec-usage.py"

      - name: Verify AI Developer host integrity
        if: always() && steps.host_integrity_before.outputs.captured == 'true'
        timeout-minutes: 1
        env:
          HOST_NOTIFY_BEFORE: ${{ steps.host_integrity_before.outputs.notify }}
          HOST_DBUS_BEFORE: ${{ steps.host_integrity_before.outputs.dbus }}
          HOST_RESOLVED_BEFORE: ${{ steps.host_integrity_before.outputs.resolved }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$HOST_NOTIFY_BEFORE"
          test -n "$HOST_DBUS_BEFORE"
          test -n "$HOST_RESOLVED_BEFORE"

          notify_after="$(stat -Lc '%d %i %u %g %a' /run/systemd/notify)"
          dbus_after="$(stat -Lc '%d %i %u %g %a' /run/dbus/system_bus_socket)"
          test "$notify_after" = "$HOST_NOTIFY_BEFORE"
          test "$dbus_after" = "$HOST_DBUS_BEFORE"

          resolved_after="$(
            systemctl show systemd-resolved.service --no-pager \
              --property=ActiveState --property=SubState --property=MainPID --property=NRestarts |
              LC_ALL=C sort |
              tr '\n' ';'
          )"
          test "$resolved_after" = "$HOST_RESOLVED_BEFORE"
          printf '%s\n' "$resolved_after" | tr ';' '\n' | grep -Fxq 'ActiveState=active'
          printf '%s\n' "$resolved_after" | tr ';' '\n' | grep -Fxq 'SubState=running'
          getent ahosts github.com >/dev/null
          getent ahosts api.github.com >/dev/null
          printf 'HOST_INTEGRITY after sockets=unchanged resolved=unchanged dns=ok\n'
          echo 'ホストの保護対象socketと名前解決サービスに変化はなく、DNSも正常です。'

      - name: Collect trusted Codex Issue usage evidence
        id: usage_evidence
        if: always() && (steps.codex.outcome == 'success' || steps.codex.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: 1
        env:
          BASE_SHA: ${{ steps.issue_context.outputs.base_sha }}
          USAGE_HELPER_BLOBS: ${{ steps.issue_context.outputs.usage_helper_blobs }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ISSUE_NUMBER: ${{ github.event_name == 'repository_dispatch' && steps.resume-gate.outputs.issue_number || github.event.issue.number }}
          SELECTED_MODEL: ${{ steps.codex_model.outputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          # No pre-model copy or workload-written leftover is authority.
          rm -f -- "$RUNNER_TEMP/codex-usage-evidence.json"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/codex-usage.XXXXXX")"
          trap 'rm -rf -- "$evidence_dir"' EXIT
          usage_helpers=(collect-codex-usage-evidence.py select-codex-usage-journal.py
            build-codex-usage-evidence.py validate-codex-usage-identity.py
            validate-codex-usage-stream.py extract-codex-exec-usage.py)
          read -r -a expected_blobs <<< "$USAGE_HELPER_BLOBS"
          [ "${#expected_blobs[@]}" -eq "${#usage_helpers[@]}" ]
          for index in "${!usage_helpers[@]}"; do
            filename="${usage_helpers[$index]}"
            source_path=".github/scripts/$filename"
            expected_blob="${expected_blobs[$index]}"
            [[ "$expected_blob" =~ ^[0-9a-f]{40}$ ]]
            source_entry="$(git ls-tree "$BASE_SHA" -- "$source_path")"
            case "$source_entry" in
              "$(printf '100644 blob %s\t%s' "$expected_blob" "$source_path")"|"$(printf '100755 blob %s\t%s' "$expected_blob" "$source_path")") ;;
              *) exit 1 ;;
            esac
            git show "${BASE_SHA}:${source_path}" > "$evidence_dir/$filename"
            [ -f "$evidence_dir/$filename" ] && [ ! -L "$evidence_dir/$filename" ]
            test "$(git hash-object --no-filters "$evidence_dir/$filename")" = "$expected_blob"
          done
          # Reuse the existing post-systemd-run root journal authority. The
          # collector alone reads raw bytes, once; no shell capture or raw file.
          jq -cn --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$RUN_ID" --argjson run_attempt "$RUN_ATTEMPT" \
            --argjson issue_number "$ISSUE_NUMBER" --arg base_sha "$BASE_SHA" \
            --arg selected_model "$SELECTED_MODEL" \
            '{schema:"codex-usage-evidence-identity",version:1,repository:$repository,
              run_id:$run_id,run_attempt:$run_attempt,issue_number:$issue_number,
              job:"develop-from-issue",pr_number:null,base_sha:$base_sha,
              selected_model:$selected_model,cli_version:"0.159.3",
              reasoning_effort:"medium",invocation_mode:"fresh_exec"}' |
            sudo -n -- /usr/bin/env -i PATH=/usr/bin:/bin \
              /usr/bin/python3 -I -B "$evidence_dir/collect-codex-usage-evidence.py" \
              > "$evidence_dir/evidence.json"
          test -s "$evidence_dir/evidence.json"
          mv -T -- "$evidence_dir/evidence.json" "$RUNNER_TEMP/codex-usage-evidence.json"

      - name: Upload sanitized Codex Issue usage evidence
        id: usage_upload
        if: always() && steps.usage_evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-usage-evidence-develop-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-usage-evidence.json
          retention-days: 7
          if-no-files-found: error

      - name: Report Codex Issue usage evidence persistence
        if: always() && steps.usage_evidence.outcome != 'skipped'
        continue-on-error: true
        env:
          COLLECTION_OUTCOME: ${{ steps.usage_evidence.outcome }}
          UPLOAD_OUTCOME: ${{ steps.usage_upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Codex Issue usage evidence'
            printf '\n- 収集step: %s\n- 保存step: %s\n' "$COLLECTION_OUTCOME" "$UPLOAD_OUTCOME"
            echo '- artifact欠損・missing・invalid・usage unavailableはunknownであり、費用0を意味しません。'
            echo '- この収集・保存結果は既存の実行・停止・書き込み判定を変更しません。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore trusted post-Codex helpers
        env:
          BASE_SHA: ${{ steps.issue_context.outputs.base_sha }}
          NOTIFY_HUMAN_BLOB: ${{ steps.issue_context.outputs.notify_human_blob }}
          APPLY_HUMAN_PAUSE_BLOB: ${{ steps.issue_context.outputs.apply_human_pause_blob }}
          REQUIREMENTS_MARKER_BLOB: ${{ steps.issue_context.outputs.requirements_marker_blob }}
          DECISION_CLASSIFIER_BLOB: ${{ steps.issue_context.outputs.decision_classifier_blob }}
          SCOPE_MARKER_BLOB: ${{ steps.issue_context.outputs.scope_marker_blob }}
          DIFF_GUARD_BLOB: ${{ steps.issue_context.outputs.diff_guard_blob }}
          PAUSE_HELPER_BLOBS: ${{ steps.issue_context.outputs.pause_helper_blobs }}
        shell: bash
        run: |
          set -euo pipefail

          restore_base_blob() {
            local source_path="${1:?復元元のパスが必要です}"
            local destination="${2:?復元先が必要です}"
            local expected_blob="${3:?期待するblobが必要です}"
            if [[ ! "$expected_blob" =~ ^[0-9a-f]{40}$ ]]; then
              echo "信頼済みhelperのblob identityが不正です: $source_path。" >&2
              exit 1
            fi
            rm -f -- "$destination"
            git show "${BASE_SHA}:${source_path}" > "$destination"
            actual_blob="$(git hash-object --no-filters "$destination")"
            if [ "$actual_blob" != "$expected_blob" ]; then
              echo "Codex実行中に信頼済みhelperのblobが変化しました: $source_path" >&2
              exit 1
            fi
          }

          restore_base_blob '.github/scripts/notify-human.sh' \
            "$RUNNER_TEMP/notify-human.sh" "$NOTIFY_HUMAN_BLOB"
          restore_base_blob '.github/scripts/apply-human-pause.sh' \
            "$RUNNER_TEMP/apply-human-pause.sh" "$APPLY_HUMAN_PAUSE_BLOB"
          restore_base_blob '.github/scripts/has-requirements-change-marker.sh' \
            "$RUNNER_TEMP/has-requirements-change-marker.sh" "$REQUIREMENTS_MARKER_BLOB"
          restore_base_blob '.github/scripts/classify-ai-developer-decision-marker.sh' \
            "$RUNNER_TEMP/classify-ai-developer-decision-marker.sh" "$DECISION_CLASSIFIER_BLOB"
          restore_base_blob '.github/scripts/has-scope-decision-marker.sh' \
            "$RUNNER_TEMP/has-scope-decision-marker.sh" "$SCOPE_MARKER_BLOB"
          restore_base_blob '.github/scripts/evaluate-codex-diff-gate.sh' \
            "$RUNNER_TEMP/evaluate-codex-diff-gate.sh" "$DIFF_GUARD_BLOB"

          pause_helpers=(create-human-pause human-pause-record list-human-pause-records
            validate-human-pause-record-graph decompose-human-pause-record-graph
            derive-human-pause-pre-resume-state reconcile-human-pause-resume-acceptance
            reconcile-human-pause-active-pause apply-human-pause
            format-human-pause-notification notify-human)
          read -r -a expected_blobs <<< "$PAUSE_HELPER_BLOBS"
          [ "${#expected_blobs[@]}" -eq "${#pause_helpers[@]}" ] || exit 1
          trusted_pause_dir="$RUNNER_TEMP/trusted-human-pause"
          rm -rf -- "$trusted_pause_dir"
          mkdir -p "$trusted_pause_dir"
          for index in "${!pause_helpers[@]}"; do
            helper="${pause_helpers[$index]}"
            restore_base_blob ".github/scripts/${helper}.sh" \
              "$trusted_pause_dir/${helper}.sh" "${expected_blobs[$index]}"
          done

          rm -f -- "$RUNNER_TEMP/codex-diff-guard-contract.json"
          bash "$RUNNER_TEMP/evaluate-codex-diff-gate.sh" --contract > "$RUNNER_TEMP/codex-diff-guard-contract.json"
          jq -e '
            type == "object" and
            (keys | sort == ["max_changed_files", "max_changed_lines", "max_new_files"]) and
            (.max_changed_files | type == "number" and . > 0 and floor == .) and
            (.max_changed_lines | type == "number" and . > 0 and floor == .) and
            (.max_new_files | type == "number" and . > 0 and floor == .)
          ' "$RUNNER_TEMP/codex-diff-guard-contract.json" > /dev/null
          echo 'TRUSTED_POST_CODEX_HELPERS restored base blobs and regenerated diff guard contract.'
          echo '信頼済みhelperをベースのblobから復元し、差分上限の契約を再生成しました。'

      - name: Gate requirement changes
        id: development-gate
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'repository_dispatch' && steps.resume-gate.outputs.issue_number || github.event.issue.number }}
          CODEX_FINAL: ${{ runner.temp }}/codex-final.md
          APP_SLUG: ${{ steps.dev-token.outputs.app-slug }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          pause_for_human() {
            local pause_reason="${1:?pause reason is required}"
            local detail="${2:?pause detail is required}"
            local app_id fingerprint branch pr_list pr_number
            [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
            branch="ai/issue-${ISSUE_NUMBER}"
            pr_list="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number,headRefName,isCrossRepository --limit 100)"
            pr_number="$(jq -er --arg branch "$branch" '
              if type != "array" or length >= 100 or
                 (all(.[];
                   type == "object" and
                   (.number | type == "number" and . > 0 and floor == .) and
                   .headRefName == $branch and
                   (.isCrossRepository | type == "boolean")) | not)
              then error("malformed or incomplete PR list")
              else
                map(select(.isCrossRepository == false)) |
                if length > 1 then error("ambiguous PR target")
                elif length == 0 then "-"
                else .[] | .number | tostring end
              end
            ' <<< "$pr_list")"
            app_id="$(gh api "/apps/$APP_SLUG" --jq '.id')"
            [[ "$app_id" =~ ^[1-9][0-9]*$ ]]
            local options=(--failed-action develop)
            if [[ "$pause_reason" == requirements_change || "$pause_reason" == scope_decision ]]; then
              fingerprint="$(gh api "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" | python3 -c '
          import hashlib, json, sys
          body = json.load(sys.stdin)["body"]
          if not isinstance(body, str):
              raise ValueError("Issue body is not a string")
          print("sha256:" + hashlib.sha256(body.encode("utf-8")).hexdigest())
          ')"
              options=(--issue-body-fingerprint "$fingerprint")
            fi
            bash "$RUNNER_TEMP/trusted-human-pause/create-human-pause.sh" create \
              "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "${pr_number:--}" "$app_id" \
              "$pause_reason" "$detail" "${options[@]}"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$detail"
            echo 'continue=false' >> "$GITHUB_OUTPUT"
          }
          if [ ! -s "$CODEX_FINAL" ]; then
            pause_for_human developer_execution_failed 'Codexの最終報告がありません。人間の判断があるまで自動開発を停止します。'
            exit 0
          fi
          set +e
          classification="$(bash "$RUNNER_TEMP/classify-ai-developer-decision-marker.sh" "$CODEX_FINAL")"
          classification_status=$?
          set -e
          if [ "$classification_status" -ne 0 ]; then
            pause_for_human developer_execution_failed 'decision markerの分類に失敗しました。人間の判断があるまで自動開発を停止します。'
            exit 0
          fi
          case "$classification" in
            requirements_change)
              requirements_report="$(mktemp "$RUNNER_TEMP/requirements-report.XXXXXX" 2>/dev/null)" || requirements_report=''
              trap 'if [ -n "$requirements_report" ]; then rm -f -- "$requirements_report"; fi' EXIT
              requirements_detail='Codexが要件変更の必要性を報告しました。人間の判断があるまで自動開発を停止します。'
              requirements_report_valid=false
              # Trusted inline gate: human fields never determine machine reason.
              if python3 -I -B - "$CODEX_FINAL" "$requirements_report" <<'PY'
          import html
          import os
          import re
          import stat
          import sys
          import unicodedata

          try:
              fd = os.open(sys.argv[1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as source:
                  if not stat.S_ISREG(os.fstat(source.fileno()).st_mode):
                      raise ValueError
                  raw = source.read(16 * 1024 + 1)
              if not raw or len(raw) > 16 * 1024:
                  raise ValueError
              report = raw.decode("utf-8", "strict").replace("\r\n", "\n")
              if any(unicodedata.category(c) in ("Cc", "Cf", "Cs", "Zl", "Zp")
                     for c in report if c != "\n"):
                  raise ValueError
              labels = (
                  "Requirement/upstream decision", "Why current Issue cannot complete",
                  "Affected identifiers", "Blocked downstream work",
              )
              fields = {}
              previous_field = False
              for line in report.split("\n"):
                  matched = False
                  for label in labels:
                      if line.startswith(label + ":"):
                          if label in fields or not line.startswith(label + ": "):
                              raise ValueError
                          value = line[len(label) + 2:]
                          if not value.strip() or len(value.encode("utf-8")) > 1024:
                              raise ValueError
                          fields[label] = value
                          matched = True
                  # Reject a continued value; other report prose must be separated.
                  if previous_field and line.strip() and not matched:
                      raise ValueError
                  previous_field = matched
              if set(fields) != set(labels):
                  raise ValueError
              # Reject obvious credential/raw diagnostic shapes, never echo matches.
              unsafe = re.compile(
                  r"-----BEGIN[ A-Z]*PRIVATE KEY-----|\b(?:sk-|gh[pousr]_|github_pat_)[A-Za-z0-9_-]+"
                  r"|\b(?:AKIA|ASIA)[A-Z0-9]{16}\b|\bBearer\s+\S+"
                  r"|\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+"
                  r"|https?://[^\s]*(?:webhooks?/|[?&](?:token|key|secret)=)"
                  r"|\b(?:token|secret|password|credential|api[_ -]?key)\s*[:=]\s*\S+"
                  r"|\b[A-Z][A-Z0-9]*_[A-Z0-9_]+\s*=\s*\S+"
                  r"|\b(?:HOME|USER|LOGNAME|PATH|SHELL)\s*=\s*\S+"
                  r"|\b(?:uid|gid|userId|primaryGroupId|supplementaryGroupIds)\b[^\n]{0,16}\d"
                  r"|/(?:home|opt|tmp|var|run|proc|sys|etc|usr|mnt|Users|private|__w|_work|_temp)(?:/|\b)"
                  r"|\b[A-Za-z]:[\\/]|(?:hostedtoolcache|/toolcache/|/_actions/|/_temp/)"
                  r'|"(?:type|environment|env)"\s*:',
                  re.IGNORECASE,
              )
              if any(unsafe.search(value) for value in fields.values()):
                  raise ValueError
              def escape(value):
                  # Display model text literally; suppress HTML/Markdown and mentions.
                  value = html.escape(value, quote=True).replace("@", "&#64;")
                  return re.sub(r"([\\`*_{}\[\]()!|])", r"\\\1", value)
              rendered = "### 要件・上流判断の理由（Codexの報告）\n\n"
              rendered += "以下は人間向けの判断材料です。停止・再開の制御は既存pause recordを正本とします。\n\n"
              rendered += "\n".join("- " + label + ": " + escape(fields[label]) for label in labels) + "\n"
              if len(rendered.encode("utf-8")) > 8 * 1024:
                  raise ValueError
              fd = os.open(sys.argv[2], os.O_WRONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "wb") as output:
                  if not stat.S_ISREG(os.fstat(output.fileno()).st_mode):
                      raise ValueError
                  output.write(rendered.encode("utf-8"))
          except Exception:
              # No traceback, input bytes, paths, or environment in diagnostics.
              sys.exit(1)
          PY
              then
                requirements_report_valid=true
              else
                requirements_detail='要件・上流判断理由を安全な形式・上限内で検証できませんでした。raw内容は公開せずrequirements_changeの停止を維持します。人間による確認が必要です。'
              fi
              pause_for_human requirements_change "$requirements_detail"
              if [ "$requirements_report_valid" != true ]; then
                echo '要件・上流判断理由の検証に失敗しました。自動開発は停止しています。' >&2
                exit 1
              fi
              # Machine pause and generic comment already exist before human evidence.
              if ! gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body-file "$requirements_report" >/dev/null 2>&1; then
                echo '要件・上流判断理由の投稿を確認できませんでした。停止を維持し、自動再試行しません。' >&2
                exit 1
              fi
              ;;
            none) echo 'continue=true' >> "$GITHUB_OUTPUT" ;;
            scope_decision)
              scope_report="$(mktemp "$RUNNER_TEMP/scope-report.XXXXXX" 2>/dev/null)" || scope_report=''
              trap 'if [ -n "$scope_report" ]; then rm -f -- "$scope_report"; fi' EXIT
              scope_detail='Codexがスコープの判断の必要性を報告しました。対象範囲がIssueに記録されるまで自動開発を停止します。'
              scope_report_valid=false
              # Trusted inline gate: human fields never determine machine reason.
              if python3 -I -B - "$CODEX_FINAL" "$scope_report" <<'PY'
          import html
          import os
          import re
          import stat
          import sys
          import unicodedata

          try:
              fd = os.open(sys.argv[1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as source:
                  if not stat.S_ISREG(os.fstat(source.fileno()).st_mode):
                      raise ValueError
                  raw = source.read(16 * 1024 + 1)
              if not raw or len(raw) > 16 * 1024:
                  raise ValueError
              report = raw.decode("utf-8", "strict").replace("\r\n", "\n")
              if any(unicodedata.category(c) in ("Cc", "Cf", "Cs", "Zl", "Zp")
                     for c in report if c != "\n"):
                  raise ValueError
              labels = (
                  "Observed fact", "Missing/new Contract category",
                  "Why Done is impossible under the current contract", "R/C/P/B change",
                  "Proposed split/prerequisite", "Product impact", "Unverified matters",
              )
              fields = {}
              for line in report.split("\n"):
                  for label in labels:
                      if line.startswith(label + ":"):
                          if label in fields or not line.startswith(label + ": "):
                              raise ValueError
                          value = line[len(label) + 2:]
                          if not value.strip() or len(value.encode("utf-8")) > 1024:
                              raise ValueError
                          fields[label] = value
              if set(fields) != set(labels):
                  raise ValueError
              # Reject obvious credential/raw diagnostic shapes, never echo matches.
              unsafe = re.compile(
                  r"-----BEGIN[ A-Z]*PRIVATE KEY-----|\b(?:sk-|gh[pousr]_|github_pat_)[A-Za-z0-9_-]+"
                  r"|\b(?:AKIA|ASIA)[A-Z0-9]{16}\b|\bBearer\s+\S+"
                  r"|\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+"
                  r"|https?://[^\s]*(?:webhooks?/|[?&](?:token|key|secret)=)"
                  r"|\b(?:token|secret|password|credential|api[_ -]?key)\s*[:=]\s*\S+"
                  r"|\b[A-Z][A-Z0-9]*_[A-Z0-9_]+\s*=\s*\S+"
                  r"|\b(?:HOME|USER|LOGNAME|PATH|SHELL)\s*=\s*\S+"
                  r"|\b(?:uid|gid|userId|primaryGroupId|supplementaryGroupIds)\b[^\n]{0,16}\d"
                  r"|/(?:home|opt|tmp|var|run|proc|sys|etc|usr|mnt|Users|private|__w|_work|_temp)(?:/|\b)"
                  r"|\b[A-Za-z]:[\\/]|(?:hostedtoolcache|/toolcache/|/_actions/|/_temp/)"
                  r'|"(?:type|environment|env)"\s*:',
                  re.IGNORECASE,
              )
              if any(unsafe.search(value) for value in fields.values()):
                  raise ValueError
              def escape(value):
                  # Display model text literally; suppress HTML/Markdown and mentions.
                  value = html.escape(value, quote=True).replace("@", "&#64;")
                  return re.sub(r"([\\`*_{}\[\]()!|])", r"\\\1", value)
              rendered = "### スコープ判断の理由（Codexの報告）\n\n"
              rendered += "以下は人間向けの判断材料です。停止・再開の制御は既存pause recordを正本とします。\n\n"
              rendered += "\n".join("- " + label + ": " + escape(fields[label]) for label in labels) + "\n"
              if len(rendered.encode("utf-8")) > 8 * 1024:
                  raise ValueError
              fd = os.open(sys.argv[2], os.O_WRONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "wb") as output:
                  if not stat.S_ISREG(os.fstat(output.fileno()).st_mode):
                      raise ValueError
                  output.write(rendered.encode("utf-8"))
          except Exception:
              # No traceback, input bytes, paths, or environment in diagnostics.
              sys.exit(1)
          PY
              then
                scope_report_valid=true
              else
                scope_detail='スコープ判断理由を安全な形式・上限内で検証できませんでした。raw内容は公開せずscope_decisionの停止を維持します。人間による確認が必要です。'
              fi
              pause_for_human scope_decision "$scope_detail"
              if [ "$scope_report_valid" != true ]; then
                echo 'スコープ判断理由の検証に失敗しました。自動開発は停止しています。' >&2
                exit 1
              fi
              # Machine pause and generic comment already exist before human evidence.
              if ! gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body-file "$scope_report" >/dev/null 2>&1; then
                echo 'スコープ判断理由の投稿を確認できませんでした。停止を維持し、自動再試行しません。' >&2
                exit 1
              fi
              ;;
            *)
              pause_for_human developer_execution_failed 'decision marker classifierの出力が不正です。人間の判断があるまで自動開発を停止します。'
              ;;
          esac

      - name: Evaluate trusted diff guard
        if: steps.development-gate.outputs.continue == 'true'
        id: diff-guard
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event_name == 'repository_dispatch' && steps.resume-gate.outputs.issue_number || github.event.issue.number }}
          APP_SLUG: ${{ steps.dev-token.outputs.app-slug }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ai-context
          git reset -- .ai-context
          git add -A

          if ! jq -e '
            type == "object" and
            (keys | sort == ["max_changed_files", "max_changed_lines", "max_new_files"]) and
            (.max_changed_files | type == "number" and . > 0 and floor == .) and
            (.max_changed_lines | type == "number" and . > 0 and floor == .) and
            (.max_new_files | type == "number" and . > 0 and floor == .)
          ' "$RUNNER_TEMP/codex-diff-guard-contract.json" > /dev/null; then
            echo '信頼済みdiff guard契約を取得できないか、形式が不正です。' >&2
            exit 1
          fi
          max_changed_files="$(jq -r .max_changed_files "$RUNNER_TEMP/codex-diff-guard-contract.json")"
          max_changed_lines="$(jq -r .max_changed_lines "$RUNNER_TEMP/codex-diff-guard-contract.json")"
          max_new_files="$(jq -r .max_new_files "$RUNNER_TEMP/codex-diff-guard-contract.json")"

          result_json=''
          helper_status=0
          set +e
          result_json="$(bash "$RUNNER_TEMP/evaluate-codex-diff-gate.sh")"
          helper_status=$?
          set -e

          parsed=false
          result=''
          if [ -n "$result_json" ] && jq -e '
            type == "object" and
            (.result | type == "string") and
            (.changed_files | type == "number" and . >= 0 and floor == .) and
            (.additions | type == "number" and . >= 0 and floor == .) and
            (.deletions | type == "number" and . >= 0 and floor == .) and
            (.total_changed_lines | type == "number" and . >= 0 and floor == .) and
            (.new_files | type == "number" and . >= 0 and floor == .) and
            (if has("offending_paths") then
              (.offending_paths | type == "array" and length <= 10 and
                all(.[]; type == "string" and (tojson | utf8bytelength) <= 512) and
                (map(tojson | utf8bytelength) | add <= 2048)) and
              (.offending_paths_truncated | type == "boolean") and
              (.offending_paths_unknown | type == "boolean")
            else true end)
          ' <<< "$result_json" > /dev/null 2>&1; then
            parsed=true
            result="$(jq -r .result <<< "$result_json")"
          fi

          offending_json=''
          if [ "$parsed" = true ] && [ "$result" = error ]; then
            offending_json="$(jq -ac 'if has("offending_paths") then
              {offending_paths, offending_paths_truncated, offending_paths_unknown}
            else empty end' <<< "$result_json")"
          fi

          if [ "$helper_status" -eq 0 ] && [ "$parsed" = true ] && [ "$result" = pass ]; then
            echo 'continue=true' >> "$GITHUB_OUTPUT"
            {
              echo '### AI Developerのdiff guard'
              echo
              echo '- 結果: pass'
              echo "- 変更ファイル数: $(jq -r .changed_files <<< "$result_json") / ${max_changed_files}"
              echo "- 追加行数: $(jq -r .additions <<< "$result_json")"
              echo "- 削除行数: $(jq -r .deletions <<< "$result_json")"
              echo "- 変更行数合計: $(jq -r .total_changed_lines <<< "$result_json") / ${max_changed_lines}"
              echo "- 新規ファイル数: $(jq -r .new_files <<< "$result_json") / ${max_new_files}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          reason='信頼済みdiff guardがリポジトリへの書き込み前に停止しました。'
          if [ "$helper_status" -eq 0 ] && [ "$parsed" = true ] && [ "$result" = stop ]; then
            reason='信頼済みdiff guardが上限超過を検出し、commit・push・PR書き込み前に停止しました。'
          elif [ "$parsed" = true ] && [ "$result" = error ]; then
            reason='信頼済みdiff guardがステージ済み変更を安全に計測できなかったため、自動開発を停止しました。'
          elif [ "$parsed" = true ]; then
            reason="信頼済みdiff guardが予期しない結果 '${result}' を返したため、自動開発を停止しました。"
          elif [ "$helper_status" -ne 0 ]; then
            reason='信頼済みdiff guardのヘルパーが有効な機械可読結果を返さず失敗したため、自動開発を停止しました。'
          else
            reason='信頼済みdiff guardの出力を解析できなかったため、自動開発を停止しました。'
          fi

          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          branch="ai/issue-${ISSUE_NUMBER}"
          pr_list="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number,headRefName,isCrossRepository --limit 100)"
          pr_number="$(jq -er --arg branch "$branch" '
            if type != "array" or length >= 100 or
               (all(.[];
                 type == "object" and
                 (.number | type == "number" and . > 0 and floor == .) and
                 .headRefName == $branch and
                 (.isCrossRepository | type == "boolean")) | not)
            then error("malformed or incomplete PR list")
            else
              map(select(.isCrossRepository == false)) |
              if length > 1 then error("ambiguous PR target")
              elif length == 0 then "-"
              else .[] | .number | tostring end
            end
          ' <<< "$pr_list")"
          app_id="$(gh api "/apps/$APP_SLUG" --jq '.id')"
          [[ "$app_id" =~ ^[1-9][0-9]*$ ]]
          pause_reason=diff_guard_error
          options=()
          if [ "$helper_status" -eq 0 ] && [ "$parsed" = true ] && [ "$result" = stop ]; then
            pause_reason=diff_guard_exceeded
            fingerprint="$(gh api "/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" | python3 -c '
          import hashlib, json, sys
          body = json.load(sys.stdin)["body"]
          if not isinstance(body, str):
              raise ValueError("Issue body is not a string")
          print("sha256:" + hashlib.sha256(body.encode("utf-8")).hexdigest())
          ')"
            options=(--issue-body-fingerprint "$fingerprint")
          fi
          bash "$RUNNER_TEMP/trusted-human-pause/create-human-pause.sh" create \
            "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "${pr_number:--}" "$app_id" \
            "$pause_reason" "$reason" "${options[@]}"

          diagnostics="$reason"
          if [ "$parsed" = true ]; then
            diagnostics+=$'\n\n'"結果: ${result}."
            if [ "$result" = stop ]; then
              for field in changed_files additions deletions total_changed_lines new_files; do
                value="$(jq -r --arg field "$field" '.[$field]' <<< "$result_json")"
                diagnostics+=$'\n'"${field}: ${value}"
              done
            else
              if [ "$result" = error ]; then
                error_code="$(jq -r 'if (.error | type) == "string" then .error else empty end' <<< "$result_json")"
                if [ -n "$error_code" ]; then
                  diagnostics+=$'\n'"エラーコード: ${error_code}"
                fi
                if [ -n "$offending_json" ]; then
                  diagnostics+=$'\n'"対象のステージ済みパス (JSON):"$'\n'"    ${offending_json}"
                fi
              fi
              diagnostics+=$'\n'"計測値: unavailable"
            fi
          else
            diagnostics+=$'\n\n'"結果: unavailable."
            diagnostics+=$'\n'"計測値: unavailable"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$diagnostics"

          {
            echo '### AI Developerのdiff guard'
            echo
            echo "- 結果: ${result:-unavailable}"
            echo "- 上限: ${max_changed_files} 変更ファイル / ${max_changed_lines} 変更行 / ${max_new_files} 新規ファイル"
            if [ "$parsed" = true ] && [ "$result" = stop ]; then
              for field in changed_files additions deletions total_changed_lines new_files; do
                value="$(jq -r --arg field "$field" '.[$field]' <<< "$result_json")"
                echo "- ${field}: ${value}"
              done
            else
              if [ "$parsed" = true ] && [ "$result" = error ]; then
                error_code="$(jq -r 'if (.error | type) == "string" then .error else empty end' <<< "$result_json")"
                if [ -n "$error_code" ]; then
                  echo "- エラーコード: ${error_code}"
                fi
                if [ -n "$offending_json" ]; then
                  echo '- 対象のステージ済みパス (JSON):'
                  echo "    ${offending_json}"
                fi
              fi
              echo '- 計測値: unavailable'
            fi
            echo '- 判断: リポジトリへの書き込みを停止'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'continue=false' >> "$GITHUB_OUTPUT"

      - name: Commit, push, and open or update PR
        if: steps.development-gate.outputs.continue == 'true' && steps.diff-guard.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          APP_SLUG: ${{ steps.dev-token.outputs.app-slug }}
          ISSUE_NUMBER: ${{ github.event_name == 'repository_dispatch' && steps.resume-gate.outputs.issue_number || github.event.issue.number }}
          CODEX_FINAL: ${{ runner.temp }}/codex-final.md
        shell: bash
        run: |
          set -euo pipefail

          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq .id)"
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"

          if git diff --cached --quiet; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body 'このAI Developer実行ではリポジトリの変更はありませんでした。commit・pushは行っていません。人間の確認が必要です。'
            exit 0
          fi

          git commit -m "CodexでIssue #${ISSUE_NUMBER}を実装"
          pushed_commit="$(git rev-parse HEAD)"
          git push --set-upstream origin "$AI_BRANCH"

          report_file="$(mktemp)"
          {
            echo '### 検証結果の出所'
            echo
            echo '- 以下のCodex報告に記載された検証結果はCodexの自己申告であり、正式なGitHub Actionsの証拠ではありません。'
            echo "- pushしたcommit: ${pushed_commit}"
            echo '- 現在のHEADに対する正式な検証はGitHub Actions/checksに別途記録されます。このAI Developer投稿は、その状態や結果を証明しません。'
            echo
            echo '### Codexの報告'
            echo
            if [ -s "$CODEX_FINAL" ]; then cat "$CODEX_FINAL"; else echo 'Codexは最終報告を出さずに終了しました。'; fi
          } > "$report_file"

          pr_list="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AI_BRANCH" --state open --json number,headRefName,isCrossRepository --limit 100)"
          pr_number="$(jq -er --arg branch "$AI_BRANCH" '
            if type != "array" or length >= 100 or
               (all(.[];
                 type == "object" and
                 (.number | type == "number" and . > 0 and floor == .) and
                 .headRefName == $branch and
                 (.isCrossRepository | type == "boolean")) | not)
            then error("malformed or incomplete PR list")
            else
              map(select(.isCrossRepository == false)) |
              if length > 1 then error("ambiguous PR target")
              elif length == 0 then "-"
              else .[] | .number | tostring end
            end
          ' <<< "$pr_list")"
          if [ "$pr_number" = - ]; then
            issue_title="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json title \
              --jq '.title | select(type == "string" and length > 0)')"
            [ -n "$issue_title" ]
            body_file="$(mktemp)"
            {
              echo "Closes #${ISSUE_NUMBER}"
              echo
              echo '## AI開発の結果'
              echo
              cat "$report_file"
              echo
              echo '## レビュー準備'
              echo
              echo '- [ ] この決定に関係する参照、用語、トレーサビリティ、図をIssueの範囲内でまとめて更新した。'
              echo '- [ ] Codexの検証報告を自己申告として確認し、現在のHEADに対する該当GitHub Actions/checksを別途確認した。失敗、未実施の検証、残る不確実性を記録した。'
              echo '- [ ] 残る影響とフォローアップの判断をclosing Issueに記録した。'
              echo '- [ ] 人間が変更全体を確認し、Claudeレビューに進める状態であると判断した。'
              echo
              echo 'このPRはDraftで作成されます。関連する修正はこのPRにまとめ、人間が確認後にReady for reviewへ変更してください。Draftの更新ではClaudeレビューは実行されません。レビュー準備の確認と停止したレビューの再開はdocs/30_operations/ai-development-workflow.mdに従ってください。'
            } > "$body_file"
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$AI_BRANCH" --draft --title "$issue_title" --body-file "$body_file")"
            rm -f "$body_file"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Codexが${pr_url}をDraftで作成しました。関連する修正と検証を確認し、Claudeレビューを依頼する際にReady for reviewへ変更してください。"
          else
            gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body-file "$report_file"
          fi
          rm -f "$report_file"

  handle-issue-developer-failure:
    name: Handle Issue developer failure
    needs: [gate-issue-entry, develop-from-issue]
    if: >-
      always() &&
      ((github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        needs.gate-issue-entry.result == 'success' &&
        needs.gate-issue-entry.outputs.continue == 'true') ||
       (github.event_name == 'repository_dispatch' &&
        needs.develop-from-issue.outputs.resume_accepted == 'true')) &&
      needs.develop-from-issue.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted failure handler
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create developer App token
        id: dev-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}

      - name: Create common human pause
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          APP_SLUG: ${{ steps.dev-token.outputs.app-slug }}
          ISSUE_NUMBER: ${{ needs.develop-from-issue.outputs.issue_number }}
          JOB_RESULT: ${{ needs.develop-from-issue.result }}
          PRE_HEAD: ${{ needs.develop-from-issue.outputs.pre_write_remote_head }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          branch="ai/issue-${ISSUE_NUMBER}"
          app_id="$(gh api "/apps/$APP_SLUG" --jq '.id')"
          [[ "$app_id" =~ ^[1-9][0-9]*$ ]]
          pr_list="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number,headRefName,isCrossRepository --limit 100)"
          pr_number="$(jq -er --arg branch "$branch" '
            if type != "array" or length >= 100 or
               (all(.[];
                 type == "object" and
                 (.number | type == "number" and . > 0 and floor == .) and
                 .headRefName == $branch and
                 (.isCrossRepository | type == "boolean")) | not)
            then error("malformed or incomplete PR list")
            else
              map(select(.isCrossRepository == false)) |
              if length > 1 then error("ambiguous PR target")
              elif length == 0 then "-"
              else .[] | .number | tostring end
            end
          ' <<< "$pr_list")"

          current_head=unknown
          if current="$(python3 - "$GITHUB_REPOSITORY" "$branch" <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          repo, branch = sys.argv[1:]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}

          def get(path):
              request = urllib.request.Request("https://api.github.com" + path, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          repository = get("/repos/" + repo)
          if repository.get("full_name") != repo:
              raise ValueError("repository identity mismatch")
          try:
              result = get("/repos/" + repo + "/git/ref/heads/" + branch)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print("absent")
              sys.exit(0)
          head = result.get("object", {}).get("sha")
          if (result.get("ref") != "refs/heads/" + branch
                  or result.get("object", {}).get("type") != "commit"
                  or not isinstance(head, str)
                  or not re.fullmatch(r"[0-9a-f]{40}", head)):
              raise ValueError("malformed remote branch response")
          print(head)
          PY
          )"; then
            current_head="$current"
          fi
          valid_head() { [[ "$1" == absent || "$1" =~ ^[0-9a-f]{40}$ ]]; }
          reason=state_inconsistent
          options=()
          if [[ "$JOB_RESULT" == failure || "$JOB_RESULT" == cancelled ]] &&
             valid_head "$PRE_HEAD" && valid_head "$current_head" &&
             [[ "$PRE_HEAD" == "$current_head" ]]; then
            reason=developer_execution_failed
            options=(--failed-action develop)
            if [ "$pr_number" != '-' ]; then
              options+=(--repair-active --repair-head "$current_head")
            else
              options+=(--repair-active)
            fi
          fi
          detail="Issue起点Developerのjob結果: ${JOB_RESULT}; 書き込み前のremote HEAD: ${PRE_HEAD:-missing}; 現在のremote HEAD: ${current_head}。実行: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          bash .github/scripts/create-human-pause.sh create \
            "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" "$pr_number" "$app_id" \
            "$reason" "$detail" "${options[@]}"

  draft-after-claude-changes:
    name: Draft after Claude changes requested
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create reviewer App token for identity verification
        id: review-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}

      - name: Verify review author
        id: verify-reviewer
        env:
          EXPECTED_LOGIN: ${{ steps.review-token.outputs.app-slug }}[bot]
          ACTUAL_LOGIN: ${{ github.event.review.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          expected_slug="${EXPECTED_LOGIN%\[bot\]}"
          if [ "$ACTUAL_LOGIN" = "$EXPECTED_LOGIN" ] || [ "$ACTUAL_LOGIN" = "$expected_slug" ]; then
            echo 'trusted=true' >> "$GITHUB_OUTPUT"
          else
            echo "信頼できないレビュアーからの変更要求を無視します: $ACTUAL_LOGIN"
            echo 'trusted=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out trusted Draft gate
        if: steps.verify-reviewer.outputs.trusted == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Convert pull request to Draft
        if: steps.verify-reviewer.outputs.trusted == 'true'
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          REVIEWER_APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" || exit 0
          case "$is_draft" in true|false) ;; *) exit 0 ;; esac
          git show 'HEAD:.github/scripts/check-claude-followup-target.sh' > "$RUNNER_TEMP/check-claude-followup-target.sh"
          target_helper_blob="$(git rev-parse 'HEAD:.github/scripts/check-claude-followup-target.sh')"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/check-claude-followup-target.sh")" = "$target_helper_blob"
          target="$(bash "$RUNNER_TEMP/check-claude-followup-target.sh" \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_ID" "$REVIEW_COMMIT" "$REVIEWER_APP_SLUG" "$HEAD_REF")"
          if [ "$target" != current ]; then
            echo 'Draft対象が変わったため、処理をスキップします。'
            exit 0
          fi
          if [ "$is_draft" = false ]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --undo
          fi

  respond-to-claude:
    name: Respond to Claude
    needs: draft-after-claude-changes
    if: >-
      needs.draft-after-claude-changes.result == 'success' &&
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'ai/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: codex-writer-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      - name: Create reviewer App token for identity verification
        id: review-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}

      - name: Verify review author
        id: verify-reviewer
        env:
          EXPECTED_LOGIN: ${{ steps.review-token.outputs.app-slug }}[bot]
          ACTUAL_LOGIN: ${{ github.event.review.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          expected_slug="${EXPECTED_LOGIN%\[bot\]}"
          if [ "$ACTUAL_LOGIN" = "$EXPECTED_LOGIN" ] || [ "$ACTUAL_LOGIN" = "$expected_slug" ]; then
            echo 'trusted=true' >> "$GITHUB_OUTPUT"
          else
            echo "信頼できないレビュアーからの変更要求を無視します: $ACTUAL_LOGIN"
            echo 'trusted=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create developer App token
        if: steps.verify-reviewer.outputs.trusted == 'true'
        id: dev-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}

      - name: Check out trusted automation
        if: steps.verify-reviewer.outputs.trusted == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Gate automated follow-up
        if: steps.verify-reviewer.outputs.trusted == 'true'
        id: followup-gate
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER_APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
          DEVELOPER_APP_SLUG: ${{ steps.dev-token.outputs.app-slug }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git show 'HEAD:.github/scripts/check-claude-followup-target.sh' > "$RUNNER_TEMP/check-claude-followup-target.sh"
          target_helper_blob="$(git rev-parse 'HEAD:.github/scripts/check-claude-followup-target.sh')"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/check-claude-followup-target.sh")" = "$target_helper_blob"
          echo "target_helper_blob=$target_helper_blob" >> "$GITHUB_OUTPUT"
          target="$(bash "$RUNNER_TEMP/check-claude-followup-target.sh" \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_ID" "$REVIEW_COMMIT" "$REVIEWER_APP_SLUG" "$HEAD_REF")"
          if [ "$target" != current ]; then
            echo 'Claudeレビュー対象が古いか検証できないため、フォローアップをスキップします。'
            echo 'continue=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          result="$(bash .github/scripts/evaluate-followup-gate.sh \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEWER_APP_SLUG" "$DEVELOPER_APP_SLUG" "$REVIEW_BODY")"
          continue="$(jq -r .continue <<< "$result")"
          escalate="$(jq -r .escalate <<< "$result")"
          notify="$(jq -r .notify <<< "$result")"
          reason="$(jq -r .reason <<< "$result")"

          if [ "$escalate" = 'true' ]; then
            target="$(bash "$RUNNER_TEMP/check-claude-followup-target.sh" \
              "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_ID" "$REVIEW_COMMIT" "$REVIEWER_APP_SLUG" "$HEAD_REF")"
            if [ "$target" != current ]; then
              echo 'エスカレーション対象が変わったため、書き込みをスキップします。'
              echo 'continue=false' >> "$GITHUB_OUTPUT"
              echo 'notify=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The pause helper resolves and labels the PR's closing Issues.
            bash .github/scripts/apply-human-pause.sh \
              "$GITHUB_REPOSITORY" '-' "$PR_NUMBER"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "$reason"
          fi
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "notify=${notify}" >> "$GITHUB_OUTPUT"
          echo "continue=${continue}" >> "$GITHUB_OUTPUT"

      - name: Notify human of review escalation
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.notify == 'true'
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
          ESCALATION_REASON: ${{ steps.followup-gate.outputs.reason }}
        run: |
          bash .github/scripts/notify-human.sh \
            "${ESCALATION_REASON} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${{ github.event.pull_request.number }}"

      - name: Check out PR branch
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ steps.dev-token.outputs.token }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check follow-up checkout target
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true'
        id: followup-checkout
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          REVIEWER_APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$REVIEW_COMMIT" ]; then
            echo 'checkoutしたHEADがレビュー対象のcommitと異なるため、フォローアップをスキップします。'
            echo 'continue=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target="$(bash "$RUNNER_TEMP/check-claude-followup-target.sh" \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_ID" "$REVIEW_COMMIT" "$REVIEWER_APP_SLUG" "$HEAD_REF")"
          echo "continue=$([ "$target" = current ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build review context
        id: followup_context
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRUSTED_LOGINS: ${{ steps.dev-token.outputs.app-slug }},${{ steps.dev-token.outputs.app-slug }}[bot],app/${{ steps.dev-token.outputs.app-slug }},${{ steps.review-token.outputs.app-slug }},${{ steps.review-token.outputs.app-slug }}[bot],app/${{ steps.review-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          notify_human_blob="$(git rev-parse "${BASE_SHA}:.github/scripts/notify-human.sh")"
          apply_human_pause_blob="$(git rev-parse "${BASE_SHA}:.github/scripts/apply-human-pause.sh")"
          requirements_marker_blob="$(git rev-parse "${BASE_SHA}:.github/scripts/has-requirements-change-marker.sh")"
          diff_guard_blob="$(git rev-parse "${BASE_SHA}:.github/scripts/evaluate-codex-diff-gate.sh")"
          usage_helpers=(collect-codex-usage-evidence.py select-codex-usage-journal.py
            build-codex-usage-evidence.py validate-codex-usage-identity.py
            validate-codex-usage-stream.py extract-codex-exec-usage.py)
          usage_helper_blobs=()
          for filename in "${usage_helpers[@]}"; do
            blob="$(git rev-parse "${BASE_SHA}:.github/scripts/$filename")"
            [[ "$blob" =~ ^[0-9a-f]{40}$ ]]
            usage_helper_blobs+=("$blob")
          done
          {
            printf 'notify_human_blob=%s\n' "$notify_human_blob"
            printf 'apply_human_pause_blob=%s\n' "$apply_human_pause_blob"
            printf 'requirements_marker_blob=%s\n' "$requirements_marker_blob"
            printf 'diff_guard_blob=%s\n' "$diff_guard_blob"
            printf 'usage_helper_blobs=%s\n' "${usage_helper_blobs[*]}"
          } >> "$GITHUB_OUTPUT"
          mkdir -p .ai-context
          git show "${BASE_SHA}:.github/scripts/build-review-context.sh" > "$RUNNER_TEMP/build-review-context.sh"
          git show "${BASE_SHA}:AGENTS.md" > .ai-context/AGENTS.base.md
          git show "${BASE_SHA}:.github/scripts/apply-human-pause.sh" > "$RUNNER_TEMP/apply-human-pause.sh"
          git show "${BASE_SHA}:.github/scripts/has-requirements-change-marker.sh" > "$RUNNER_TEMP/has-requirements-change-marker.sh"
          git show "${BASE_SHA}:.github/scripts/notify-human.sh" > "$RUNNER_TEMP/notify-human.sh"
          git show "${BASE_SHA}:.github/scripts/evaluate-codex-diff-gate.sh" > "$RUNNER_TEMP/evaluate-codex-diff-gate.sh"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/notify-human.sh")" = "$notify_human_blob"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/apply-human-pause.sh")" = "$apply_human_pause_blob"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/has-requirements-change-marker.sh")" = "$requirements_marker_blob"
          test "$(git hash-object --no-filters "$RUNNER_TEMP/evaluate-codex-diff-gate.sh")" = "$diff_guard_blob"
          bash "$RUNNER_TEMP/evaluate-codex-diff-gate.sh" --contract > "$RUNNER_TEMP/codex-diff-guard-contract.json"
          jq -e '
            type == "object" and
            (keys | sort == ["max_changed_files", "max_changed_lines", "max_new_files"]) and
            (.max_changed_files | type == "number" and . > 0 and floor == .) and
            (.max_changed_lines | type == "number" and . > 0 and floor == .) and
            (.max_new_files | type == "number" and . > 0 and floor == .)
          ' "$RUNNER_TEMP/codex-diff-guard-contract.json" > /dev/null
          cp "$RUNNER_TEMP/codex-diff-guard-contract.json" .ai-context/diff-guard-contract.json
          bash "$RUNNER_TEMP/build-review-context.sh" "$GITHUB_REPOSITORY" "$PR_NUMBER" .ai-context/request.md "$TRUSTED_LOGINS"

          # Do not carry trusted post-Codex helpers across model execution.
          rm -f -- \
            "$RUNNER_TEMP/build-review-context.sh" \
            "$RUNNER_TEMP/notify-human.sh" \
            "$RUNNER_TEMP/apply-human-pause.sh" \
            "$RUNNER_TEMP/has-requirements-change-marker.sh" \
            "$RUNNER_TEMP/evaluate-codex-diff-gate.sh" \
            "$RUNNER_TEMP/codex-diff-guard-contract.json"

      - name: Select trusted Codex Issue model
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true'
        id: codex_model
        env:
          NORMAL_MODEL: ${{ vars.CODEX_MODEL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HEAD_REF" =~ ^ai/issue-([1-9][0-9]*)$ ]]
          export ISSUE_NUMBER="${BASH_REMATCH[1]}"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]{0,15}$ ]]
          selection_dir="$(mktemp -d "$RUNNER_TEMP/codex-model-selection.XXXXXX")"
          export SELECTION_DIR="$selection_dir"
          trap 'rm -rf -- "$selection_dir"' EXIT
          for filename in select-codex-issue-model.py codex-issue-model-policy.json; do
            source_path=".github/scripts/$filename"
            expected_blob="$(git rev-parse "${BASE_SHA}:${source_path}")"
            [[ "$expected_blob" =~ ^[0-9a-f]{40}$ ]]
            git show "${BASE_SHA}:${source_path}" > "$selection_dir/$filename"
            test "$(git hash-object --no-filters "$selection_dir/$filename")" = "$expected_blob"
          done
          python3 -I -B - <<'PY_MODEL'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          try:
              directory = Path(os.environ["SELECTION_DIR"])
              source = directory / "select-codex-issue-model.py"
              policy = directory / "codex-issue-model-policy.json"
              spec = importlib.util.spec_from_file_location("trusted_model_selector", source)
              selector = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(selector)
              request = json.dumps(dict(repository=os.environ["GITHUB_REPOSITORY"],
                  issue=int(os.environ["ISSUE_NUMBER"]), normal_model=os.environ["NORMAL_MODEL"]),
                  ensure_ascii=True, separators=(",", ":")).encode()
              with policy.open("rb") as stream:
                  policy_bytes = stream.read(selector.MAX_POLICY_BYTES + 1)
              # Reuse the pure Contract; do not copy schema/allowlist/model rules.
              expected = selector.select(policy_bytes, request)
              canonical = (json.dumps(expected, sort_keys=True, ensure_ascii=True,
                  separators=(",", ":")) + "\n").encode()
              with (directory / "result.json").open("wb") as output:
                  result = subprocess.run([sys.executable, "-I", "-B", str(source), "--policy", str(policy)],
                      input=request, stdout=output, stderr=subprocess.DEVNULL)
              with (directory / "result.json").open("rb") as stream:
                  actual = stream.read(4097)
              # Exact canonical bytes prove closed schema, types, identity and selection.
              if result.returncode != 0 or not 0 < len(actual) <= 4096 or actual != canonical:
                  raise ValueError
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("model=" + expected["model"] + "\n")
              print("モデル選択: " + expected["selection"])
          except Exception:
              print("モデル選択を拒否しました: trusted_selection_failed", file=sys.stderr)
              sys.exit(1)
          PY_MODEL

      - name: Prepare Codex follow-up runtime
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true'
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_FINAL: ${{ runner.temp }}/codex-final.md
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          rm -f "$CODEX_HOME/config.toml"
          rm -f "$CODEX_FINAL"

      - name: Setup Codex follow-up runtime
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: 0.159.3
          codex-home: ${{ runner.temp }}/codex-home
          safety-strategy: unsafe
          allow-bot-users: ${{ steps.review-token.outputs.app-slug }}

      - name: Resolve trusted Codex follow-up runtime
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true'
        id: followup_codex_runtime
        timeout-minutes: 3
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        shell: bash
        run: |
          set -euo pipefail

          launcher="$(command -v codex)"
          test -n "$launcher"
          entry="$(realpath "$launcher")"
          test "$(basename "$entry")" = codex.js
          package_root="$(realpath "$(dirname "$(dirname "$entry")")")"
          test -s "$package_root/package.json"
          test "$(realpath "$package_root/bin/codex.js")" = "$entry"

          export CODEX_ENTRY="$entry"
          export CODEX_PACKAGE_ROOT="$package_root"
          resolver_output="$(
            node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";

          const entry = process.env.CODEX_ENTRY;
          const packageRoot = process.env.CODEX_PACKAGE_ROOT;
          const mainPackage = JSON.parse(
            fs.readFileSync(path.join(packageRoot, "package.json"), "utf8"),
          );
          if (mainPackage.name !== "@openai/codex") {
            throw new Error(`予期しないCodexパッケージ名: ${mainPackage.name}`);
          }
          if (mainPackage.version !== "0.159.3") {
            throw new Error(`予期しないCodexパッケージのバージョン: ${mainPackage.version}`);
          }

          let platformPackage;
          let targetTriple;
          if (process.platform === "linux" && process.arch === "x64") {
            platformPackage = "@openai/codex-linux-x64";
            targetTriple = "x86_64-unknown-linux-musl";
          } else if (process.platform === "linux" && process.arch === "arm64") {
            platformPackage = "@openai/codex-linux-arm64";
            targetTriple = "aarch64-unknown-linux-musl";
          } else {
            throw new Error(
              `未対応のCodex実行環境: ${process.platform}/${process.arch}`,
            );
          }

          const require = createRequire(entry);
          const platformPackageJson = require.resolve(
            `${platformPackage}/package.json`,
          );
          const nativePath = path.join(
            path.dirname(platformPackageJson),
            "vendor",
            targetTriple,
            "bin",
            "codex",
          );
          const nativeStat = fs.statSync(nativePath);
          if (!nativeStat.isFile()) {
            throw new Error("Codexのネイティブ実行ファイルは通常ファイルではありません。");
          }
          fs.accessSync(nativePath, fs.constants.X_OK);

          process.stdout.write(
            JSON.stringify({
              nativePath: fs.realpathSync(nativePath),
              packageRoot,
              targetTriple,
            }),
          );
          NODE
          )"

          native_path="$(jq -r '.nativePath' <<<"$resolver_output")"
          resolved_root="$(jq -r '.packageRoot' <<<"$resolver_output")"
          target_triple="$(jq -r '.targetTriple' <<<"$resolver_output")"
          test "$resolved_root" = "$package_root"
          test -x "$native_path"

          launcher_version="$(codex --version)"
          native_version="$(
            env \
              -u CODEX_MANAGED_BY_BUN \
              -u CODEX_MANAGED_BY_PNPM \
              -u CODEX_MANAGED_BY_VITE_PLUS \
              CODEX_MANAGED_PACKAGE_ROOT="$package_root" \
              CODEX_MANAGED_BY_NPM=1 \
              "$native_path" --version
          )"
          test "$launcher_version" = "$native_version"
          test "$native_version" = 'codex-cli 0.159.3'

          action_root="$(dirname "$RUNNER_WORKSPACE")/_actions/openai/codex-action/86365089eb2b84e0a8fb0717b304f8bdcb13b20e"
          action_main="$action_root/dist/main.js"
          test -f "$action_main"
          actual_blob="$(git hash-object "$action_main")"
          test "$actual_blob" = ce4e94e119abb91b980d23bfb4210688241f3a0a

          uid="$(id -u)"
          gid="$(id -g)"
          groups_json="$(id -G | tr ' ' '\n' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
          credentials="$(jq -cn \
            --argjson uid "$uid" \
            --argjson gid "$gid" \
            --argjson groups "$groups_json" \
            '{userId:$uid,primaryGroupId:$gid,supplementaryGroupIds:$groups}')"

          printf 'native_path=%s\n' "$native_path" >> "$GITHUB_OUTPUT"
          printf 'package_root=%s\n' "$package_root" >> "$GITHUB_OUTPUT"
          printf 'action_main=%s\n' "$action_main" >> "$GITHUB_OUTPUT"
          printf 'runner_credentials=%s\n' "$credentials" >> "$GITHUB_OUTPUT"
          printf '信頼済みCodex 0.159.3ランタイムを%s向けに確認しました（Action blob %s）。\n' \
            "$target_triple" "$actual_blob"

      - name: Prepare fixed Codex follow-up prompt
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true'
        timeout-minutes: 3
        env:
          CODEX_PROMPT_FILE: ${{ runner.temp }}/codex-followup-prompt.md
        shell: bash
        run: |
          set -euo pipefail
          cat > "$CODEX_PROMPT_FILE" <<'CODEX_PROMPT'
          Read .ai-context/AGENTS.base.md, .ai-context/request.md, and .ai-context/diff-guard-contract.json completely. The base-commit AGENTS copy is the governing instruction file.
          Address every blocking Claude finding in this working tree.
          Write the final report for humans on GitHub in Japanese. Preserve exact machine markers, identifiers, commands, paths, and external error text where required.
          Before editing, inspect every blocking finding against repository and supplied Issue evidence. If any finding requires a human requirement or upstream-phase decision, leave the entire working tree unchanged, do not mix in fixes for other findings, and follow the exact standalone [REQUIREMENTS_CHANGE_REQUIRED] marker contract in AGENTS.base.md.
          Otherwise, correct every valid in-scope finding and all directly affected authoritative artifacts; validate the result. Explain any finding not implemented with concrete repository or Issue evidence. Do not silently change requirements to satisfy a finding.
          The trusted contract sets maximum changed files, total changed lines (additions + deletions), and new files; keep every metric at or below its maximum.
          Keep the proposed repository change within the trusted diff guard contract. Avoid broad formatting changes and large generated additions. If the work cannot fit within those bounds, keep the change small and explain the required split in the final response.
          Do not commit, push, comment, merge, or contact external services; the workflow handles GitHub writes after you finish.
          CODEX_PROMPT

      - name: Capture Codex follow-up host integrity baseline
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true'
        id: followup_host_integrity_before
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail

          notify_before="$(stat -Lc '%d %i %u %g %a' /run/systemd/notify)"
          dbus_before="$(stat -Lc '%d %i %u %g %a' /run/dbus/system_bus_socket)"
          resolved_before="$(
            systemctl show systemd-resolved.service --no-pager \
              --property=ActiveState --property=SubState --property=MainPID --property=NRestarts |
              LC_ALL=C sort |
              tr '\n' ';'
          )"
          printf '%s\n' "$resolved_before" | tr ';' '\n' | grep -Fxq 'ActiveState=active'
          printf '%s\n' "$resolved_before" | tr ';' '\n' | grep -Fxq 'SubState=running'
          getent ahosts github.com >/dev/null
          getent ahosts api.github.com >/dev/null

          printf 'notify=%s\n' "$notify_before" >> "$GITHUB_OUTPUT"
          printf 'dbus=%s\n' "$dbus_before" >> "$GITHUB_OUTPUT"
          printf 'resolved=%s\n' "$resolved_before" >> "$GITHUB_OUTPUT"
          printf 'captured=true\n' >> "$GITHUB_OUTPUT"
          printf 'HOST_INTEGRITY before sockets=captured resolved=active/running dns=ok\n'
          echo 'ホストの保護対象socket、名前解決サービス、DNSの事前確認が完了しました。'

      - name: Run Codex follow-up
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true'
        id: codex
        timeout-minutes: 12
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_FINAL: ${{ runner.temp }}/codex-final.md
          CODEX_PROMPT_FILE: ${{ runner.temp }}/codex-followup-prompt.md
          CODEX_MODEL: ${{ steps.codex_model.outputs.model }}
          CODEX_INTERNAL_ORIGINATOR_OVERRIDE: codex_github_action
          CODEX_NATIVE: ${{ steps.followup_codex_runtime.outputs.native_path }}
          CODEX_PACKAGE_ROOT: ${{ steps.followup_codex_runtime.outputs.package_root }}
          ACTION_MAIN: ${{ steps.followup_codex_runtime.outputs.action_main }}
          RUNNER_CREDENTIALS: ${{ steps.followup_codex_runtime.outputs.runner_credentials }}
          CODEX_RUNTIME_MAX_SEC: 700
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          REVIEWER_APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          stream_source_failure() {
            echo '信頼済みCodex stream sourceを確認できませんでした。' >&2
            exit 1
          }
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || stream_source_failure
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || stream_source_failure
          stream_dir="$(mktemp -d "$RUNNER_TEMP/codex-stream.XXXXXX" 2>/dev/null)" || stream_source_failure
          for filename in supervise-codex-exec-stream.py extract-codex-exec-usage.py; do
            source_path=".github/scripts/$filename"
            expected_blob="$(git rev-parse "${BASE_SHA}:${source_path}" 2>/dev/null)" || stream_source_failure
            [[ "$expected_blob" =~ ^[0-9a-f]{40}$ ]] || stream_source_failure
            source_entry="$(git ls-tree "$BASE_SHA" -- "$source_path" 2>/dev/null)" || stream_source_failure
            case "$source_entry" in
              "$(printf '100644 blob %s\t%s' "$expected_blob" "$source_path")"|"$(printf '100755 blob %s\t%s' "$expected_blob" "$source_path")") ;;
              *) stream_source_failure ;;
            esac
            git show "${BASE_SHA}:${source_path}" > "$stream_dir/$filename" 2>/dev/null || stream_source_failure
            [ -f "$stream_dir/$filename" ] && [ ! -L "$stream_dir/$filename" ] || stream_source_failure
            actual_blob="$(git hash-object --no-filters "$stream_dir/$filename" 2>/dev/null)" || stream_source_failure
            [ "$actual_blob" = "$expected_blob" ] || stream_source_failure
          done

          test -x "$CODEX_NATIVE"
          test -f "$ACTION_MAIN"
          test "$(git hash-object "$ACTION_MAIN")" = ce4e94e119abb91b980d23bfb4210688241f3a0a
          test -s "$CODEX_HOME/config.toml"
          test -s "$CODEX_PROMPT_FILE"

          python3 - "$CODEX_HOME/config.toml" <<'PY'
          import pathlib
          import sys
          import tomllib
          import urllib.parse

          config_path = pathlib.Path(sys.argv[1])
          with config_path.open("rb") as fh:
              config = tomllib.load(fh)

          allowed_top_level = {"model_provider", "model_providers"}
          unexpected = sorted(set(config) - allowed_top_level)
          if unexpected:
              raise SystemExit(
                  f"setup専用ランタイムのCodex設定に予期しないキーがあります: {unexpected}"
              )

          provider_name = config.get("model_provider")
          if provider_name != "codex-action-responses-proxy":
              raise SystemExit("Codexのmodel_providerが想定外です")

          providers = config.get("model_providers")
          if not isinstance(providers, dict) or set(providers) != {provider_name}:
              raise SystemExit("Codexのmodel_providers形式が想定外です")
          provider = providers[provider_name]
          if not isinstance(provider, dict):
              raise SystemExit("Codexのprovider設定が想定外です")
          if provider.get("wire_api") != "responses":
              raise SystemExit("Codex proxy providerのwire_apiはresponsesである必要があります")

          parsed = urllib.parse.urlparse(str(provider.get("base_url", "")))
          if (
              parsed.scheme != "http"
              or parsed.hostname != "127.0.0.1"
              or parsed.port is None
              or not (1 <= parsed.port <= 65535)
              or parsed.path != "/v1"
              or parsed.params
              or parsed.query
              or parsed.fragment
              or parsed.username is not None
              or parsed.password is not None
          ):
              raise SystemExit("Codex proxy providerはloopbackのhttp /v1を使用する必要があります")
          PY

          case "$CODEX_RUNTIME_MAX_SEC" in
            700) ;;
            *)
              echo 'Codex RuntimeMaxSecが想定外です。' >&2
              exit 1
              ;;
          esac

          uid="$(id -u)"
          gid="$(id -g)"
          groups_json="$(id -G | tr ' ' '\n' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
          current_credentials="$(jq -cn \
            --argjson uid "$uid" \
            --argjson gid "$gid" \
            --argjson groups "$groups_json" \
            '{userId:$uid,primaryGroupId:$gid,supplementaryGroupIds:$groups}')"
          test "$current_credentials" = "$RUNNER_CREDENTIALS"
          test "$uid" -ne 0

          nobody_gid="$(id -g nobody)"
          case "$nobody_gid" in
            ''|*[!0-9]*|0)
              echo '安全なnobody gidを取得できませんでした。' >&2
              exit 1
              ;;
          esac

          runner_user="$(id -un)"
          runner_home="$HOME"
          runner_path="$PATH"
          unit="codex-followup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cat > "$RUNNER_TEMP/run-native-codex.sh" <<'CODEX_RUN'
          #!/bin/sh
          set -eu

          expected_uid="${1:?期待するuidが必要です}"
          expected_gid="${2:?期待するgidが必要です}"

          actual_uid="$(/usr/bin/id -u)"
          if [ "$actual_uid" != "$expected_uid" ]; then
            echo "サービス内の保護設定の事前確認でUIDが不一致です: 期待値 $expected_uid、実際値 $actual_uid。" >&2
            exit 41
          fi

          actual_gid="$(/usr/bin/id -g)"
          if [ "$actual_gid" != "$expected_gid" ]; then
            echo "サービス内の保護設定の事前確認でGIDが不一致です: 期待値 $expected_gid、実際値 $actual_gid。" >&2
            exit 42
          fi

          groups_status="$(/usr/bin/awk '/^Groups:/ { $1=""; sub(/^[[:space:]]+/, ""); print }' /proc/self/status)"
          if [ -n "$groups_status" ]; then
            echo "サービス内の保護設定の事前確認で補助グループが残っています: $groups_status。" >&2
            exit 43
          fi

          no_new_privs="$(/usr/bin/awk '/^NoNewPrivs:/ { print $2 }' /proc/self/status)"
          if [ "$no_new_privs" != 1 ]; then
            echo "サービス内の保護設定の事前確認でNoNewPrivsが不一致です: 実際値 ${no_new_privs:-未取得}。" >&2
            exit 44
          fi

          for field in CapInh CapPrm CapEff CapBnd CapAmb; do
            value="$(/usr/bin/awk -v field="$field" '$1 == field ":" { print $2 }' /proc/self/status)"
            if [ "$value" != 0000000000000000 ]; then
              echo "サービス内の保護設定の事前確認でcapabilityがゼロではありません: $field=${value:-未取得}。" >&2
              exit 45
            fi
          done

          if [ ! -x /usr/bin/sudo ]; then
            echo 'サービス内の保護設定の事前確認でsudoの拒否を検証できません: /usr/bin/sudoを使用できません。' >&2
            exit 39
          fi
          if /usr/bin/sudo -n true >/dev/null 2>&1; then
            echo 'サービス内の保護設定の事前確認でsudo権限が残っています。' >&2
            exit 40
          fi

          /usr/bin/python3 - <<'PY'
          import errno
          import os
          import socket
          import stat
          import sys

          protected_paths = os.environ.get("PROTECTED_UNIX_SOCKET_PATHS", "").split()
          if (
              len(protected_paths) != 13
              or len(set(protected_paths)) != 13
              or any(not path.startswith("/run/") for path in protected_paths)
          ):
              print(
                  "サービス内の保護設定の事前確認で保護対象socketの許可リストが不正です。",
                  file=sys.stderr,
              )
              raise SystemExit(48)

          try:
              sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          except OSError as exc:
              print(
                  f"サービス内の保護設定の事前確認でCodex sandboxに必要なAF_UNIXが遮断されています: {exc}",
                  file=sys.stderr,
              )
              raise SystemExit(46)
          else:
              sock.close()

          try:
              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          except OSError as exc:
              print(
                  f"サービス内の保護設定の事前確認でAF_INETが遮断されています: {exc}",
                  file=sys.stderr,
              )
              raise SystemExit(47)
          else:
              sock.close()

          host_ids = {}
          raw_host_ids = os.environ.get("PROTECTED_UNIX_SOCKET_HOST_IDS", "")
          if raw_host_ids:
              try:
                  for item in raw_host_ids.split(";"):
                      path, devino = item.split("=", 1)
                      dev, ino = (int(part) for part in devino.split(":", 1))
                      if path in host_ids:
                          raise ValueError("duplicate protected socket host id")
                      host_ids[path] = (dev, ino)
              except (TypeError, ValueError):
                  print(
                      "サービス内の保護設定の事前確認で保護対象socketのホスト基準値が不正です。",
                      file=sys.stderr,
                  )
                  raise SystemExit(48)
          if any(path not in protected_paths for path in host_ids):
              print(
                  "サービス内の保護設定の事前確認で保護対象socketのホスト基準値に想定外のパスがあります。",
                  file=sys.stderr,
              )
              raise SystemExit(48)

          for path in protected_paths:
              try:
                  st = os.stat(path)
              except FileNotFoundError:
                  continue
              except OSError as exc:
                  print(
                      f"サービス内の保護設定の事前確認で保護対象socket {path}を調査できません: {exc}",
                      file=sys.stderr,
                  )
                  raise SystemExit(48)

              if path not in host_ids:
                  print(
                      f"サービス内の保護設定の事前確認でホスト基準値取得後に保護対象socketが出現しました: {path}。",
                      file=sys.stderr,
                  )
                  raise SystemExit(48)

              if (
                  not stat.S_ISSOCK(st.st_mode)
                  or stat.S_IMODE(st.st_mode) != 0
                  or os.access(path, os.R_OK)
                  or os.access(path, os.W_OK)
                  or os.access(path, os.X_OK)
                  or (st.st_dev, st.st_ino) == host_ids[path]
              ):
                  print(
                      f"サービス内の保護設定の事前確認で保護対象socketの遮断が効いていません: {path}。",
                      file=sys.stderr,
                  )
                  raise SystemExit(48)

          def handle_walk_error(exc):
              if exc.errno in (errno.EACCES, errno.EPERM, errno.ENOENT):
                  return
              raise exc

          residual = []
          try:
              for root, _dirs, files in os.walk(
                  "/run",
                  topdown=True,
                  onerror=handle_walk_error,
                  followlinks=False,
              ):
                  for name in files:
                      path = os.path.join(root, name)
                      try:
                          st = os.stat(path, follow_symlinks=False)
                      except (FileNotFoundError, PermissionError):
                          continue
                      if (
                          stat.S_ISSOCK(st.st_mode)
                          and st.st_uid == 0
                          and os.access(path, os.W_OK)
                      ):
                          residual.append(path)
          except OSError as exc:
              print(
                  f"サービス内の保護設定の事前確認で/runの走査に失敗しました: {exc}",
                  file=sys.stderr,
              )
              raise SystemExit(49)

          if residual:
              rendered = ", ".join(sorted(set(residual))[:20])
              print(
                  "サービス内の保護設定の事前確認で書き込み可能なroot所有のUNIX socketが見つかりました: "
                  + rendered,
                  file=sys.stderr,
              )
              raise SystemExit(49)

          # Linux native x64/arm64 syscall numbers; invalid arguments must
          # still hit the filter, rather than kernel EINVAL/EBADF validation.
          import ctypes
          import platform
          import subprocess

          if platform.machine() not in ("x86_64", "aarch64"):
              raise SystemExit("io_uring検査の未対応architectureです。")
          libc = ctypes.CDLL(None, use_errno=True)
          libc.syscall.restype = ctypes.c_long
          for name, number in (("io_uring_setup", 425), ("io_uring_enter", 426),
                               ("io_uring_register", 427)):
              ctypes.set_errno(0)
              result = libc.syscall(ctypes.c_long(number), ctypes.c_long(-1),
                                    ctypes.c_void_p(), ctypes.c_long(0),
                                    ctypes.c_long(0), ctypes.c_void_p(), ctypes.c_long(0))
              error = ctypes.get_errno()
              print(f"IO_URING_DENY {name} result={result} errno={error}", flush=True)
              if result != -1 or error != errno.EPERM:
                  raise SystemExit("io_uring syscallのEPERM拒否が不成立です。")

          for command in (("node", "--version"), ("npm", "--version")):
              try:
                  completed = subprocess.run(command, capture_output=True, text=True,
                                             timeout=20, cwd="/", env=os.environ.copy())
              except (OSError, subprocess.TimeoutExpired):
                  raise SystemExit("Node/npmのversion commandを実行できません。")
              print(f"NODE_TOOLING {command[0]} rc={completed.returncode} "
                    f"version={completed.stdout.strip()}", flush=True)
              if completed.returncode != 0:
                  raise SystemExit("Node/npmのversion commandが失敗しました。")

          print(
              "Service-local hardening preflight verified AF_UNIX/AF_INET and protected UNIX socket boundary."
          )
          PY

          exec env \
            -u PROTECTED_UNIX_SOCKET_PATHS \
            -u PROTECTED_UNIX_SOCKET_HOST_IDS \
            -u CODEX_MANAGED_BY_BUN \
            -u CODEX_MANAGED_BY_PNPM \
            -u CODEX_MANAGED_BY_VITE_PLUS \
            CODEX_MANAGED_PACKAGE_ROOT="$CODEX_PACKAGE_ROOT" \
            CODEX_MANAGED_BY_NPM=1 \
            CODEX_HOME="$CODEX_HOME" \
            CODEX_INTERNAL_ORIGINATOR_OVERRIDE="$CODEX_INTERNAL_ORIGINATOR_OVERRIDE" \
            /usr/bin/python3 -I -B "$3" --extractor "$4" -- \
              "$CODEX_NATIVE" exec --json \
              --skip-git-repo-check \
              --cd "$GITHUB_WORKSPACE" \
              --output-last-message "$CODEX_FINAL" \
              --model "$CODEX_MODEL" \
              --config 'model_reasoning_effort="medium"' \
              --config 'default_permissions=":workspace"' \
              < "$CODEX_PROMPT_FILE"
          CODEX_RUN
          chmod 700 "$RUNNER_TEMP/run-native-codex.sh"

          target="$(bash "$RUNNER_TEMP/check-claude-followup-target.sh" \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_ID" "$REVIEW_COMMIT" "$REVIEWER_APP_SLUG" "$HEAD_REF")"
          if [ "$(git rev-parse HEAD)" != "$REVIEW_COMMIT" ] || [ "$target" != current ]; then
            echo '有料のCodex実行前にフォローアップ対象が変わったため、処理をスキップします。'
            echo 'continue=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          unset GH_TOKEN
          echo 'continue=true' >> "$GITHUB_OUTPUT"
          exec sudo -n -- \
            env -u ENV -u BASH_ENV -u SHELLOPTS \
            /bin/sh -c '
              set -eu
              runner_user="$1"
              uid="$2"
              nobody_gid="$3"
              runner_home="$4"
              runner_path="$5"
              runner_temp="$6"
              runtime_max_sec="$7"
              unit="$8"
              launcher="$9"
              code_workspace="${10}"
              codex_home="${11}"
              codex_final="${12}"
              codex_prompt_file="${13}"
              codex_model="${14}"
              codex_native="${15}"
              codex_package_root="${16}"
              originator="${17}"
              stream_supervisor="${18}"
              stream_extractor="${19}"
              protected_unix_socket_paths="/run/dbus/system_bus_socket /run/dhcpcd/eth0-4.unpriv.sock /run/docker.sock /run/snapd-snap.socket /run/snapd.socket /run/systemd/io.systemd.ManagedOOM /run/systemd/journal/dev-log /run/systemd/journal/socket /run/systemd/journal/stdout /run/systemd/journal/syslog /run/systemd/notify /run/systemd/userdb/io.systemd.DynamicUser /run/uuidd/request"
              inaccessible_paths=""
              protected_unix_socket_host_ids=""
              for path in $protected_unix_socket_paths; do
                inaccessible_paths="${inaccessible_paths:+$inaccessible_paths }-$path"
                if [ -e "$path" ]; then
                  if [ ! -S "$path" ]; then
                    echo "root側の保護設定の事前確認で保護対象UNIX socketの基準値取得に失敗しました: $pathはsocketではありません。" >&2
                    exit 50
                  fi
                  if ! host_owner="$(/usr/bin/stat -Lc "%u" "$path")"; then
                    echo "root側の保護設定の事前確認で保護対象UNIX socketの基準値取得に失敗しました: $pathの所有者を確認できません。" >&2
                    exit 50
                  fi
                  if ! host_devino="$(/usr/bin/stat -Lc "%d:%i" "$path")"; then
                    echo "root側の保護設定の事前確認で保護対象UNIX socketの基準値取得に失敗しました: $pathのdev:inodeを確認できません。" >&2
                    exit 50
                  fi
                  if [ "$host_owner" != 0 ]; then
                    echo "root側の保護設定の事前確認で保護対象UNIX socketの基準値取得に失敗しました: $pathの所有者=$host_owner。" >&2
                    exit 50
                  fi
                  protected_unix_socket_host_ids="${protected_unix_socket_host_ids}${protected_unix_socket_host_ids:+;}${path}=${host_devino}"
                fi
              done

              set +e
              /usr/bin/systemd-run \
                --quiet \
                --wait \
                --collect \
                --unit="$unit" \
                --property=Type=exec \
                --property="RuntimeMaxSec=${runtime_max_sec}s" \
                --property=TimeoutStopSec=5s \
                --property=KillMode=control-group \
                --property=SendSIGKILL=yes \
                --property=NoNewPrivileges=yes \
                --property="InaccessiblePaths=$inaccessible_paths" \
                --property=SystemCallArchitectures=native \
                --property="SystemCallFilter=~io_uring_setup:EPERM io_uring_enter:EPERM io_uring_register:EPERM" \
                /usr/bin/setpriv \
                  --reuid="$uid" \
                  --regid="$nobody_gid" \
                  --clear-groups \
                  --no-new-privs \
                  --bounding-set=-all \
                  --inh-caps=-all \
                  --ambient-caps=-all \
                  -- /usr/bin/env -i \
                  "HOME=$runner_home" \
                  "USER=$runner_user" \
                  "LOGNAME=$runner_user" \
                  "PATH=$runner_path" \
                  "RUNNER_TEMP=$runner_temp" \
                  "GITHUB_WORKSPACE=$code_workspace" \
                  "CODEX_HOME=$codex_home" \
                  "CODEX_FINAL=$codex_final" \
                  "CODEX_PROMPT_FILE=$codex_prompt_file" \
                  "CODEX_MODEL=$codex_model" \
                  "CODEX_NATIVE=$codex_native" \
                  "CODEX_PACKAGE_ROOT=$codex_package_root" \
                  "CODEX_INTERNAL_ORIGINATOR_OVERRIDE=$originator" \
                  "PROTECTED_UNIX_SOCKET_PATHS=$protected_unix_socket_paths" \
                  "PROTECTED_UNIX_SOCKET_HOST_IDS=$protected_unix_socket_host_ids" \
                  /bin/sh "$launcher" "$uid" "$nobody_gid" "$stream_supervisor" "$stream_extractor"
              rc=$?
              set -e

              /usr/bin/journalctl \
                --unit="$unit" \
                --no-pager \
                --output=cat \
                --lines=200 || true

              if [ "$rc" -eq 0 ]; then
                expected_preflight_marker="Service-local hardening preflight verified AF_UNIX/AF_INET and protected UNIX socket boundary."
                set +e
                preflight_journal="$(
                  /usr/bin/journalctl \
                    --unit="$unit" \
                    --no-pager \
                    --output=cat \
                    --quiet
                )"
                journal_rc=$?
                set -e
                if [ "$journal_rc" -ne 0 ] || ! printf "%s\n" "$preflight_journal" | grep -Fxq "$expected_preflight_marker"; then
                  echo "サービス内の保護設定の事前確認の成功markerをunit journalから取得できませんでした。" >&2
                  exit 51
                fi
                printf "%s\n" "$expected_preflight_marker"
                echo "サービス内のAF_UNIX/AF_INETと保護対象UNIX socketの境界を確認しました。"
              fi
              exit "$rc"
            ' codex-followup \
            "$runner_user" \
            "$uid" \
            "$nobody_gid" \
            "$runner_home" \
            "$runner_path" \
            "$RUNNER_TEMP" \
            "$CODEX_RUNTIME_MAX_SEC" \
            "$unit" \
            "$RUNNER_TEMP/run-native-codex.sh" \
            "$GITHUB_WORKSPACE" \
            "$CODEX_HOME" \
            "$CODEX_FINAL" \
            "$CODEX_PROMPT_FILE" \
            "$CODEX_MODEL" \
            "$CODEX_NATIVE" \
            "$CODEX_PACKAGE_ROOT" \
            "$CODEX_INTERNAL_ORIGINATOR_OVERRIDE" \
            "$stream_dir/supervise-codex-exec-stream.py" \
            "$stream_dir/extract-codex-exec-usage.py"

      - name: Verify Codex follow-up host integrity
        if: always() && steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true' && steps.followup_host_integrity_before.outputs.captured == 'true'
        timeout-minutes: 1
        env:
          HOST_NOTIFY_BEFORE: ${{ steps.followup_host_integrity_before.outputs.notify }}
          HOST_DBUS_BEFORE: ${{ steps.followup_host_integrity_before.outputs.dbus }}
          HOST_RESOLVED_BEFORE: ${{ steps.followup_host_integrity_before.outputs.resolved }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$HOST_NOTIFY_BEFORE"
          test -n "$HOST_DBUS_BEFORE"
          test -n "$HOST_RESOLVED_BEFORE"

          notify_after="$(stat -Lc '%d %i %u %g %a' /run/systemd/notify)"
          dbus_after="$(stat -Lc '%d %i %u %g %a' /run/dbus/system_bus_socket)"
          test "$notify_after" = "$HOST_NOTIFY_BEFORE"
          test "$dbus_after" = "$HOST_DBUS_BEFORE"

          resolved_after="$(
            systemctl show systemd-resolved.service --no-pager \
              --property=ActiveState --property=SubState --property=MainPID --property=NRestarts |
              LC_ALL=C sort |
              tr '\n' ';'
          )"
          test "$resolved_after" = "$HOST_RESOLVED_BEFORE"
          printf '%s\n' "$resolved_after" | tr ';' '\n' | grep -Fxq 'ActiveState=active'
          printf '%s\n' "$resolved_after" | tr ';' '\n' | grep -Fxq 'SubState=running'
          getent ahosts github.com >/dev/null
          getent ahosts api.github.com >/dev/null
          printf 'HOST_INTEGRITY after sockets=unchanged resolved=unchanged dns=ok\n'
          echo 'ホストの保護対象socketと名前解決サービスに変化はなく、DNSも正常です。'

      - name: Collect trusted Codex follow-up usage evidence
        id: usage_evidence
        if: always() && steps.codex.outputs.continue == 'true' && (steps.codex.outcome == 'success' || steps.codex.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: 1
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          USAGE_HELPER_BLOBS: ${{ steps.followup_context.outputs.usage_helper_blobs }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SELECTED_MODEL: ${{ steps.codex_model.outputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          # No pre-model copy or workload-written leftover is authority.
          rm -f -- "$RUNNER_TEMP/codex-usage-evidence.json"
          [[ "$HEAD_REF" =~ ^ai/issue-([1-9][0-9]*)$ ]]
          ISSUE_NUMBER="${BASH_REMATCH[1]}"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          evidence_dir="$(mktemp -d "$RUNNER_TEMP/codex-usage.XXXXXX")"
          trap 'rm -rf -- "$evidence_dir"' EXIT
          usage_helpers=(collect-codex-usage-evidence.py select-codex-usage-journal.py
            build-codex-usage-evidence.py validate-codex-usage-identity.py
            validate-codex-usage-stream.py extract-codex-exec-usage.py)
          read -r -a expected_blobs <<< "$USAGE_HELPER_BLOBS"
          [ "${#expected_blobs[@]}" -eq "${#usage_helpers[@]}" ]
          for index in "${!usage_helpers[@]}"; do
            filename="${usage_helpers[$index]}"
            source_path=".github/scripts/$filename"
            expected_blob="${expected_blobs[$index]}"
            [[ "$expected_blob" =~ ^[0-9a-f]{40}$ ]]
            source_entry="$(git ls-tree "$BASE_SHA" -- "$source_path")"
            case "$source_entry" in
              "$(printf '100644 blob %s\t%s' "$expected_blob" "$source_path")"|"$(printf '100755 blob %s\t%s' "$expected_blob" "$source_path")") ;;
              *) exit 1 ;;
            esac
            git show "${BASE_SHA}:${source_path}" > "$evidence_dir/$filename"
            [ -f "$evidence_dir/$filename" ] && [ ! -L "$evidence_dir/$filename" ]
            test "$(git hash-object --no-filters "$evidence_dir/$filename")" = "$expected_blob"
          done
          # Reuse the existing post-systemd-run root journal authority. The
          # collector alone reads raw bytes, once; no shell capture or raw file.
          jq -cn --arg repository "$GITHUB_REPOSITORY" \
            --argjson run_id "$RUN_ID" --argjson run_attempt "$RUN_ATTEMPT" \
            --argjson issue_number "$ISSUE_NUMBER" --argjson pr_number "$PR_NUMBER" \
            --arg base_sha "$BASE_SHA" \
            --arg selected_model "$SELECTED_MODEL" \
            '{schema:"codex-usage-evidence-identity",version:1,repository:$repository,
              run_id:$run_id,run_attempt:$run_attempt,issue_number:$issue_number,
              job:"respond-to-claude",pr_number:$pr_number,base_sha:$base_sha,
              selected_model:$selected_model,cli_version:"0.159.3",
              reasoning_effort:"medium",invocation_mode:"fresh_exec"}' |
            sudo -n -- /usr/bin/env -i PATH=/usr/bin:/bin \
              /usr/bin/python3 -I -B "$evidence_dir/collect-codex-usage-evidence.py" \
              > "$evidence_dir/evidence.json"
          test -s "$evidence_dir/evidence.json"
          mv -T -- "$evidence_dir/evidence.json" "$RUNNER_TEMP/codex-usage-evidence.json"

      - name: Upload sanitized Codex follow-up usage evidence
        id: usage_upload
        if: always() && steps.usage_evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-usage-evidence-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-usage-evidence.json
          retention-days: 7
          if-no-files-found: error

      - name: Report Codex follow-up usage evidence persistence
        if: always() && steps.usage_evidence.outcome != 'skipped'
        continue-on-error: true
        env:
          COLLECTION_OUTCOME: ${{ steps.usage_evidence.outcome }}
          UPLOAD_OUTCOME: ${{ steps.usage_upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Codex follow-up usage evidence'
            printf '\n- 収集step: %s\n- 保存step: %s\n' "$COLLECTION_OUTCOME" "$UPLOAD_OUTCOME"
            echo '- artifact欠損・missing・invalid・usage unavailableはunknownであり、費用0を意味しません。'
            echo '- この収集・保存結果は既存の実行・停止・書き込み判定を変更しません。'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore trusted post-Codex helpers
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true' && steps.codex.outputs.continue == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NOTIFY_HUMAN_BLOB: ${{ steps.followup_context.outputs.notify_human_blob }}
          APPLY_HUMAN_PAUSE_BLOB: ${{ steps.followup_context.outputs.apply_human_pause_blob }}
          REQUIREMENTS_MARKER_BLOB: ${{ steps.followup_context.outputs.requirements_marker_blob }}
          DIFF_GUARD_BLOB: ${{ steps.followup_context.outputs.diff_guard_blob }}
          TARGET_HELPER_BLOB: ${{ steps.followup-gate.outputs.target_helper_blob }}
        shell: bash
        run: |
          set -euo pipefail

          restore_base_blob() {
            local source_path="${1:?復元元のパスが必要です}"
            local destination="${2:?復元先が必要です}"
            local expected_blob="${3:?期待するblobが必要です}"
            if [[ ! "$expected_blob" =~ ^[0-9a-f]{40}$ ]]; then
              echo "信頼済みhelperのblob identityが不正です: $source_path。" >&2
              exit 1
            fi
            rm -f -- "$destination"
            git show "${BASE_SHA}:${source_path}" > "$destination"
            actual_blob="$(git hash-object --no-filters "$destination")"
            if [ "$actual_blob" != "$expected_blob" ]; then
              echo "Codex実行中に信頼済みhelperのblobが変化しました: $source_path" >&2
              exit 1
            fi
          }

          restore_base_blob '.github/scripts/notify-human.sh' \
            "$RUNNER_TEMP/notify-human.sh" "$NOTIFY_HUMAN_BLOB"
          restore_base_blob '.github/scripts/apply-human-pause.sh' \
            "$RUNNER_TEMP/apply-human-pause.sh" "$APPLY_HUMAN_PAUSE_BLOB"
          restore_base_blob '.github/scripts/has-requirements-change-marker.sh' \
            "$RUNNER_TEMP/has-requirements-change-marker.sh" "$REQUIREMENTS_MARKER_BLOB"
          restore_base_blob '.github/scripts/evaluate-codex-diff-gate.sh' \
            "$RUNNER_TEMP/evaluate-codex-diff-gate.sh" "$DIFF_GUARD_BLOB"
          restore_base_blob '.github/scripts/check-claude-followup-target.sh' \
            "$RUNNER_TEMP/check-claude-followup-target.sh" "$TARGET_HELPER_BLOB"

          rm -f -- "$RUNNER_TEMP/codex-diff-guard-contract.json"
          bash "$RUNNER_TEMP/evaluate-codex-diff-gate.sh" --contract > "$RUNNER_TEMP/codex-diff-guard-contract.json"
          jq -e '
            type == "object" and
            (keys | sort == ["max_changed_files", "max_changed_lines", "max_new_files"]) and
            (.max_changed_files | type == "number" and . > 0 and floor == .) and
            (.max_changed_lines | type == "number" and . > 0 and floor == .) and
            (.max_new_files | type == "number" and . > 0 and floor == .)
          ' "$RUNNER_TEMP/codex-diff-guard-contract.json" > /dev/null
          echo 'TRUSTED_POST_CODEX_HELPERS restored base blobs and regenerated diff guard contract.'
          echo '信頼済みhelperをベースのblobから復元し、差分上限の契約を再生成しました。'

      - name: Gate Codex follow-up requirement changes
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true' && steps.codex.outputs.continue == 'true'
        id: codex-requirements-gate
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEX_FINAL: ${{ runner.temp }}/codex-final.md
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          REVIEWER_APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          pause_for_human() {
            local reason="${1:?pause reason is required}"
            local target
            target="$(bash "$RUNNER_TEMP/check-claude-followup-target.sh" \
              "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_ID" "$REVIEW_COMMIT" "$REVIEWER_APP_SLUG" "$HEAD_REF")"
            if [ "$target" != current ]; then
              echo 'エスカレーション対象が変わったため、書き込みをスキップします。'
              echo 'continue=false' >> "$GITHUB_OUTPUT"
              echo 'notify=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$HEAD_REF" =~ ^ai/issue-([0-9]+)$ ]]; then
              issue_number="${BASH_REMATCH[1]}"
            else
              issue_number='-'
            fi
            bash "$RUNNER_TEMP/apply-human-pause.sh" \
              "$GITHUB_REPOSITORY" "$issue_number" "$PR_NUMBER"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$reason"
            echo 'continue=false' >> "$GITHUB_OUTPUT"
            echo 'notify=true' >> "$GITHUB_OUTPUT"
          }
          if [ ! -s "$CODEX_FINAL" ]; then
            pause_for_human 'Codexの最終報告がありません。人間の判断があるまで自動フォローアップを停止します。'
            exit 0
          fi
          set +e
          bash "$RUNNER_TEMP/has-requirements-change-marker.sh" "$CODEX_FINAL"
          marker_status=$?
          set -e
          if [ "$marker_status" -gt 1 ]; then
            pause_for_human '要件変更マーカーの判定に失敗しました。人間の判断があるまで自動フォローアップを停止します。'
            exit 0
          elif [ "$marker_status" -eq 0 ]; then
            pause_for_human 'Codexが要件変更の必要性を報告しました。人間の判断があるまで自動フォローアップを停止します。'
          else
            echo 'continue=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Notify human of Codex follow-up requirement escalation
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true' && steps.codex.outputs.continue == 'true' && steps.codex-requirements-gate.outputs.notify == 'true'
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: >-
          bash "$RUNNER_TEMP/notify-human.sh"
          "要件変更について人間の判断が必要です: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${{ github.event.pull_request.number }}"

      - name: Evaluate trusted follow-up diff guard
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true' && steps.codex.outputs.continue == 'true' && steps.codex-requirements-gate.outputs.continue == 'true'
        id: followup-diff-guard
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          REVIEWER_APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ai-context
          git reset -- .ai-context
          git add -A

          if ! jq -e '
            type == "object" and
            (keys | sort == ["max_changed_files", "max_changed_lines", "max_new_files"]) and
            (.max_changed_files | type == "number" and . > 0 and floor == .) and
            (.max_changed_lines | type == "number" and . > 0 and floor == .) and
            (.max_new_files | type == "number" and . > 0 and floor == .)
          ' "$RUNNER_TEMP/codex-diff-guard-contract.json" > /dev/null; then
            echo '信頼済みフォローアップdiff guard契約を取得できないか、形式が不正です。' >&2
            exit 1
          fi
          max_changed_files="$(jq -r .max_changed_files "$RUNNER_TEMP/codex-diff-guard-contract.json")"
          max_changed_lines="$(jq -r .max_changed_lines "$RUNNER_TEMP/codex-diff-guard-contract.json")"
          max_new_files="$(jq -r .max_new_files "$RUNNER_TEMP/codex-diff-guard-contract.json")"

          result_json=''
          helper_status=0
          set +e
          result_json="$(bash "$RUNNER_TEMP/evaluate-codex-diff-gate.sh")"
          helper_status=$?
          set -e

          parsed=false
          result=''
          if [ -n "$result_json" ] && jq -e '
            type == "object" and
            (.result | type == "string") and
            (.changed_files | type == "number" and . >= 0 and floor == .) and
            (.additions | type == "number" and . >= 0 and floor == .) and
            (.deletions | type == "number" and . >= 0 and floor == .) and
            (.total_changed_lines | type == "number" and . >= 0 and floor == .) and
            (.new_files | type == "number" and . >= 0 and floor == .) and
            (if has("offending_paths") then
              (.offending_paths | type == "array" and length <= 10 and
                all(.[]; type == "string" and (tojson | utf8bytelength) <= 512) and
                (map(tojson | utf8bytelength) | add <= 2048)) and
              (.offending_paths_truncated | type == "boolean") and
              (.offending_paths_unknown | type == "boolean")
            else true end)
          ' <<< "$result_json" > /dev/null 2>&1; then
            parsed=true
            result="$(jq -r .result <<< "$result_json")"
          fi

          offending_json=''
          if [ "$parsed" = true ] && [ "$result" = error ]; then
            offending_json="$(jq -ac 'if has("offending_paths") then
              {offending_paths, offending_paths_truncated, offending_paths_unknown}
            else empty end' <<< "$result_json")"
          fi

          if [ "$helper_status" -eq 0 ] && [ "$parsed" = true ] && [ "$result" = pass ]; then
            echo 'continue=true' >> "$GITHUB_OUTPUT"
            {
              echo '### AI Developerフォローアップのdiff guard'
              echo
              echo '- 結果: pass'
              echo "- 変更ファイル数: $(jq -r .changed_files <<< "$result_json") / ${max_changed_files}"
              echo "- 追加行数: $(jq -r .additions <<< "$result_json")"
              echo "- 削除行数: $(jq -r .deletions <<< "$result_json")"
              echo "- 変更行数合計: $(jq -r .total_changed_lines <<< "$result_json") / ${max_changed_lines}"
              echo "- 新規ファイル数: $(jq -r .new_files <<< "$result_json") / ${max_new_files}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          reason='信頼済みフォローアップdiff guardがリポジトリへの書き込み前に停止しました。'
          if [ "$helper_status" -eq 0 ] && [ "$parsed" = true ] && [ "$result" = stop ]; then
            reason='信頼済みフォローアップdiff guardが上限超過を検出し、commit・push・PR書き込み前に停止しました。'
          elif [ "$parsed" = true ] && [ "$result" = error ]; then
            reason='信頼済みフォローアップdiff guardがステージ済み変更を安全に計測できなかったため、自動フォローアップを停止しました。'
          elif [ "$parsed" = true ]; then
            reason="信頼済みフォローアップdiff guardが予期しない結果 '${result}' を返したため、自動フォローアップを停止しました。"
          elif [ "$helper_status" -ne 0 ]; then
            reason='信頼済みフォローアップdiff guardのヘルパーが有効な機械可読結果を返さず失敗したため、自動フォローアップを停止しました。'
          else
            reason='信頼済みフォローアップdiff guardの出力を解析できなかったため、自動フォローアップを停止しました。'
          fi

          if [[ "$HEAD_REF" =~ ^ai/issue-([0-9]+)$ ]]; then
            issue_number="${BASH_REMATCH[1]}"
          else
            issue_number='-'
          fi
          target="$(bash "$RUNNER_TEMP/check-claude-followup-target.sh" \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_ID" "$REVIEW_COMMIT" "$REVIEWER_APP_SLUG" "$HEAD_REF")"
          if [ "$target" != current ]; then
            echo 'diff guardのエスカレーション対象が変わったため、書き込みをスキップします。'
            echo 'continue=false' >> "$GITHUB_OUTPUT"
            echo 'notify=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash "$RUNNER_TEMP/apply-human-pause.sh" \
            "$GITHUB_REPOSITORY" "$issue_number" "$PR_NUMBER"

          diagnostics="$reason"
          if [ "$parsed" = true ]; then
            diagnostics+=$'\n\n'"結果: ${result}."
            if [ "$result" = stop ]; then
              for field in changed_files additions deletions total_changed_lines new_files; do
                value="$(jq -r --arg field "$field" '.[$field]' <<< "$result_json")"
                diagnostics+=$'\n'"${field}: ${value}"
              done
            else
              if [ "$result" = error ]; then
                error_code="$(jq -r 'if (.error | type) == "string" then .error else empty end' <<< "$result_json")"
                if [ -n "$error_code" ]; then
                  diagnostics+=$'\n'"エラーコード: ${error_code}"
                fi
                if [ -n "$offending_json" ]; then
                  diagnostics+=$'\n'"対象のステージ済みパス (JSON):"$'\n'"    ${offending_json}"
                fi
              fi
              diagnostics+=$'\n'"計測値: unavailable"
            fi
          else
            diagnostics+=$'\n\n'"結果: unavailable."
            diagnostics+=$'\n'"計測値: unavailable"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$diagnostics"

          {
            echo '### AI Developerフォローアップのdiff guard'
            echo
            echo "- 結果: ${result:-unavailable}"
            echo "- 上限: ${max_changed_files} 変更ファイル / ${max_changed_lines} 変更行 / ${max_new_files} 新規ファイル"
            if [ "$parsed" = true ] && [ "$result" = stop ]; then
              for field in changed_files additions deletions total_changed_lines new_files; do
                value="$(jq -r --arg field "$field" '.[$field]' <<< "$result_json")"
                echo "- ${field}: ${value}"
              done
            else
              if [ "$parsed" = true ] && [ "$result" = error ]; then
                error_code="$(jq -r 'if (.error | type) == "string" then .error else empty end' <<< "$result_json")"
                if [ -n "$error_code" ]; then
                  echo "- エラーコード: ${error_code}"
                fi
                if [ -n "$offending_json" ]; then
                  echo '- 対象のステージ済みパス (JSON):'
                  echo "    ${offending_json}"
                fi
              fi
              echo '- 計測値: unavailable'
            fi
            echo '- 判断: リポジトリへの書き込みを停止'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'continue=false' >> "$GITHUB_OUTPUT"
          echo 'notify=true' >> "$GITHUB_OUTPUT"

      - name: Notify human of follow-up diff guard stop
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true' && steps.codex.outputs.continue == 'true' && steps.codex-requirements-gate.outputs.continue == 'true' && steps.followup-diff-guard.outputs.notify == 'true'
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        run: >-
          bash "$RUNNER_TEMP/notify-human.sh"
          "AI Developerのフォローアップdiff guardについて人間の判断が必要です: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${{ github.event.pull_request.number }}"

      - name: Commit and answer review
        if: steps.verify-reviewer.outputs.trusted == 'true' && steps.followup-gate.outputs.continue == 'true' && steps.followup-checkout.outputs.continue == 'true' && steps.codex.outputs.continue == 'true' && steps.codex-requirements-gate.outputs.continue == 'true' && steps.followup-diff-guard.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          APP_SLUG: ${{ steps.dev-token.outputs.app-slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CODEX_FINAL: ${{ runner.temp }}/codex-final.md
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id }}
          REVIEWER_APP_SLUG: ${{ steps.review-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          target="$(bash "$RUNNER_TEMP/check-claude-followup-target.sh" \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" "$REVIEW_ID" "$REVIEW_COMMIT" "$REVIEWER_APP_SLUG" "$HEAD_REF")"
          if [ "$target" != current ]; then
            echo 'リポジトリへの書き込み前にフォローアップ対象が変わったため、処理をスキップします。'
            exit 0
          fi
          bot_login="${APP_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_login}" --jq .id)"
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"

          if git diff --cached --quiet; then
            report_file="$(mktemp)"
            {
              echo '### 検証結果の出所'
              echo
              echo '- このAI Developer実行ではリポジトリの変更はありませんでした。'
              echo '- 以下のCodex報告に記載された検証結果はCodexの自己申告であり、正式なGitHub Actionsの証拠ではありません。'
              echo '- 現在のHEADに対する正式な検証はGitHub Actions/checksに別途記録されます。このAI Developer投稿は、その状態や結果を証明しません。'
              echo
              echo '### Codexの報告'
              echo
              if [ -s "$CODEX_FINAL" ]; then cat "$CODEX_FINAL"; else echo 'Codexはリポジトリの変更を行わず、最終報告も出しませんでした。'; fi
            } > "$report_file"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$report_file"
            rm -f "$report_file"
            exit 0
          fi

          git commit -m "PR #${PR_NUMBER}のClaudeレビュー指摘に対応"
          git push origin "HEAD:${HEAD_REF}"
          expected_head="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4 5; do
            current_head="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
            if [ "$current_head" = "$expected_head" ]; then
              gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
              break
            fi
            if [ "$current_head" != "$EVENT_HEAD" ]; then
              echo "PR #${PR_NUMBER} のHEADが予期せず変わりました。期待値: ${expected_head}、確認値: ${current_head}。" >&2
              exit 1
            fi
            if [ "$attempt" = 5 ]; then
              echo "PR #${PR_NUMBER} のHEADがpushしたcommit ${expected_head} に到達しませんでした。" >&2
              exit 1
            fi
            sleep 2
          done
          report_file="$(mktemp)"
          {
            echo '### 検証結果の出所'
            echo
            echo '- 以下のCodex報告に記載された検証結果はCodexの自己申告であり、正式なGitHub Actionsの証拠ではありません。'
            echo "- pushしたcommit: ${expected_head}"
            echo '- 現在のHEADに対する正式な検証はGitHub Actions/checksに別途記録されます。このAI Developer投稿は、その状態や結果を証明しません。'
            echo
            echo '### Codexの報告'
            echo
            if [ -s "$CODEX_FINAL" ]; then cat "$CODEX_FINAL"; else echo 'Codexはbranchを更新しましたが、最終報告を出しませんでした。'; fi
          } > "$report_file"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$report_file"
          rm -f "$report_file"

  handle-claude-followup-failure:
    name: Handle Claude follow-up failure
    needs: [draft-after-claude-changes, respond-to-claude]
    if: >-
      always() &&
      (needs.draft-after-claude-changes.result == 'failure' || needs.respond-to-claude.result == 'failure') &&
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'changes_requested' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Create developer App token
        id: dev-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}

      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Create common human pause
        env:
          GH_TOKEN: ${{ steps.dev-token.outputs.token }}
          APP_SLUG: ${{ steps.dev-token.outputs.app-slug }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          DRAFT_RESULT: ${{ needs.draft-after-claude-changes.result }}
          FOLLOWUP_RESULT: ${{ needs.respond-to-claude.result }}
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          app_id="$(gh api "/apps/$APP_SLUG" --jq '.id')"
          [[ "$app_id" =~ ^[1-9][0-9]*$ ]]
          current_head=unknown
          if pr_json="$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"; then
            if head="$(jq -er --arg repo "$GITHUB_REPOSITORY" --argjson pr "$PR_NUMBER" '
              select(.number == $pr and .head.repo.full_name == $repo) |
              .head.sha | select(type == "string" and test("^[0-9a-f]{40}$"))
            ' <<< "$pr_json")"; then
              current_head="$head"
            fi
          fi
          reason=state_inconsistent
          options=()
          if [[ "$EVENT_HEAD" =~ ^[0-9a-f]{40}$ ]] && [[ "$current_head" == "$EVENT_HEAD" ]]; then
            reason=developer_execution_failed
            options=(--paused-head "$current_head" --failed-action fix
              --repair-active --repair-head "$current_head")
          fi
          detail="Claudeフォローアップ失敗。Draft jobの結果: ${DRAFT_RESULT}; フォローアップjobの結果: ${FOLLOWUP_RESULT}; event時のHEAD: ${EVENT_HEAD:-missing}; 現在のPR HEAD: ${current_head}。実行: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          notification_detail="Claudeフォローアップ失敗。Draft job: ${DRAFT_RESULT}; フォローアップjob: ${FOLLOWUP_RESULT}; event HEAD: ${EVENT_HEAD:-missing}; 現在のPR HEAD: ${current_head}。実行: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          bash .github/scripts/create-human-pause.sh create \
            "$GITHUB_REPOSITORY" '-' "$PR_NUMBER" "$app_id" \
            "$reason" "$detail" "${options[@]}" --notification-detail "$notification_detail"
