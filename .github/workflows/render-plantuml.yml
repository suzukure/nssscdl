name: Render PlantUML diagrams

on:
  push:
    branches-ignore: [main]
    paths:
      - 'docs/diagrams/plantuml/**/*.puml'
      - '.github/workflows/render-plantuml.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Create developer App token
        id: dev-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEV_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ steps.dev-token.outputs.token }}

      - name: Verify writable branch
        shell: bash
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$TARGET_REF" in
            refs/heads/main) exit 1 ;;
            refs/heads/*) git check-ref-format "$TARGET_REF" ;;
            *) exit 1 ;;
          esac
          test "$(git symbolic-ref --quiet HEAD)" = "$TARGET_REF"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download pinned PlantUML
        run: |
          curl --fail --location --silent --show-error \
            --output plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.6/plantuml-1.2026.6.jar
          echo '89948f14c93756c7a3fb7b69078ff37e8489fd79dd430c582b931e2f65358690  plantuml.jar' | sha256sum --check

      - name: Render SVG files
        shell: bash
        run: |
          set -euo pipefail

          src_root='docs/diagrams/plantuml'
          dst_root='docs/diagrams/rendered'

          find "$dst_root" -type f -name '*.svg' -delete

          while IFS= read -r -d '' file; do
            rel="${file#${src_root}/}"
            dest="${dst_root}/${rel%.puml}.svg"
            mkdir -p "$(dirname "$dest")"

            java -jar plantuml.jar -tsvg "$file"
            mv "${file%.puml}.svg" "$dest"
          done < <(find "$src_root" -type f -name '*.puml' -print0)

      - name: Commit rendered SVG files
        shell: bash
        env:
          TARGET_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          case "$TARGET_REF" in
            refs/heads/main) exit 1 ;;
            refs/heads/*) git check-ref-format "$TARGET_REF" ;;
            *) exit 1 ;;
          esac
          test "$(git symbolic-ref --quiet HEAD)" = "$TARGET_REF"

          git add docs/diagrams/rendered

          if git diff --cached --quiet; then
            echo 'Rendered diagrams are already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Render PlantUML diagrams'
          git push origin "HEAD:$TARGET_REF"
