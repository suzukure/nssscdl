name: Render PlantUML diagrams

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'docs/diagrams/plantuml/**/*.puml'
      - '.github/workflows/render-plantuml.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plantuml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download pinned PlantUML
        run: |
          curl --fail --location --silent --show-error \
            --output plantuml.jar \
            https://github.com/plantuml/plantuml/releases/download/v1.2026.6/plantuml-1.2026.6.jar
          echo '89948f14c93756c7a3fb7b69078ff37e8489fd79dd430c582b931e2f65358690  plantuml.jar' | sha256sum --check

      - name: Render SVG files
        shell: bash
        run: |
          set -euo pipefail
          src_root='docs/diagrams/plantuml'
          dst_root="$RUNNER_TEMP/plantuml-artifact"
          # A new empty directory prevents stale or tracked SVG contamination.
          mkdir "$dst_root"
          count=0
          while IFS= read -r -d '' file; do
            rel="${file#${src_root}/}"
            dest="${dst_root}/${rel%.puml}.svg"
            mkdir -p "$(dirname "$dest")"
            java -jar plantuml.jar -failfast2 -tsvg "$file" 2> "$RUNNER_TEMP/plantuml.stderr"
            if test -s "$RUNNER_TEMP/plantuml.stderr"; then
              cat "$RUNNER_TEMP/plantuml.stderr" >&2
              exit 1
            fi
            test -s "${file%.puml}.svg"
            mv "${file%.puml}.svg" "$dest"
            count=$((count + 1))
          done < <(find "$src_root" -type f -name '*.puml' -print0)
          test "$count" -gt 0
          test "$(find "$dst_root" -type f -name '*.svg' | wc -l)" -eq "$count"
          {
            printf 'source_sha=%s\nrun=%s/%s/actions/runs/%s\n' "$SOURCE_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'plantuml=v1.2026.6\nsvg_count=%s\n' "$count"
            sha256sum plantuml.jar
            java -version 2>&1
            dot -V 2>&1
          } > "$dst_root/renderer-info.txt"

      - name: Verify current PR head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          test "$current" = "$SOURCE_SHA"

      - name: Upload SVG bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plantuml-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/plantuml-artifact/
          if-no-files-found: error
          retention-days: 7
