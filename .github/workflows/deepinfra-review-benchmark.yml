name: DeepInfra Review Benchmark

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Frozen Stage A benchmark case
        required: true
        type: choice
        options:
          - A01-defect
          - A01-fixed
          - A02-defect
          - A02-fixed
          - A03-defect
          - A03-fixed
          - A04-defect
          - A04-fixed
          - A05-control
          - A06-control
      model_id:
        description: Allowlisted DeepInfra model
        required: true
        type: choice
        options:
          - deepseek-ai/DeepSeek-V4.1-Flash
          - deepseek-ai/DeepSeek-V4-Flash-0731
          - zai-org/GLM-5.3-Flash
          - deepseek-ai/DeepSeek-V4-Pro-0813

permissions:
  contents: read

jobs:
  benchmark:
    name: Run frozen Stage A review
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deepinfra-review-benchmark
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out trusted default-branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run one benchmark case
        id: benchmark
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CASE_ID: ${{ inputs.case_id }}
          MODEL_ID: ${{ inputs.model_id }}
          RESULT_JSON: ${{ runner.temp }}/deepinfra-review-benchmark.json
          RESULT_MD: ${{ runner.temp }}/deepinfra-review-benchmark.md
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPINFRA_API_KEY"
          rc=0
          python3 .github/scripts/deepinfra-review-benchmark.py \
            --repo "$GITHUB_REPOSITORY" \
            --case "$CASE_ID" \
            --model "$MODEL_ID" \
            --output-json "$RESULT_JSON" \
            --output-md "$RESULT_MD" || rc=$?
          test -s "$RESULT_JSON"
          test -s "$RESULT_MD"
          cat "$RESULT_MD" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepinfra-review-benchmark-${{ inputs.case_id }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/deepinfra-review-benchmark.json
            ${{ runner.temp }}/deepinfra-review-benchmark.md
          if-no-files-found: error
          retention-days: 7
