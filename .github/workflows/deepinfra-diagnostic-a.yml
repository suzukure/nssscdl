name: DeepInfra Diagnostic A

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-a:
    name: Run normalized context-only Diagnostic A
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deepinfra-diagnostic-a
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out trusted default-branch commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Diagnostic A once
        env:
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RESULT_JSON: ${{ runner.temp }}/deepinfra-diagnostic-a.json
          RESULT_MD: ${{ runner.temp }}/deepinfra-diagnostic-a.md
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEEPINFRA_API_KEY"
          rc=0
          python3 .github/scripts/deepinfra-review-benchmark.py \
            --repo "$GITHUB_REPOSITORY" \
            --case A04-defect \
            --model deepseek-ai/DeepSeek-V4-Flash-0731 \
            --diagnostic-a \
            --output-json "$RESULT_JSON" \
            --output-md "$RESULT_MD" || rc=$?
          test -s "$RESULT_JSON"
          test -s "$RESULT_MD"
          cat "$RESULT_MD" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload Diagnostic A result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deepinfra-diagnostic-a-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/deepinfra-diagnostic-a.json
            ${{ runner.temp }}/deepinfra-diagnostic-a.md
          if-no-files-found: error
          retention-days: 7
