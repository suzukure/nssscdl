name: AI Workflow Regression

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ai-workflow-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run AI workflow fixtures
        shell: bash
        run: |
          set -u -o pipefail
          export LC_ALL=C
          shopt -s nullglob
          fixtures=(.github/scripts/test-*.sh)

          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo 'No AI workflow fixtures matched .github/scripts/test-*.sh.' >&2
            {
              echo '## AI Workflow Regression'
              echo
              echo 'Result: **FAIL** (no matching fixtures)'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          failed=0
          {
            echo '## AI Workflow Regression'
            echo
            echo '| Fixture | Result |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          for fixture in "${fixtures[@]}"; do
            echo "::group::Fixture: $fixture"
            if bash "$fixture"; then
              result='PASS'
            else
              result='FAIL'
              failed=1
            fi
            echo '::endgroup::'
            printf '| `%s` | %s |\n' "$fixture" "$result" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$failed" -ne 0 ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Result: **FAIL**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'Result: **PASS**' >> "$GITHUB_STEP_SUMMARY"

  codex-systemd-long-runtime-probe:
    name: Codex systemd 700s poll probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [poll]
    steps:
      - name: Install pinned Codex Action runtime without model execution
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # v1.12
        with:
          codex-version: 0.153.4
          codex-home: ${{ runner.temp }}/codex-probe-home
          safety-strategy: unsafe

      - name: Resolve trusted native Codex and Action helper
        id: runtime
        shell: bash
        run: |
          set -euo pipefail

          launcher="$(command -v codex)"
          test -n "$launcher"
          entry="$(realpath "$launcher")"
          test "$(basename "$entry")" = codex.js
          package_root="$(realpath "$(dirname "$(dirname "$entry")")")"
          test -s "$package_root/package.json"
          test "$(jq -r .name "$package_root/package.json")" = '@openai/codex'
          test "$(jq -r .version "$package_root/package.json")" = '0.153.4'

          case "$(uname -m)" in
            x86_64)
              platform_package='@openai/codex-linux-x64'
              target_triple='x86_64-unknown-linux-musl'
              ;;
            aarch64|arm64)
              platform_package='@openai/codex-linux-arm64'
              target_triple='aarch64-unknown-linux-musl'
              ;;
            *)
              echo "Unsupported Codex platform: $(uname -m)" >&2
              exit 1
              ;;
          esac

          platform_json="$(
            node -e '
              const { createRequire } = require("node:module");
              const req = createRequire(process.argv[1]);
              process.stdout.write(req.resolve(process.argv[2] + "/package.json"));
            ' "$entry" "$platform_package"
          )"
          native_path="$(realpath "$(dirname "$platform_json")/vendor/$target_triple/bin/codex")"
          test -x "$native_path"

          launcher_version="$(codex --version)"
          native_version="$(
            env \
              -u CODEX_MANAGED_BY_BUN \
              -u CODEX_MANAGED_BY_PNPM \
              -u CODEX_MANAGED_BY_VITE_PLUS \
              CODEX_MANAGED_PACKAGE_ROOT="$package_root" \
              CODEX_MANAGED_BY_NPM=1 \
              "$native_path" --version
          )"
          test "$launcher_version" = "$native_version"
          test "$native_version" = 'codex-cli 0.153.4'

          action_root="$(dirname "$RUNNER_WORKSPACE")/_actions/openai/codex-action/86365089eb2b84e0a8fb0717b304f8bdcb13b20e"
          action_main="$action_root/dist/main.js"
          test -f "$action_main"
          actual_blob="$(git hash-object "$action_main")"
          test "$actual_blob" = ce4e94e119abb91b980d23bfb4210688241f3a0a

          uid="$(id -u)"
          gid="$(id -g)"
          groups_json="$(id -G | tr ' ' '\n' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
          credentials="$(jq -cn \
            --argjson uid "$uid" \
            --argjson gid "$gid" \
            --argjson groups "$groups_json" \
            '{userId:$uid,primaryGroupId:$gid,supplementaryGroupIds:$groups}')"

          printf 'native_path=%s\n' "$native_path" >> "$GITHUB_OUTPUT"
          printf 'package_root=%s\n' "$package_root" >> "$GITHUB_OUTPUT"
          printf 'action_main=%s\n' "$action_main" >> "$GITHUB_OUTPUT"
          printf 'runner_credentials=%s\n' "$credentials" >> "$GITHUB_OUTPUT"
          printf 'PROBE_DATA runtime version=%q target=%q action_blob=%s uid=%s gid=%s\n' \
            "$native_version" "$target_triple" "$actual_blob" "$uid" "$gid"

      - name: Prepare actual Codex cgroup probe
        id: probe-prepare
        timeout-minutes: 2
        shell: bash
        env:
          PROBE_MODE: ${{ matrix.mode }}
          CODEX_HOME: ${{ runner.temp }}/codex-probe-home
          CODEX_NATIVE: ${{ steps.runtime.outputs.native_path }}
          CODEX_PACKAGE_ROOT: ${{ steps.runtime.outputs.package_root }}
          ACTION_MAIN: ${{ steps.runtime.outputs.action_main }}
          RUNNER_CREDENTIALS: ${{ steps.runtime.outputs.runner_credentials }}
        run: |
          set -euo pipefail

          case "$PROBE_MODE" in
            wait|poll) ;;
            *)
              echo "Unexpected probe mode: $PROBE_MODE" >&2
              exit 1
              ;;
          esac

          marker_prefix="$RUNNER_TEMP/codex-systemd-$PROBE_MODE"
          unit="codex-systemd-${PROBE_MODE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$unit" > "${marker_prefix}-unit"
          printf '%s\n' "$(date +%s%N)" > "${marker_prefix}-start"

          cat > "$RUNNER_TEMP/hanging-responses-server.py" <<'PY'
          import http.server
          import os
          import pathlib
          import time

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          mode = os.environ["PROBE_MODE"]
          prefix = root / f"codex-systemd-{mode}"

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  raw_length = self.headers.get("Content-Length")
                  if raw_length is None:
                      raise RuntimeError("missing Content-Length")
                  length = int(raw_length)
                  if length <= 0:
                      raise RuntimeError("empty request body")
                  body = self.rfile.read(length)
                  if len(body) != length:
                      raise RuntimeError("short request body")
                  prefix.with_name(prefix.name + "-request").write_text(
                      f"path={self.path}\ncontent_length={length}\n"
                  )
                  time.sleep(730)

              def log_message(self, format, *args):
                  return

          server = http.server.HTTPServer(("127.0.0.1", 0), Handler)
          prefix.with_name(prefix.name + "-server-port").write_text(
              f"{server.server_address[1]}\n"
          )
          prefix.with_name(prefix.name + "-server-pid").write_text(
              f"{os.getpid()}\n"
          )
          server.handle_request()
          PY

          env -u RUNNER_TRACKING_ID PROBE_MODE="$PROBE_MODE" \
            nohup python3 "$RUNNER_TEMP/hanging-responses-server.py" \
            </dev/null \
            >"${marker_prefix}-server.stdout" \
            2>"${marker_prefix}-server.stderr" &
          server_pid=$!

          for _ in $(seq 1 100); do
            if [ -s "${marker_prefix}-server-port" ]; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'Local Responses server exited before publishing its port.' >&2
              cat "${marker_prefix}-server.stderr" >&2 || true
              exit 1
            fi
            sleep 0.1
          done
          test -s "${marker_prefix}-server-port"
          port="$(cat "${marker_prefix}-server-port")"
          case "$port" in
            ''|*[!0-9]*)
              echo 'Local Responses server returned an invalid port.' >&2
              exit 1
              ;;
          esac

          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<EOF
          model_provider = "local-hang"

          [model_providers.local-hang]
          name = "Local hanging Responses probe"
          base_url = "http://127.0.0.1:${port}/v1"
          wire_api = "responses"
          requires_openai_auth = false
          request_max_retries = 0
          stream_max_retries = 0
          stream_idle_timeout_ms = 120000
          EOF
          chmod 755 "$CODEX_HOME"
          chmod 644 "$CODEX_HOME/config.toml"

          cat > "$RUNNER_TEMP/codex-systemd-probe-prompt.txt" <<'PROMPT'
          Reply with OK only. Do not inspect or modify files.
          PROMPT
          chmod 644 "$RUNNER_TEMP/codex-systemd-probe-prompt.txt"

          cat > "$RUNNER_TEMP/run-native-codex-probe.sh" <<'CODEX_RUN'
          #!/bin/sh
          set -eu

          marker_prefix="$RUNNER_TEMP/codex-systemd-$PROBE_MODE"
          start_time="$(awk '{print $22}' /proc/$$/stat)"
          printf '%s %s\n' "$$" "$start_time" > "${marker_prefix}-codex-identity"
          cat /proc/$$/cgroup > "${marker_prefix}-codex-cgroup"

          awk '
            /^(Uid|Gid|Groups|NoNewPrivs|CapInh|CapPrm|CapEff|CapBnd|CapAmb):/ {
              key=$1
              sub(/:$/, "", key)
              $1=""
              sub(/^[[:space:]]+/, "")
              print key "=" $0
            }
          ' /proc/$$/status > "${marker_prefix}-security-status"

          exec env \
            -u CODEX_MANAGED_BY_BUN \
            -u CODEX_MANAGED_BY_PNPM \
            -u CODEX_MANAGED_BY_VITE_PLUS \
            CODEX_MANAGED_PACKAGE_ROOT="$CODEX_PACKAGE_ROOT" \
            CODEX_MANAGED_BY_NPM=1 \
            CODEX_HOME="$CODEX_HOME" \
            CODEX_INTERNAL_ORIGINATOR_OVERRIDE=codex_github_action \
            "$CODEX_NATIVE" exec \
              --skip-git-repo-check \
              --cd "$RUNNER_TEMP" \
              --model gpt-5.6-terra \
              --config 'default_permissions=":workspace"' \
              < "$CODEX_PROMPT_FILE"
          CODEX_RUN
          chmod 700 "$RUNNER_TEMP/run-native-codex-probe.sh"

          test -x "$CODEX_NATIVE"
          test -f "$ACTION_MAIN"
          test "$(git hash-object "$ACTION_MAIN")" = ce4e94e119abb91b980d23bfb4210688241f3a0a
          test -s "$CODEX_HOME/config.toml"

          uid="$(id -u)"
          gid="$(id -g)"
          groups_json="$(id -G | tr ' ' '\n' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
          current_credentials="$(jq -cn \
            --argjson uid "$uid" \
            --argjson gid "$gid" \
            --argjson groups "$groups_json" \
            '{userId:$uid,primaryGroupId:$gid,supplementaryGroupIds:$groups}')"
          test "$current_credentials" = "$RUNNER_CREDENTIALS"
          test "$uid" -ne 0

          nobody_gid="$(id -g nobody)"
          case "$nobody_gid" in
            ''|*[!0-9]*|0)
              echo 'Could not resolve a safe nobody gid.' >&2
              exit 1
              ;;
          esac

          runner_user="$(id -un)"
          runner_home="$HOME"
          runner_path="$PATH"

          printf '%s\n' "$(date +%s%N)" > "${marker_prefix}-prepare-return"

      - name: Bootstrap actual Codex cgroup probe
        id: probe-bootstrap
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        env:
          PROBE_MODE: ${{ matrix.mode }}
          CODEX_HOME: ${{ runner.temp }}/codex-probe-home
          CODEX_NATIVE: ${{ steps.runtime.outputs.native_path }}
          CODEX_PACKAGE_ROOT: ${{ steps.runtime.outputs.package_root }}
          ACTION_MAIN: ${{ steps.runtime.outputs.action_main }}
          RUNNER_CREDENTIALS: ${{ steps.runtime.outputs.runner_credentials }}
        run: |
          set -euo pipefail
          test "$PROBE_MODE" = poll
          marker_prefix="$RUNNER_TEMP/codex-systemd-$PROBE_MODE"
          test -s "${marker_prefix}-prepare-return"
          test -s "${marker_prefix}-unit"
          unit="$(cat "${marker_prefix}-unit")"
          test -s "$CODEX_HOME/config.toml"
          test -x "$CODEX_NATIVE"
          test -f "$ACTION_MAIN"
          test "$(git hash-object "$ACTION_MAIN")" = ce4e94e119abb91b980d23bfb4210688241f3a0a

          uid="$(id -u)"
          gid="$(id -g)"
          groups_json="$(id -G | tr ' ' '\n' | jq -Rsc 'split("\n") | map(select(length > 0) | tonumber)')"
          current_credentials="$(jq -cn \
            --argjson uid "$uid" \
            --argjson gid "$gid" \
            --argjson groups "$groups_json" \
            '{userId:$uid,primaryGroupId:$gid,supplementaryGroupIds:$groups}')"
          test "$current_credentials" = "$RUNNER_CREDENTIALS"
          test "$uid" -ne 0

          nobody_gid="$(id -g nobody)"
          case "$nobody_gid" in
            ''|*[!0-9]*|0)
              echo 'Could not resolve a safe nobody gid.' >&2
              exit 1
              ;;
          esac
          runner_user="$(id -un)"
          runner_home="$HOME"
          runner_path="$PATH"

          sudo -n -- \
            env -u ENV -u BASH_ENV -u SHELLOPTS \
            /usr/bin/timeout --signal=TERM --kill-after=5s 30s \
            /bin/bash -c '
              set -euo pipefail

              action_main="$1"
              runner_user="$2"
              uid="$3"
              nobody_gid="$4"
              runner_home="$5"
              runner_path="$6"
              runner_temp="$7"
              node="$8"
              credentials="$9"
              unit="${10}"
              launcher="${11}"
              codex_home="${12}"
              codex_native="${13}"
              codex_package_root="${14}"
              prompt_file="${15}"
              probe_mode="${16}"
              marker_prefix="${17}"

              /usr/bin/env -u NODE_OPTIONS "$node" "$action_main" \
                drop-sudo \
                --root-phase \
                --user "$runner_user" \
                --group sudo \
                --runner-credentials "$credentials"

              systemd_cmd=(
                /usr/bin/systemd-run
                --quiet
                --unit="$unit"
                --property=Type=exec
                --property=RuntimeMaxSec=700s
                --property=TimeoutStopSec=5s
                --property=KillMode=control-group
                --property=SendSIGKILL=yes
              )
              payload=(
                /usr/bin/setpriv
                --reuid="$uid"
                --regid="$nobody_gid"
                --clear-groups
                --no-new-privs
                --bounding-set=-all
                --inh-caps=-all
                --ambient-caps=-all
                --
                /usr/bin/env
                -i
                "HOME=$runner_home"
                "USER=$runner_user"
                "LOGNAME=$runner_user"
                "PATH=$runner_path"
                "RUNNER_TEMP=$runner_temp"
                "PROBE_MODE=$probe_mode"
                "CODEX_HOME=$codex_home"
                "CODEX_NATIVE=$codex_native"
                "CODEX_PACKAGE_ROOT=$codex_package_root"
                "CODEX_PROMPT_FILE=$prompt_file"
                /bin/sh "$launcher"
              )

              printf "%s\n" "$(date +%s%N)" > "${marker_prefix}-no-block-before"
              "${systemd_cmd[@]}" --no-block "${payload[@]}"
              printf "%s\n" "$(date +%s%N)" > "${marker_prefix}-no-block-return"

              /usr/bin/systemd-run \
                --quiet \
                --unit="${unit}-watchdog" \
                --on-active=755s \
                /usr/bin/systemctl kill --kill-whom=all --signal=KILL "$unit"
              printf "%s\n" "$(date +%s%N)" > "${marker_prefix}-watchdog-armed"
              exit 0
            ' codex-systemd-probe \
            "$ACTION_MAIN" \
            "$runner_user" \
            "$uid" \
            "$nobody_gid" \
            "$runner_home" \
            "$runner_path" \
            "$RUNNER_TEMP" \
            "$(command -v node)" \
            "$RUNNER_CREDENTIALS" \
            "$unit" \
            "$RUNNER_TEMP/run-native-codex-probe.sh" \
            "$CODEX_HOME" \
            "$CODEX_NATIVE" \
            "$CODEX_PACKAGE_ROOT" \
            "$RUNNER_TEMP/codex-systemd-probe-prompt.txt" \
            "$PROBE_MODE" \
            "$marker_prefix"

          test -s "${marker_prefix}-no-block-return"
          test -s "${marker_prefix}-watchdog-armed"
          printf '%s\n' "$(date +%s%N)" > "${marker_prefix}-bootstrap-return"

      - name: Observe actual Codex cgroup probe
        id: probe
        if: steps.probe-bootstrap.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 14
        shell: bash
        env:
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          test "$PROBE_MODE" = poll
          marker_prefix="$RUNNER_TEMP/codex-systemd-$PROBE_MODE"
          test -s "${marker_prefix}-prepare-return"
          test -s "${marker_prefix}-bootstrap-return"
          test -s "${marker_prefix}-unit"
          unit="$(cat "${marker_prefix}-unit")"

          # Observe only the recorded Codex PID as the normal runner user.
          # Avoid systemctl/D-Bus and their completion pipes in this phase.

          deadline=$(( $(date +%s) + 740 ))
          startup_deadline=$(( $(date +%s) + 60 ))
          poll_iteration=0
          printf 'PROBE_TRACE observer-start epoch=%s deadline=%s unit=%q\n' \
            "$(date +%s)" "$deadline" "$unit"

          while [ ! -s "${marker_prefix}-request" ] || [ ! -s "${marker_prefix}-codex-identity" ]; do
            if [ "$(date +%s)" -ge "$startup_deadline" ]; then
              printf '%s\n' "$(date +%s%N)" > "${marker_prefix}-poll-startup-failure"
              printf 'PROBE_TRACE startup-failure epoch=%s request=%s identity=%s\n' \
                "$(date +%s)" \
                "$([ -s "${marker_prefix}-request" ] && printf present || printf missing)" \
                "$([ -s "${marker_prefix}-codex-identity" ] && printf present || printf missing)"
              exit 1
            fi
            sleep 1
          done

          read -r poll_codex_pid poll_codex_start < "${marker_prefix}-codex-identity"
          case "$poll_codex_pid:$poll_codex_start" in
            *[!0-9:]*|:*|*:)
              echo 'Invalid Codex PID identity marker.' >&2
              exit 1
              ;;
          esac

          printf 'PROBE_TRACE sleep-before epoch=%s seconds=710\n' "$(date +%s)"
          /bin/sleep 710
          printf 'PROBE_TRACE sleep-after epoch=%s\n' "$(date +%s)"

          poll_iteration=1
          poll_codex_alive=false
          if [ -r "/proc/$poll_codex_pid/stat" ] && \
            [ "$(awk '{print $22}' "/proc/$poll_codex_pid/stat")" = "$poll_codex_start" ]; then
            poll_codex_alive=true
          fi
          printf 'CodexPID=%s\nCodexAlive=%s\nObservation=proc-after-sleep\n' \
            "$poll_codex_pid" "$poll_codex_alive" > "${marker_prefix}-poll-last-state"

          if [ "$poll_codex_alive" = false ]; then
            cp "${marker_prefix}-poll-last-state" "${marker_prefix}-poll-terminal-state"
            printf "%s\n" "$(date +%s%N)" > "${marker_prefix}-poll-return"
            printf "%s\n" false > "${marker_prefix}-codex-alive-at-poll-terminal"
          else
            cp "${marker_prefix}-poll-last-state" "${marker_prefix}-poll-deadline-state"
            printf "%s\n" "$(date +%s%N)" > "${marker_prefix}-poll-deadline"
            printf "%s\n" true > "${marker_prefix}-codex-alive-at-poll-deadline"
            kill -KILL "$poll_codex_pid" 2>/dev/null || true
            printf "%s\n" "$(date +%s%N)" > "${marker_prefix}-poll-cleanup-issued"
          fi
          printf 'PROBE_TRACE observer-return epoch=%s iteration=%s\n' \
            "$(date +%s)" "$poll_iteration"

      - name: Diagnose actual Codex cgroup probe
        if: always()
        shell: bash
        env:
          PROBE_MODE: ${{ matrix.mode }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PROBE_CONCLUSION: ${{ steps.probe.conclusion }}
        run: |
          set -euo pipefail

          marker_prefix="$RUNNER_TEMP/codex-systemd-$PROBE_MODE"
          printf 'PROBE_TRACE diagnose-start epoch=%s outcome=%s conclusion=%s\n' \
            "$(date +%s)" "$PROBE_OUTCOME" "$PROBE_CONCLUSION"
          for suffix in \
            prepare-return bootstrap-return no-block-return watchdog-armed \
            request codex-identity codex-cgroup security-status poll-last-state \
            poll-last-show-status poll-return poll-terminal-state poll-deadline \
            poll-deadline-state poll-cleanup-issued
          do
            if [ -e "${marker_prefix}-${suffix}" ]; then
              printf 'PROBE_TRACE marker-present=%s\n' "$suffix"
            else
              printf 'PROBE_TRACE marker-missing=%s\n' "$suffix"
            fi
          done
          if [ -s "${marker_prefix}-poll-last-state" ]; then
            printf 'PROBE_TRACE last-state=%q\n' \
              "$(tr '\n' ';' < "${marker_prefix}-poll-last-state")"
          fi
          if [ -s "${marker_prefix}-server.stderr" ]; then
            printf 'PROBE_TRACE server-stderr-present=true\n'
          fi
          test -s "${marker_prefix}-start"
          test -s "${marker_prefix}-unit"
          test -s "${marker_prefix}-request"
          test -s "${marker_prefix}-codex-identity"
          test -s "${marker_prefix}-codex-cgroup"
          test -s "${marker_prefix}-security-status"

          request_path="$(sed -n 's/^path=//p' "${marker_prefix}-request")"
          request_length="$(sed -n 's/^content_length=//p' "${marker_prefix}-request")"
          test "$request_path" = /v1/responses
          case "$request_length" in
            ''|*[!0-9]*|0)
              echo 'Codex request marker has an invalid body length.' >&2
              exit 1
              ;;
          esac

          alive_same() {
            local file="$1"
            local pid start_time current
            read -r pid start_time < "$file"
            [ -r "/proc/$pid/stat" ] || return 1
            current="$(awk '{print $22}' "/proc/$pid/stat")"
            [ "$current" = "$start_time" ]
          }

          codex_alive=false
          alive_same "${marker_prefix}-codex-identity" && codex_alive=true

          no_new_privs="$(sed -n 's/^NoNewPrivs=//p' "${marker_prefix}-security-status")"
          groups_status="$(sed -n 's/^Groups=//p' "${marker_prefix}-security-status")"
          cap_bnd="$(sed -n 's/^CapBnd=//p' "${marker_prefix}-security-status")"
          codex_cgroup="$(tr '\n' ';' < "${marker_prefix}-codex-cgroup")"
          unit="$(cat "${marker_prefix}-unit")"

          sudo_available=true
          if ! sudo -n true 2>/dev/null; then
            sudo_available=false
          fi

          waiter_return=false
          [ -s "${marker_prefix}-waiter-return" ] && waiter_return=true
          waiter_stuck=unknown
          [ -s "${marker_prefix}-waiter-stuck" ] && waiter_stuck="$(cat "${marker_prefix}-waiter-stuck")"
          waiter_kill_sent=false
          [ -s "${marker_prefix}-waiter-kill-sent" ] && waiter_kill_sent=true
          waiter_alive_after_kill=missing
          [ -s "${marker_prefix}-waiter-alive-after-kill" ] && waiter_alive_after_kill="$(cat "${marker_prefix}-waiter-alive-after-kill")"

          codex_alive_at_waiter_return=missing
          [ -s "${marker_prefix}-codex-alive-at-waiter-return" ] && codex_alive_at_waiter_return="$(cat "${marker_prefix}-codex-alive-at-waiter-return")"
          codex_alive_at_terminal=missing
          [ -s "${marker_prefix}-codex-alive-at-terminal" ] && codex_alive_at_terminal="$(cat "${marker_prefix}-codex-alive-at-terminal")"
          codex_alive_at_deadline=missing
          [ -s "${marker_prefix}-codex-alive-at-deadline" ] && codex_alive_at_deadline="$(cat "${marker_prefix}-codex-alive-at-deadline")"

          observer_terminal=false
          [ -s "${marker_prefix}-observer-terminal" ] && observer_terminal=true
          observer_deadline=false
          [ -s "${marker_prefix}-observer-deadline" ] && observer_deadline=true
          poll_return=false
          [ -s "${marker_prefix}-poll-return" ] && poll_return=true
          poll_deadline=false
          [ -s "${marker_prefix}-poll-deadline" ] && poll_deadline=true
          codex_alive_at_poll_terminal=missing
          [ -s "${marker_prefix}-codex-alive-at-poll-terminal" ] && codex_alive_at_poll_terminal="$(cat "${marker_prefix}-codex-alive-at-poll-terminal")"
          codex_alive_at_poll_deadline=missing
          [ -s "${marker_prefix}-codex-alive-at-poll-deadline" ] && codex_alive_at_poll_deadline="$(cat "${marker_prefix}-codex-alive-at-poll-deadline")"

          elapsed_ns="$(( $(date +%s%N) - $(cat "${marker_prefix}-start") ))"
          elapsed_ms="$(( elapsed_ns / 1000000 ))"

          systemd_status=missing
          if [ -s "${marker_prefix}-systemd-run-status" ]; then
            systemd_status="$(cat "${marker_prefix}-systemd-run-status")"
          fi

          terminal_state=missing
          if [ -s "${marker_prefix}-observer-terminal-state" ]; then
            terminal_state="$(tr '\n' ';' < "${marker_prefix}-observer-terminal-state")"
          elif [ -s "${marker_prefix}-observer-deadline-state" ]; then
            terminal_state="$(tr '\n' ';' < "${marker_prefix}-observer-deadline-state")"
          elif [ -s "${marker_prefix}-poll-terminal-state" ]; then
            terminal_state="$(tr '\n' ';' < "${marker_prefix}-poll-terminal-state")"
          elif [ -s "${marker_prefix}-poll-deadline-state" ]; then
            terminal_state="$(tr '\n' ';' < "${marker_prefix}-poll-deadline-state")"
          fi

          printf 'PROBE_DATA codex-systemd mode=%s outcome=%s conclusion=%s elapsed_ms=%s request_path=%q request_length=%s codex_alive=%s codex_alive_at_waiter_return=%s codex_alive_at_terminal=%s codex_alive_at_deadline=%s waiter_return=%s waiter_stuck=%s waiter_kill_sent=%s waiter_alive_after_kill=%s observer_terminal=%s observer_deadline=%s poll_return=%s poll_deadline=%s codex_alive_at_poll_terminal=%s codex_alive_at_poll_deadline=%s systemd_status=%s sudo_available=%s no_new_privs=%s groups=%q cap_bnd=%s cgroup=%q terminal_state=%q\n' \
            "$PROBE_MODE" "$PROBE_OUTCOME" "$PROBE_CONCLUSION" "$elapsed_ms" \
            "$request_path" "$request_length" "$codex_alive" \
            "$codex_alive_at_waiter_return" "$codex_alive_at_terminal" "$codex_alive_at_deadline" \
            "$waiter_return" "$waiter_stuck" "$waiter_kill_sent" "$waiter_alive_after_kill" \
            "$observer_terminal" "$observer_deadline" "$poll_return" "$poll_deadline" \
            "$codex_alive_at_poll_terminal" "$codex_alive_at_poll_deadline" \
            "$systemd_status" "$sudo_available" "$no_new_privs" "$groups_status" \
            "$cap_bnd" "$codex_cgroup" "$terminal_state"

          test "$sudo_available" = false
          test "$no_new_privs" = 1
          test -z "$groups_status"
          test "$cap_bnd" = 0000000000000000
          case "$codex_cgroup" in
            *"/system.slice/${unit}.service"*) ;;
            *)
              echo "Codex was not observed in expected cgroup: $codex_cgroup" >&2
              exit 1
              ;;
          esac

          if [ "$PROBE_MODE" = wait ]; then
            test "$PROBE_OUTCOME" = success

            if [ "$waiter_return" = true ]; then
              test "$systemd_status" != missing
              test "$waiter_stuck" = false
              test "$codex_alive" = false
              test "$observer_deadline" = false
              test "$elapsed_ms" -ge 680000
              test "$elapsed_ms" -lt 770000
            elif [ "$observer_terminal" = true ]; then
              test "$waiter_stuck" = true
              test "$codex_alive" = false
              test "$observer_deadline" = false
              test "$elapsed_ms" -ge 680000
              test "$elapsed_ms" -lt 770000
            elif [ "$observer_deadline" = true ]; then
              test "$waiter_stuck" = true
              test "$waiter_kill_sent" = true
              test "$elapsed_ms" -ge 730000
              test "$elapsed_ms" -lt 780000
            else
              echo 'Observer produced no terminal, waiter-return, or deadline result.' >&2
              exit 1
            fi
          else
            if [ "$poll_return" = true ]; then
              test "$poll_deadline" = false
              test "$codex_alive_at_poll_terminal" = false
              test "$codex_alive" = false
              test "$elapsed_ms" -ge 680000
              test "$elapsed_ms" -lt 770000
              test -s "${marker_prefix}-poll-terminal-state"
            elif [ "$poll_deadline" = true ]; then
              test "$elapsed_ms" -ge 730000
              test "$elapsed_ms" -lt 780000
              test "$codex_alive_at_poll_deadline" != missing
              test -s "${marker_prefix}-poll-deadline-state"
            else
              echo 'Poll probe produced neither terminal nor deadline result.' >&2
              exit 1
            fi
          fi

      - name: Cleanup localhost probe server
        if: always()
        shell: bash
        env:
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          marker_prefix="$RUNNER_TEMP/codex-systemd-$PROBE_MODE"

          if [ -s "${marker_prefix}-server-pid" ]; then
            server_pid="$(cat "${marker_prefix}-server-pid")"
            case "$server_pid" in
              ''|*[!0-9]*) ;;
              *)
                kill "$server_pid" 2>/dev/null || true
                sleep 0.2
                kill -KILL "$server_pid" 2>/dev/null || true
                ;;
            esac
          fi

          if [ -s "${marker_prefix}-codex-identity" ]; then
            read -r codex_pid codex_start < "${marker_prefix}-codex-identity"
            if [ -r "/proc/$codex_pid/stat" ] && [ "$(awk '{print $22}' "/proc/$codex_pid/stat")" = "$codex_start" ]; then
              kill -KILL "$codex_pid" 2>/dev/null || true
            fi
          fi
