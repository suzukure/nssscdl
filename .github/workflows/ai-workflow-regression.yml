name: AI Workflow Regression

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '**/AGENTS.md'
      - '**/AGENTS.override.md'
      - '**/CLAUDE.md'
      - '**/CLAUDE.local.md'
      - '**/.claude/**'
      - '**/.codex/**'
      - '**/.mcp.json'
      - 'docs/00_requirements/01_Introduction.md'
      - 'docs/diagrams/README.md'
      - 'docs/30_operations/ai-development-workflow.md'

permissions:
  contents: read

concurrency:
  group: ai-workflow-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Shared bounded validator; workers and checkout-free terminal use the same contract.
env:
  EXECUTION_PLAN_VALIDATOR: |
    import base64
    import json
    import os
    from pathlib import Path
    import re
    import stat
    import subprocess
    import sys


    def unique_object(pairs):
        value = {}
        for key, item in pairs:
            if key in value:
                raise ValueError
            value[key] = item
        return value


    def fixture_path(path):
        if not isinstance(path, str):
            return False
        path.encode('utf-8', 'strict')
        prefix = '.github/scripts/test-'
        return (path.startswith(prefix) and path.endswith('.sh')
                and len(path) > len(prefix) + 3
                and '/' not in path[len(prefix):] and '\\' not in path and '\0' not in path)


    def paths(value):
        if (not isinstance(value, list) or not value
                or not all(fixture_path(p) for p in value) or value != sorted(set(value))):
            raise ValueError
        return value


    try:
        role = os.environ['SHARD_ID']
        producer = os.environ['PRODUCER_RESULT']
        if role == 'terminal' and producer != 'success':
            # The producer keeps failure ownership; do not create a second failure.
            print('producerが非successのため、元jobのfailure ownershipを維持します。')
            sys.exit(0)
        if producer != 'success' or role not in ('1', '2', 'terminal'):
            raise ValueError
        encoded = os.environ['EXECUTION_PLAN_B64']
        if (not encoded or len(encoded) > 256 * 1024
                or not re.fullmatch('[A-Za-z0-9+/]+={0,2}', encoded)):
            raise ValueError
        decoded = base64.b64decode(encoded, validate=True)
        if base64.b64encode(decoded).decode('ascii') != encoded:
            raise ValueError
        plan = json.loads(decoded.decode('utf-8', 'strict'), object_pairs_hook=unique_object)
        suites = {'common', 'product-npm', 'resume-human-pause', 'claude',
                  'deepinfra', 'ai-developer-codex', 'failure-evidence'}
        full_reasons = {'inventory_unavailable', 'inventory_mismatch', 'malformed_input',
                        'empty_selection', 'global_boundary', 'unmapped_path',
                        'mapping_conflict', 'selector_error', 'sha_invalid', 'head_mismatch',
                        'base_unavailable', 'merge_base_failed', 'diff_failed', 'empty_diff',
                        'base_selector_unavailable', 'selector_failed',
                        'selector_record_invalid', 'common_guard_missing'}
        if (not isinstance(plan, dict)
                or set(plan) != {'schema', 'version', 'base_sha', 'head_sha', 'mode',
                                 'reason', 'suites', 'full_count', 'execution_count', 'fixtures', 'shards'}
                or plan['schema'] != 'ai-workflow-regression-execution-plan'
                or type(plan['version']) is not int or plan['version'] != 1
                or not all(isinstance(plan[k], str) and re.fullmatch('[0-9a-f]{40}', plan[k])
                           for k in ('base_sha', 'head_sha'))
                or plan['mode'] not in ('selected', 'full')
                or not isinstance(plan['reason'], str)
                or not isinstance(plan['suites'], list)
                or not all(isinstance(s, str) and s in suites for s in plan['suites'])
                or plan['suites'] != sorted(set(plan['suites']))
                or any(type(plan[k]) is not int or plan[k] <= 0
                       for k in ('full_count', 'execution_count'))
                or plan['execution_count'] > plan['full_count']
                or not isinstance(plan['shards'], list)):
            raise ValueError
        fixtures = paths(plan['fixtures'])
        if len(fixtures) != plan['execution_count']:
            raise ValueError
        if plan['mode'] == 'selected':
            if (plan['reason'] != 'known_paths' or 'common' not in plan['suites']
                    or plan['shards'] != []
                    or '.github/scripts/test-production-unreachable.sh' not in fixtures):
                raise ValueError
        else:
            if (plan['reason'] not in full_reasons or len(plan['shards']) != 2
                    or plan['full_count'] != len(fixtures)):
                raise ValueError
            assigned = []
            for index, shard in enumerate(plan['shards'], 1):
                if (not isinstance(shard, dict) or set(shard) != {'id', 'fixtures'}
                        or type(shard['id']) is not int or shard['id'] != index):
                    raise ValueError
                assigned.extend(paths(shard['fixtures']))
            if len(assigned) != len(set(assigned)) or sorted(assigned) != fixtures:
                raise ValueError
        if decoded != json.dumps(plan, sort_keys=True, ensure_ascii=True,
                                 separators=(',', ':'), allow_nan=False).encode('utf-8', 'strict'):
            raise ValueError
        if role == 'terminal':
            if os.environ['ROUTING_MODE'] != plan['mode']:
                raise ValueError
            results = [os.environ['SHARD_1_RESULT'], os.environ['SHARD_2_RESULT']]
            if results != (['success', 'success'] if plan['mode'] == 'full' else ['skipped', 'skipped']):
                raise ValueError
            print('Regression結果: PASS')
        else:
            if plan['mode'] != 'full':
                raise ValueError
            current_head = subprocess.run(['git', 'rev-parse', 'HEAD'], check=True,
                                          capture_output=True).stdout.decode('ascii').strip()
            if current_head != plan['head_sha']:
                raise ValueError
            if not all(stat.S_ISDIR(Path(p).lstat().st_mode) for p in ('.github', '.github/scripts')):
                raise ValueError
            inventory = sorted(p.as_posix() for p in Path('.github/scripts').glob('test-*.sh'))
            paths(inventory)
            if (inventory != fixtures or len(inventory) != plan['full_count']
                    or not all(stat.S_ISREG(Path(p).lstat().st_mode) for p in inventory)):
                raise ValueError
            chosen = plan['shards'][int(role) - 1]['fixtures']
            Path(os.environ['FIXTURE_LIST']).write_bytes(b''.join(p.encode('utf-8') + b'\0' for p in chosen))
    except Exception:
        print('execution planまたはshard結果の再検証に失敗しました。', file=sys.stderr)
        sys.exit(1)

jobs:
  fixtures:
    name: Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execution_plan_b64: ${{ steps.fixtures.outputs.execution_plan_b64 }}
      routing_mode: ${{ steps.fixtures.outputs.routing_mode }}
    steps:
      - name: Check out pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Run AI workflow fixtures
        id: fixtures
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          shopt -s nullglob
          fixtures=(.github/scripts/test-*.sh)
          regression_tmp="$(mktemp -d)"
          trap 'rm -rf "$regression_tmp"' EXIT
          python3 -B - "$regression_tmp" "${fixtures[@]}" <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import subprocess
          import sys

          scratch = Path(sys.argv[1])
          root = Path.cwd()
          prefix = '.github/scripts/'
          suite_names = {'common', 'product-npm', 'resume-human-pause', 'claude',
                         'deepinfra', 'ai-developer-codex', 'failure-evidence'}
          full_reasons = {'inventory_unavailable', 'inventory_mismatch', 'malformed_input',
                          'empty_selection', 'global_boundary', 'unmapped_path',
                          'mapping_conflict', 'selector_error'}
          fallback_reasons = {'sha_invalid', 'head_mismatch', 'base_unavailable',
                              'merge_base_failed', 'diff_failed', 'empty_diff',
                              'base_selector_unavailable', 'selector_failed',
                              'selector_record_invalid', 'common_guard_missing'}
          # Producer budget for the Base64 value, excluding key and final LF.
          execution_plan_limit = 256 * 1024
          mode, reason, suites = 'full', 'selection_unavailable', sorted(suite_names)
          actual, chosen = [], []
          base_validated = False


          def summary(result=None):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
                  output.write('## AI Workflow Regression\n\n')
                  for label, value in [('mode', mode), ('reason', reason),
                                       ('selected count', len(chosen)), ('full count', len(actual)),
                                       ('suites', ', '.join(suites))]:
                      output.write(f'- {label}: {value}\n')
                  if result:
                      output.write(f'\n結果: **{result}**\n')


          def git(*args):
              return subprocess.run(['git', *args], check=True, capture_output=True).stdout


          def fixture_path(value):
              if isinstance(value, str):
                  try:
                      value.encode('utf-8', 'strict')
                  except UnicodeError:
                      return False
              return (isinstance(value, str) and '\0' not in value and '\\' not in value
                      and value.startswith(prefix + 'test-') and value.endswith('.sh')
                      and '/' not in value[len(prefix):])


          def unique_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError
                  value[key] = item
              return value


          try:
              # Enumerate independently of selector output, including invalid file types.
              actual = sorted(sys.argv[2:])
              if not actual:
                  reason = 'no_fixtures'
                  raise RuntimeError
              if (not stat.S_ISDIR((root / '.github').lstat().st_mode)
                      or not stat.S_ISDIR((root / prefix).lstat().st_mode)
                      or not all(fixture_path(p) and stat.S_ISREG((root / p).lstat().st_mode)
                                 for p in actual)):
                  reason = 'invalid_fixture_type'
                  raise RuntimeError
              chosen = actual
              try:
                  base, head = os.environ.get('BASE_SHA', ''), os.environ.get('HEAD_SHA', '')
                  reason = 'sha_invalid'
                  if not all(re.fullmatch('[0-9a-f]{40}', sha) for sha in (base, head)):
                      raise ValueError
                  reason = 'head_mismatch'
                  if git('rev-parse', 'HEAD').decode('ascii').strip() != head:
                      raise ValueError
                  reason = 'base_unavailable'
                  if git('rev-parse', '--verify', base + '^{commit}').decode('ascii').strip() != base:
                      raise ValueError
                  base_validated = True
                  reason = 'merge_base_failed'
                  merge_base = git('merge-base', base, head).decode('ascii').strip()
                  if not re.fullmatch('[0-9a-f]{40}', merge_base):
                      raise ValueError
                  reason = 'diff_failed'
                  changed = git('diff', '--no-renames', '--name-only', '-z', merge_base, head)
                  reason = 'empty_diff'
                  if not changed:
                      raise ValueError
                  reason = 'base_selector_unavailable'
                  selector = scratch / 'trusted-selector.py'
                  selector.write_bytes(git('show', base + ':' + prefix + 'select-ai-workflow-fixtures.py'))
                  reason = 'selector_failed'
                  result = subprocess.run([sys.executable, '-B', str(selector), '--repo-root', str(root)],
                                          input=changed, capture_output=True, check=True)
                  reason = 'selector_record_invalid'
                  record = json.loads(result.stdout, object_pairs_hook=unique_object)
                  if (not isinstance(record, dict)
                          or set(record) != {'schema', 'version', 'mode', 'reason', 'suites', 'fixtures'}
                          or record['schema'] != 'ai-workflow-fixture-selection'
                          or type(record['version']) is not int or record['version'] != 1
                          or record['mode'] not in ('selected', 'full')
                          or not isinstance(record['reason'], str)
                          or not isinstance(record['suites'], list)
                          or not all(isinstance(s, str) and s in suite_names for s in record['suites'])
                          or len(set(record['suites'])) != len(record['suites'])
                          or not isinstance(record['fixtures'], list)
                          or not all(fixture_path(p) for p in record['fixtures'])
                          or len(set(record['fixtures'])) != len(record['fixtures'])):
                      raise ValueError
                  if record['mode'] == 'selected':
                      if record['reason'] != 'known_paths' or 'common' not in record['suites']:
                          raise ValueError
                      if not record['fixtures']:
                          reason = 'no_fixtures'
                          raise RuntimeError
                      if not set(record['fixtures']) <= set(actual):
                          reason = 'selected_fixture_missing'
                          raise RuntimeError
                      if prefix + 'test-production-unreachable.sh' not in record['fixtures']:
                          reason = 'common_guard_missing'
                          raise ValueError
                      chosen = sorted(record['fixtures'])
                  elif record['reason'] not in full_reasons:
                      raise ValueError
                  mode, reason, suites = record['mode'], record['reason'], sorted(record['suites'])
              except (ValueError, OSError, UnicodeError, subprocess.SubprocessError):
                  # Keep the independently discovered full inventory on any selection error.
                  mode, suites, chosen = 'full', sorted(suite_names), actual
              if mode == 'full':
                  # Trusted-base planning; full execution belongs to parallel workers.
                  selection_reason = reason
                  reason = 'planner_base_invalid'
                  base = os.environ.get('BASE_SHA', '')
                  if not re.fullmatch('[0-9a-f]{40}', base):
                      raise ValueError
                  reason = 'planner_base_unavailable'
                  if (not base_validated
                          and git('rev-parse', '--verify', base + '^{commit}').decode('ascii').strip() != base):
                      raise ValueError
                  reason = 'base_planner_unavailable'
                  planner = scratch / 'trusted-planner.py'
                  planner.write_bytes(git('show', base + ':' + prefix + 'plan-ai-workflow-shards.py'))
                  reason = 'planner_failed'
                  result = subprocess.run([sys.executable, '-B', str(planner)],
                                          input=b''.join(p.encode('utf-8') + b'\0' for p in actual),
                                          capture_output=True, check=True)
                  reason = 'planner_record_invalid'
                  plan = json.loads(result.stdout, object_pairs_hook=unique_object)
                  if (not isinstance(plan, dict)
                          or set(plan) != {'schema', 'version', 'policy', 'shard_count', 'shards'}
                          or plan['schema'] != 'ai-workflow-shard-plan'
                          or type(plan['version']) is not int or plan['version'] != 1
                          or plan['policy'] != 'observed-lpt-v1'
                          or type(plan['shard_count']) is not int or plan['shard_count'] != 2
                          or not isinstance(plan['shards'], list) or len(plan['shards']) != 2):
                      raise ValueError
                  ids, assigned = [], []
                  for shard in plan['shards']:
                      if (not isinstance(shard, dict) or set(shard) != {'id', 'fixtures'}
                              or type(shard['id']) is not int or shard['id'] not in (1, 2)
                              or not isinstance(shard['fixtures'], list) or not shard['fixtures']
                              or not all(fixture_path(p) and len(p) > len(prefix + 'test-') + 3
                                         for p in shard['fixtures'])):
                          raise ValueError
                      for path in shard['fixtures']:
                          path.encode('utf-8', 'strict')
                      ids.append(shard['id'])
                      assigned.extend(shard['fixtures'])
                  if (sorted(ids) != [1, 2] or len(assigned) != len(set(assigned))
                          or len(assigned) != len(actual) or set(assigned) != set(actual)):
                      raise ValueError
                  reason = selection_reason
              # Selected execution retains its local list; full is handed off only
              # after plan validation. Routing never grants execution authority.
              execution_reason = reason
              reason = 'execution_plan_invalid'
              current_head = git('rev-parse', 'HEAD').decode('ascii').strip()
              if (mode not in ('selected', 'full')
                      or not all(re.fullmatch('[0-9a-f]{40}', sha) for sha in (base, current_head))
                      or suites != sorted(set(suites)) or not set(suites) <= suite_names
                      or not chosen or chosen != sorted(set(chosen))
                      or not all(fixture_path(p) for p in chosen)
                      or not set(chosen) <= set(actual)
                      or (mode == 'selected' and execution_reason != 'known_paths')
                      or (mode == 'full' and (chosen != actual
                          or execution_reason not in full_reasons | fallback_reasons))):
                  raise ValueError
              shards = ([] if mode == 'selected' else
                        [dict(id=s['id'], fixtures=sorted(s['fixtures']))
                         for s in sorted(plan['shards'], key=lambda s: s['id'])])
              execution_plan = dict(schema='ai-workflow-regression-execution-plan', version=1,
                                    base_sha=base, head_sha=current_head, mode=mode,
                                    reason=execution_reason, suites=suites,
                                    full_count=len(actual), execution_count=len(chosen),
                                    fixtures=chosen, shards=shards)
              canonical = json.dumps(execution_plan, sort_keys=True, ensure_ascii=True,
                                     separators=(',', ':'), allow_nan=False).encode('utf-8', 'strict')
              encoded_plan = base64.b64encode(canonical).decode('ascii', 'strict')
              reason = 'execution_plan_output_invalid'
              if (not encoded_plan or len(encoded_plan) > execution_plan_limit
                      or not re.fullmatch('[A-Za-z0-9+/]+={0,2}', encoded_plan)):
                  raise ValueError
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='ascii', newline='\n') as output:
                  output.write('execution_plan_b64=' + encoded_plan + '\n')
                  output.write('routing_mode=' + mode + '\n')
              reason = execution_reason
              (scratch / 'fixtures.nul').write_bytes(b''.join(os.fsencode(p) + b'\0' for p in chosen))
              (scratch / 'mode').write_text(mode, encoding='ascii')
              summary('PASS' if mode == 'full' else None)
          except Exception:
              summary('FAIL')
              print('AI workflow fixtureの安全な実行集合を確定できませんでした。', file=sys.stderr)
              sys.exit(1)
          PY
          if [ "$(cat "$regression_tmp/mode")" = full ]; then
            exit 0
          fi
          mapfile -d '' -t fixtures < "$regression_tmp/fixtures.nul"
          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo '結果: **FAIL**（該当fixtureなし）' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          failed=0
          for fixture in "${fixtures[@]}"; do
            printf '::group::Fixture: %q\n' "$fixture"
            # Recheck immediately before execution, including changes by earlier fixtures.
            if [ ! -f "$fixture" ] || [ -L "$fixture" ]; then
              echo 'FAIL（不正fixture）'
              failed=1
              echo '::endgroup::'
              continue
            fi
            if bash "$fixture"; then
              echo 'PASS'
            else
              echo 'FAIL'
              failed=1
            fi
            echo '::endgroup::'
          done
          if [ "$failed" -ne 0 ]; then
            echo '結果: **FAIL**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '結果: **PASS**' >> "$GITHUB_STEP_SUMMARY"

  shard_1:
    name: Fixture shard 1
    needs: [fixtures]
    if: needs.fixtures.result == 'success' && needs.fixtures.outputs.routing_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Run shard fixtures
        shell: bash
        env:
          SHARD_ID: '1'
          PRODUCER_RESULT: ${{ needs.fixtures.result }}
          EXECUTION_PLAN_B64: ${{ needs.fixtures.outputs.execution_plan_b64 }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          regression_tmp="$(mktemp -d)"
          trap 'rm -rf "$regression_tmp"' EXIT
          export FIXTURE_LIST="$regression_tmp/fixtures.nul"
          python3 -B -c "$EXECUTION_PLAN_VALIDATOR"
          mapfile -d '' -t fixtures < "$FIXTURE_LIST"
          failed=0
          for fixture in "${fixtures[@]}"; do
            printf '::group::Fixture: %q\n' "$fixture"
            # Recheck immediately before execution, including changes by earlier fixtures.
            if [ ! -f "$fixture" ] || [ -L "$fixture" ]; then
              echo 'FAIL（不正fixture）'
              failed=1
              echo '::endgroup::'
              continue
            fi
            if bash "$fixture"; then
              echo 'PASS'
            else
              echo 'FAIL'
              failed=1
            fi
            echo '::endgroup::'
          done
          if [ "$failed" -ne 0 ]; then
            echo '結果: **FAIL**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '結果: **PASS**' >> "$GITHUB_STEP_SUMMARY"

  shard_2:
    name: Fixture shard 2
    needs: [fixtures]
    if: needs.fixtures.result == 'success' && needs.fixtures.outputs.routing_mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Run shard fixtures
        shell: bash
        env:
          SHARD_ID: '2'
          PRODUCER_RESULT: ${{ needs.fixtures.result }}
          EXECUTION_PLAN_B64: ${{ needs.fixtures.outputs.execution_plan_b64 }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          regression_tmp="$(mktemp -d)"
          trap 'rm -rf "$regression_tmp"' EXIT
          export FIXTURE_LIST="$regression_tmp/fixtures.nul"
          python3 -B -c "$EXECUTION_PLAN_VALIDATOR"
          mapfile -d '' -t fixtures < "$FIXTURE_LIST"
          failed=0
          for fixture in "${fixtures[@]}"; do
            printf '::group::Fixture: %q\n' "$fixture"
            # Recheck immediately before execution, including changes by earlier fixtures.
            if [ ! -f "$fixture" ] || [ -L "$fixture" ]; then
              echo 'FAIL（不正fixture）'
              failed=1
              echo '::endgroup::'
              continue
            fi
            if bash "$fixture"; then
              echo 'PASS'
            else
              echo 'FAIL'
              failed=1
            fi
            echo '::endgroup::'
          done
          if [ "$failed" -ne 0 ]; then
            echo '結果: **FAIL**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '結果: **PASS**' >> "$GITHUB_STEP_SUMMARY"

  regression_result:
    name: Regression Result
    needs: [fixtures, shard_1, shard_2]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Normalize shard results
        shell: bash
        env:
          SHARD_ID: terminal
          PRODUCER_RESULT: ${{ needs.fixtures.result }}
          EXECUTION_PLAN_B64: ${{ needs.fixtures.outputs.execution_plan_b64 }}
          ROUTING_MODE: ${{ needs.fixtures.outputs.routing_mode }}
          SHARD_1_RESULT: ${{ needs.shard_1.result }}
          SHARD_2_RESULT: ${{ needs.shard_2.result }}
        run: |
          set -euo pipefail
          python3 -B -c "$EXECUTION_PLAN_VALIDATOR"
