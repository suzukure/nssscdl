name: AI Workflow Regression

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ai-workflow-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run AI workflow fixtures
        shell: bash
        run: |
          set -u -o pipefail
          export LC_ALL=C
          shopt -s nullglob
          fixtures=(.github/scripts/test-*.sh)

          if [ "${#fixtures[@]}" -eq 0 ]; then
            echo 'No AI workflow fixtures matched .github/scripts/test-*.sh.' >&2
            {
              echo '## AI Workflow Regression'
              echo
              echo 'Result: **FAIL** (no matching fixtures)'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          failed=0
          {
            echo '## AI Workflow Regression'
            echo
            echo '| Fixture | Result |'
            echo '| --- | --- |'
          } >> "$GITHUB_STEP_SUMMARY"

          for fixture in "${fixtures[@]}"; do
            echo "::group::Fixture: $fixture"
            if bash "$fixture"; then
              result='PASS'
            else
              result='FAIL'
              failed=1
            fi
            echo '::endgroup::'
            printf '| `%s` | %s |\n' "$fixture" "$result" >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$failed" -ne 0 ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Result: **FAIL**' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo >> "$GITHUB_STEP_SUMMARY"
          echo 'Result: **PASS**' >> "$GITHUB_STEP_SUMMARY"


  background-cancel-probe:
    name: Background Cancel Probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Configure probe paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PROBE_MARKER=$RUNNER_TEMP/background-cancel-probe.marker"
            echo "PROBE_PID=$RUNNER_TEMP/background-cancel-probe.pid"
            echo "PROBE_DONE=$RUNNER_TEMP/background-cancel-probe.done"
          } >> "$GITHUB_ENV"

      - name: Start composite probe
        id: probe
        uses: ./.github/actions/background-cancel-probe
        background: true

      - name: Verify marker and running process
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            if [ -s "$PROBE_MARKER" ] && [ -s "$PROBE_PID" ]; then
              test "$(cat "$PROBE_MARKER")" = ready
              pid="$(cat "$PROBE_PID")"
              kill -0 "$pid"
              test ! -e "$PROBE_DONE"
              exit 0
            fi
            sleep 1
          done
          echo 'Background composite action did not publish observable running state.' >&2
          exit 1

      - name: Stop composite probe
        cancel: probe

      - name: Verify termination and continuation after cancel
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PROBE_MARKER"
          test "$(cat "$PROBE_MARKER")" = ready
          test -s "$PROBE_PID"
          pid="$(cat "$PROBE_PID")"
          for _ in {1..30}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              test ! -e "$PROBE_DONE"
              exit 0
            fi
            sleep 1
          done
          echo "Background probe process $pid is still alive after cancel." >&2
          exit 1
