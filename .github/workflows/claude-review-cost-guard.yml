name: Claude Review Cost Guard

on:
  workflow_run:
    workflows: [Claude Review]
    types: [in_progress, completed]

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    name: Evaluate metadata burst
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted Cost Guard helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch recent Claude Review metadata
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
          CURRENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_ID}/runs?per_page=100" > "$RUNNER_TEMP/claude-review-runs.json"
          if ! current_run="$(jq -ce --argjson id "$CURRENT_RUN_ID" '
            .workflow_runs
            | map(select(.id == $id))
            | max_by(.run_attempt)
            | select(.)
          ' "$RUNNER_TEMP/claude-review-runs.json")"; then
            jq -cn '{diagnostic_reason:"current_run_metadata_unavailable"}' > "$RUNNER_TEMP/claude-review-attempts.json"
            exit 0
          fi

          current_branch="$(jq -r '.head_branch // empty' <<< "$current_run")"
          current_started_at="$(jq -r '.run_started_at // empty' <<< "$current_run")"
          current_repository="$(jq -r '.head_repository.full_name // empty' <<< "$current_run")"
          listed_run_attempt="$(jq -r '.run_attempt // empty' <<< "$current_run")"
          if ! [[ "$CURRENT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || [ "$CURRENT_RUN_ATTEMPT" -gt 20 ] || [ -z "$current_branch" ] || [ -z "$current_started_at" ] || [ -z "$current_repository" ] || [ "$listed_run_attempt" != "$CURRENT_RUN_ATTEMPT" ]; then
            jq -cn '{diagnostic_reason:"current_run_metadata_incomplete"}' > "$RUNNER_TEMP/claude-review-attempts.json"
            exit 0
          fi
          if [ "$current_repository" != "$GITHUB_REPOSITORY" ]; then
            jq -cn --argjson current_run "$current_run" '{workflow_runs: [$current_run]}' > "$RUNNER_TEMP/claude-review-attempts.json"
            exit 0
          fi

          mapfile -t candidate_runs < <(jq -r \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$current_branch" \
            --arg started_at "$current_started_at" '
              ($started_at | fromdateiso8601) as $current_started_epoch
              | .workflow_runs[]
              | select(
                  .head_repository.full_name == $repository and
                  .head_branch == $branch and
                  (.run_started_at | fromdateiso8601) >= ($current_started_epoch - 1800) and
                  (.run_started_at | fromdateiso8601) <= $current_started_epoch
                )
              | [.id, .run_attempt] | @tsv
            ' "$RUNNER_TEMP/claude-review-runs.json")
          total_attempt_requests=0
          for candidate in "${candidate_runs[@]}"; do
            IFS=$'\t' read -r run_id run_attempt <<< "$candidate"
            if ! [[ "$run_id" =~ ^[0-9]+$ && "$run_attempt" =~ ^[1-9][0-9]*$ ]] || [ "$run_attempt" -gt 20 ]; then
              jq -cn '{diagnostic_reason:"candidate_run_metadata_incomplete"}' > "$RUNNER_TEMP/claude-review-attempts.json"
              exit 0
            fi
            total_attempt_requests=$((total_attempt_requests + run_attempt))
          done
          if [ "$total_attempt_requests" -gt 100 ]; then
            jq -cn '{diagnostic_reason:"attempt_retrieval_limit_exceeded"}' > "$RUNNER_TEMP/claude-review-attempts.json"
            exit 0
          fi

          attempt_files=()
          for candidate in "${candidate_runs[@]}"; do
            IFS=$'\t' read -r run_id run_attempt <<< "$candidate"
            for attempt in $(seq 1 "$run_attempt"); do
              attempt_file="$RUNNER_TEMP/claude-review-run-${run_id}-attempt-${attempt}.json"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/attempts/${attempt}" > "$attempt_file"
              attempt_files+=("$attempt_file")
            done
          done
          jq -s '{workflow_runs: .}' "${attempt_files[@]}" \
            > "$RUNNER_TEMP/claude-review-attempts.json"

      - name: Evaluate Cost Guard
        id: guard
        env:
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
          CURRENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_RUN_ACTIVITY: ${{ github.event.action }}
        run: |
          set -euo pipefail
          evaluation="$(bash .github/scripts/evaluate-claude-review-cost-guard.sh "$RUNNER_TEMP/claude-review-attempts.json" "$CURRENT_RUN_ID" "$GITHUB_REPOSITORY" "$WORKFLOW_RUN_ACTIVITY" "$CURRENT_RUN_ATTEMPT")"
          printf '%s\n' "$evaluation" | jq -e '.result == "notify" or .result == "no_notify" or .result == "ignored" or .result == "diagnostic"' > /dev/null
          printf 'evaluation=%s\n' "$evaluation" >> "$GITHUB_OUTPUT"
          {
            echo '## Claude Review Cost Guard'
            echo
            echo '```json'
            printf '%s\n' "$evaluation"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify abnormal Claude Review activity
        if: fromJSON(steps.guard.outputs.evaluation).result == 'notify'
        env:
          NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
          EVALUATION: ${{ steps.guard.outputs.evaluation }}
          CURRENT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          message="$(jq -r --arg url "$CURRENT_RUN_URL" '
            "Claude Review Cost Guard alert: " + .trigger + "\n" +
            "15-minute window: runs=" + (.run_count | tostring) + ", cancelled=" + (.cancelled_count | tostring) + "\n" +
            "Head branch: " + .head_branch + "\n" +
            "Current run: " + $url + "\n" +
            "Phase 1 notification only; no workflow or review was stopped."
          ' <<< "$EVALUATION")"
          bash .github/scripts/notify-human.sh "$message"
