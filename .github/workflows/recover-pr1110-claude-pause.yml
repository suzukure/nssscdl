name: Recover PR1110 Claude pause

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only check, or separately authorized one-time apply
        type: choice
        options: [check, apply]
        default: check

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  check:
    name: Read-only qualification
    if: >-
      github.repository == 'suzukure/nssscdl' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main' &&
      github.actor == 'suzukure' && github.triggering_actor == 'suzukure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 50ac09107c1d80fdcdbb03dc0e0a63e012be9137
          path: qualification
          fetch-depth: 0
          persist-credentials: false
      - name: Check fixed recovery target
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SOURCE: ${{ github.workspace }}/qualification
        run: bash trusted/.github/scripts/recover-pr1110-claude-pause.sh check

  apply:
    name: Apply fixed recovery
    needs: check
    if: inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: codex-writer-ai/issue-1109
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 50ac09107c1d80fdcdbb03dc0e0a63e012be9137
          path: qualification
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck after writer wait
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_SOURCE: ${{ github.workspace }}/qualification
        run: bash trusted/.github/scripts/recover-pr1110-claude-pause.sh check
      - name: Create reviewer App token
        id: reviewer
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: Consume and hand off once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ steps.reviewer.outputs.token }}
          REVIEWER_APP_SLUG: ${{ steps.reviewer.outputs.app-slug }}
          RECOVERY_SOURCE: ${{ github.workspace }}/qualification
        run: bash trusted/.github/scripts/recover-pr1110-claude-pause.sh apply
