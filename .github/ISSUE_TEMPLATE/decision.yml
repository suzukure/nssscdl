name: 技術上の決定
description: 重要な決定、代替案、影響する工程を記録します。
title: "[決定] "
labels: []
body:
  - type: dropdown
    id: phase
    attributes:
      label: 工程
      options:
        - 要求
        - 基本設計
        - 詳細設計
        - 実装
        - テスト
        - 運用
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景と決めるべきこと
      description: 決定が必要な理由と、決めるべき問いを具体的に記載してください。
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 選択肢とトレードオフ
      description: 現実的な代替案、制約、リスク、採用しなかった選択肢を記載してください。
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: 決定と理由
      description: 決定が確定するまでは `Pending` と記入し、確定後に決定内容と理由へ置き換えてください。
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: 関連する仕様と成果物
      description: POL/BR/REQ/AC/TC/CON/OOSのID、ファイル、節、関連Issueを記載してください。この決定に関係する参照、用語、トレーサビリティ表、図も洗い出し、修正をまとめてレビューできるようにしてください。無関係な決定は混ぜないでください。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 上流と下流への影響
      description: 上流工程への依存、停止する作業、再評価が必要な下流項目、Draft PRをReady for reviewにする前の検証を記載してください。対象外の範囲と安全に分離できる後継対応も明示してください。
    validations:
      required: true
